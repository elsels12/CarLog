<!DOCTYPE html>
<html lang="ja" data-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CarLog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#07101c">
<script>
(function(){
  var colors = { glass:'#07101c', 'glass-light':'#e8f3fa', neumo:'#c9ccd1', 'neumo-dark':'#2c2e33', neon:'#0a0908', hygge:'#d0ae82', industrial:'#2b2c2e', mecha:'#2b3a56', sf:'#1c1626', marchen:'#fdf0f2', pastel:'#f7f8fd', flower:'#fdf6f3' };
  var ids = { glass:1, 'glass-light':1, neumo:1, 'neumo-dark':1, neon:1, hygge:1, industrial:1, mecha:1, sf:1, marchen:1, pastel:1, flower:1 };
  var t = 'glass';
  try{
    var raw = localStorage.getItem('carlog_settings');
    var st = raw ? JSON.parse(raw) : null;
    if(st && ids[st.theme]) t = st.theme;
  }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', colors[t] || colors.glass);
  var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(bar) bar.setAttribute('content', (t==='neumo' || t==='glass-light' || t==='hygge' || t==='marchen' || t==='pastel' || t==='flower') ? 'default' : 'black-translucent');
})();
</script>

<title>CarLog beta 0.9.59</title>
<style>
:root{
  --asphalt:#0c0e11;
  --panel:#232933;
  --panel-light:#2f3746;
  --line:#363f4e;
  --paper:#e9e6df;
  --paper-dim:#b0b7c0;
  --amber:#dfac58;
  --tier-green:#34c773;--tier-yellow:#e6c229;--tier-orange:#ff8a1f;--tier-red:#e5383b;
  --ok:#4ade80;
  --danger:#ff5a2e;
  --cold:#3fa9f5;
  --nav-h:58px;
  --nav-pad:max(env(safe-area-inset-bottom,0px), 14px);
  --tab-home:#dfac58;
  --tab-input:#2dd4bf;
  --tab-hist:#6ea8ff;
  --tab-alert:#ff7a55;
  --tab-set:#ff8fb0;
  --screen: var(--tab-home);
  --font-ui:'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif;
  --font-display:'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif;
  --font-mono:'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif;
  --chip-bg:#181d24;
  --chip-line:#3d4756;
  --chip-fg:#cbd5e1;
  --kpi-bg:#1a1f27;
  --kpi-line:#323a47;
  --hairline:#2c3340;
  --input-bg:#14171b;
  --input-line:#384252;
  --input-fg:#fff;
  --nav-bg:#15181c;
  --topbar-bg:linear-gradient(180deg,#0c0e11 70%,rgba(12,14,17,.9));
  --ink-on-accent:#1a1408;
  --radius-card:10px;
  --radius-tile:12px;
  --radius-chip:16px;
  --radius-btn:8px;
  --card-border-w:2px;
  --card-shadow:none;
  --tile-shadow:none;
  --nav-top-line:2px solid var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--asphalt);color:var(--paper);
  font-family:var(--font-ui);width:100%;max-width:100%;overflow-x:hidden;}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + 10px + var(--nav-pad));}
button,select,input,textarea{font:inherit;color:inherit;touch-action:manipulation;}
button{cursor:pointer;}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.kpi .val,.stat-line .v,.rank-row .km,.rank-row .kml,.rank-row .lit,.alert-item .adetail,.alert-item .meta,.bar-row .amt,.hist-item .kml,.hist-item .d,.hist-item .a,.int-row input,.home-banner .banner-odo{font-variant-numeric:tabular-nums;}
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);
  border-bottom:3px solid color-mix(in srgb, var(--screen) 72%, var(--line));padding:8px 12px 8px;display:flex;align-items:center;gap:6px;}
.topbar .brand{flex:0 0 auto;flex-shrink:0;min-width:auto;}
.topbar .eyebrow{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--screen);text-transform:none;}
.beta-badge{display:inline-block;margin-left:6px;vertical-align:middle;font-family:var(--font-mono);font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--screen);border:1.5px solid color-mix(in srgb, var(--screen) 55%, transparent);background:color-mix(in srgb, var(--screen) 14%, transparent);border-radius:4px;padding:1px 5px;position:relative;top:-2px;text-transform:uppercase;}
body[data-tab="home"]{--screen:var(--tab-home);}
body[data-tab="input"]{--screen:var(--tab-input);}
body[data-tab="hist"]{--screen:var(--tab-hist);}
body[data-tab="alert"]{--screen:var(--tab-alert);}
body[data-tab="set"]{--screen:var(--tab-set);}
/* 上のバー（CarLog・バージョン・BETA）はタブを切り替えても色を変えない */
.topbar{--screen:var(--tab-home);}
.topbar h1{font-size:22px;letter-spacing:.02em;line-height:1.1;text-transform:none;white-space:nowrap;}
.topbar .tagline{font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--paper-dim);margin-top:2px;letter-spacing:.02em;line-height:1.3;white-space:nowrap;overflow:visible;text-overflow:clip;width:auto;min-width:0;}
.sc-grid{--sc-gap:6px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-flow:dense;gap:var(--sc-gap);margin:0 0 8px;align-items:stretch;}
.sc-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-tile);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--paper);min-height:64px;box-shadow:var(--tile-shadow);grid-column:span 2;grid-row:span 2;min-width:0;}
.sc-tile:active{border-color:var(--amber);background:rgba(223,172,88,.08);}
.sc-tile .icn{width:28px;height:28px;color:var(--amber);display:flex;align-items:center;justify-content:center;}
.sc-tile .icn svg{width:26px;height:26px;display:block;}
.sc-tile .lbl{font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.2;text-align:center;}
.sc-tile.sc-fill{border-width:1.5px;border-style:solid;}
.sc-tile.sc-fill .lbl{font-weight:800;text-shadow:0 1px 1px rgba(0,0,0,.4);}
.sc-tile.sc-fill .icn{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}
#scWrap{container-type:inline-size;}
#scGrid.sc-grid{--sc-cell:calc((100cqi - 7 * var(--sc-gap)) / 8);grid-auto-rows:var(--sc-cell);}
#scGrid .sc-tile{min-height:0;height:auto;}
#scGrid .sc-tile.sc-s{grid-column:span 1;grid-row:span 1;padding:3px 2px 2px;gap:1px;}
#scGrid .sc-tile.sc-s .icn{width:18px;height:18px;}
#scGrid .sc-tile.sc-s .icn svg{width:16px;height:16px;}
#scGrid .sc-tile.sc-s .lbl{font-size:8px;line-height:1.1;letter-spacing:0;max-width:100%;overflow:hidden;white-space:nowrap;word-break:normal;}
#scGrid .sc-tile.sc-s.sc-icon-only .lbl{display:none;}
#scGrid .sc-tile.sc-s.sc-icon-only .icn{width:20px;height:20px;}
#scGrid .sc-tile.sc-s.sc-icon-only .icn svg{width:18px;height:18px;}
#scGrid .sc-tile.sc-m{grid-column:span 2;grid-row:span 2;}
#scGrid .sc-tile.sc-l{grid-column:span 4;grid-row:span 4;min-height:0;height:100%;padding:12px 8px;gap:8px;}
#scGrid .sc-tile.sc-l .icn{width:48px;height:48px;}
#scGrid .sc-tile.sc-l .icn svg{width:44px;height:44px;}
#scGrid .sc-tile.sc-l .lbl{font-size:13px;font-weight:800;line-height:1.25;}
#scGrid .sc-tile.sc-l3{grid-column:span 4;grid-row:span 3;flex-direction:column;justify-content:center;align-items:center;padding:10px 8px;gap:6px;}
#scGrid .sc-tile.sc-l3 .icn{width:40px;height:40px;}
#scGrid .sc-tile.sc-l3 .icn svg{width:36px;height:36px;}
#scGrid .sc-tile.sc-l3 .lbl{font-size:13px;font-weight:800;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:clip;}
#scGrid .sc-tile.sc-w{grid-column:span 2;grid-row:span 1;flex-direction:row;justify-content:flex-start;align-items:center;padding:2px 5px 2px 4px;gap:3px;}
#scGrid .sc-tile.sc-w .icn{width:14px;height:14px;flex-shrink:0;}
#scGrid .sc-tile.sc-w .icn svg{width:13px;height:13px;}
#scGrid .sc-tile.sc-w .lbl{flex:1;min-width:0;font-size:9px;font-weight:700;line-height:1.15;letter-spacing:0;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:clip;word-break:normal;}
#scGrid .sc-tile.sc-mw{grid-column:span 4;grid-row:span 2;flex-direction:row;justify-content:flex-start;align-items:center;padding:8px 12px;gap:10px;}
#scGrid .sc-tile.sc-mw .icn{width:32px;height:32px;flex-shrink:0;}
#scGrid .sc-tile.sc-mw .icn svg{width:30px;height:30px;}
#scGrid .sc-tile.sc-mw .lbl{flex:1;min-width:0;font-size:14px;font-weight:800;line-height:1.25;letter-spacing:0;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:clip;word-break:normal;}
.sc-edit{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:13px;}
.sc-edit .nm{flex:1;font-weight:600;}
.sc-edit .move{display:flex;gap:4px;}
details.tax-fold{background:var(--panel);border:var(--card-border-w) solid var(--line);border-radius:var(--radius-card);padding:8px 10px;margin-bottom:8px;box-shadow:var(--card-shadow);}
details.tax-fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-size:11px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;font-weight:700;}
details.tax-fold>summary::-webkit-details-marker{display:none;}
details.tax-fold>summary .hint{font-family:var(--font-ui);font-size:10px;letter-spacing:0;color:var(--paper-dim);text-transform:none;font-weight:500;}
details.tax-fold[open]>summary{margin-bottom:6px;}
#avgFuelKpi{cursor:pointer;}

.icon-btn,.chip-btn{background:var(--chip-bg);border:1px solid var(--chip-line);color:var(--chip-fg);border-radius:16px;
  font-size:11px;font-weight:700;padding:5px 10px;white-space:nowrap;}
.icon-btn:active,.chip-btn:active{border-color:var(--amber);color:var(--amber);}
.icon-btn.warn{border-color:var(--amber);color:var(--amber);background:rgba(223,172,88,.1);}
#app{padding:8px 10px 6px;max-width:480px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--nav-bg);
  border-top:var(--nav-top-line);height:calc(var(--nav-h) + var(--nav-pad));
  padding:0 14px var(--nav-pad);}
.nav button{flex:1;min-width:0;background:none;border:0;color:color-mix(in srgb,var(--tab,#8b95a5) 58%,#8a93a3);
  font-size:11px;font-weight:700;letter-spacing:.02em;padding:0;height:100%;position:relative;
  display:flex;align-items:center;justify-content:center;}
.nav button[data-page="home"]{--tab:var(--tab-home);}
.nav button[data-page="input"]{--tab:var(--tab-input);}
.nav button[data-page="hist"]{--tab:var(--tab-hist);}
.nav button[data-page="alert"]{--tab:var(--tab-alert);}
.nav button[data-page="set"]{--tab:var(--tab-set);}
.nav button .tab-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:calc(100% - 12px);max-width:62px;min-width:0;padding:5px 2px 4px;border-radius:12px;}
.nav button .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
.nav button .ic svg{width:20px;height:20px;display:block;}
.nav button .tab-lbl{font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.nav button.active{color:var(--ink-on-accent);}
.nav-ind{position:absolute;inset:0;pointer-events:none;opacity:0;}
.nav-ind.ready{opacity:1;}
.nav-ind-pill{position:absolute;left:0;top:0;width:0;height:0;border-radius:12px;background:var(--tab);box-shadow:0 0 0 1px color-mix(in srgb,var(--tab) 70%,#fff 10%);will-change:transform;}
.nav-ind-bar{position:absolute;left:0;top:0;width:0;height:3px;border-radius:0 0 3px 3px;background:var(--tab);will-change:transform;}
.nav.is-anim .nav-ind-pill,.nav.is-anim .nav-ind-bar{transition:transform 220ms cubic-bezier(0.2,0.8,0.2,1),width 220ms cubic-bezier(0.2,0.8,0.2,1),background-color 220ms cubic-bezier(0.2,0.8,0.2,1),box-shadow 220ms cubic-bezier(0.2,0.8,0.2,1);}
.nav.is-anim button{transition:color 220ms cubic-bezier(0.2,0.8,0.2,1);}
.card{background:var(--panel);border:var(--card-border-w) solid var(--line);border-radius:var(--radius-card);padding:8px 10px;margin-bottom:8px;box-shadow:var(--card-shadow);}
.card h2{font-size:11px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;}
.card h2 .hint{font-family:var(--font-ui);font-size:10px;letter-spacing:0;color:var(--paper-dim);text-transform:none;font-weight:600;}
.row{display:flex;gap:6px;align-items:stretch;}
.kpi-row{margin-bottom:8px;}
.kpi{flex:1;background:var(--kpi-bg);border:2px solid var(--kpi-line);border-radius:var(--radius-btn);padding:6px 8px;min-width:0;box-shadow:var(--tile-shadow);}
.kpi .lbl{font-size:10px;color:var(--paper-dim);letter-spacing:.04em;font-weight:700;}
.kpi .val{font-family:var(--font-mono);font-size:16px;font-weight:800;margin-top:1px;letter-spacing:-.02em;}
.kpi .sub{font-size:10px;color:var(--paper-dim);margin-top:1px;font-weight:600;}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--hairline);font-size:12px;}
.stat-line:last-child{border-bottom:0;}
.stat-line .k{color:var(--paper-dim);font-weight:600;}
.stat-line .v{font-family:var(--font-mono);font-weight:800;}
.rank-row{display:flex;align-items:baseline;gap:6px;padding:2px 0;border-bottom:1px solid var(--hairline);font-size:12px;}
.rank-row:last-child{border-bottom:0;}
.rank-row .rk{flex-shrink:0;width:22px;text-align:center;font-size:14px;line-height:1.2;}
.rank-row .km{font-weight:800;font-family:var(--font-mono);}
.rank-row .dt{color:var(--paper-dim);font-weight:600;flex:1;font-size:11px;}
.rank-row .kml{font-family:var(--font-mono);font-weight:800;font-size:11px;}
.rank-row .lit{color:var(--paper-dim);font-family:var(--font-mono);font-weight:700;font-size:11px;white-space:nowrap;}
.bk-check{display:flex;align-items:center;gap:6px;margin:4px 0 2px;font-size:11px;color:var(--paper-dim);font-weight:600;}
.bk-check input{margin:0;}
.bk-bar{margin-top:6px;padding:6px 8px;border:1px solid var(--chip-line);border-radius:8px;background:var(--chip-bg);}
.btn.danger{border-color:var(--danger);color:var(--danger);}
.csv-chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px;}
.csv-chips button{background:var(--chip-bg);border:1px solid var(--chip-line);color:var(--chip-fg);border-radius:14px;font-size:10px;font-weight:700;padding:4px 8px;}
.csv-chips button.on{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 85%, transparent);color:var(--ink-on-accent);}
.csv-mini{display:flex;gap:8px;margin:0 0 6px;}
.csv-mini button{background:none;border:0;color:var(--amber);font-size:10px;font-weight:700;padding:0;cursor:pointer;}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;letter-spacing:.05em;border:1.5px solid transparent;}
.badge.measu{background:rgba(223,172,88,.15);color:var(--amber);border-color:rgba(223,172,88,.45);}
.badge.heavy{background:rgba(255,90,46,.18);color:var(--danger);border-color:rgba(255,90,46,.45);}
.badge.ok{background:rgba(74,222,128,.16);color:var(--ok);border-color:rgba(74,222,128,.45);}
.badge.soon{background:rgba(223,172,88,.18);color:var(--amber);border-color:rgba(223,172,88,.45);}
.badge.overdue{background:rgba(255,90,46,.2);color:var(--danger);border-color:rgba(255,90,46,.5);}
.badge.unknown{background:#2a303a;color:#c5cdd6;border-color:#4a5464;}
.alert-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--hairline);font-size:12px;}
.alert-item:last-child{border-bottom:0;}
.alert-item .name{flex:1;font-weight:700;min-width:0;}
.alert-item .adetail{font-size:10px;color:var(--paper-dim);font-family:var(--font-mono);margin-top:2px;line-height:1.35;font-weight:600;}
.alert-item .meta{font-size:10px;color:var(--paper-dim);font-family:var(--font-mono);text-align:right;font-weight:700;}
.link-btn{background:none;border:0;color:var(--amber);font-size:10px;font-weight:700;padding:0 0 0 4px;cursor:pointer;vertical-align:baseline;}
.alert-card{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;
  column-gap:8px;row-gap:1px;align-items:center;padding:9px 12px;margin:0 0 6px;
  border:1px solid var(--line);border-radius:var(--radius-card);background:var(--kpi-bg);box-sizing:border-box;}
.alert-card:last-child{margin-bottom:0;}
.alert-card-head{grid-column:1;grid-row:1;display:flex;align-items:center;gap:5px;min-width:0;}
.alert-card-head .name{font-size:15px;font-weight:800;min-width:0;line-height:1.3;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert-card .badge{flex:0 0 auto;font-size:10px;font-weight:700;padding:2px 5px;border-radius:999px;letter-spacing:.02em;line-height:1.2;}
.alert-card-head .alert-edit{
  position:relative;flex:0 0 auto;box-sizing:content-box;width:1.2em;height:1.2em;margin:0 0 0 3px;padding:2px;
  font-size:10px;line-height:1;min-width:0;min-height:0;border-radius:999px;
  border:1.5px solid color-mix(in srgb, var(--paper-dim) 40%, transparent);
  background:color-mix(in srgb, var(--paper-dim) 14%, transparent);color:var(--paper-dim);
  display:inline-flex;align-items:center;justify-content:center;
}
.alert-card-head .alert-edit svg{width:10px;height:10px;display:block;}
.alert-card-head .alert-edit::before{content:"";position:absolute;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);}
.alert-card-remain{grid-column:2;grid-row:1 / 3;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;min-width:0;max-width:38%;width:max-content;justify-self:end;align-self:center;}
.alert-card-sub{grid-column:1;grid-row:2;display:flex;align-items:baseline;gap:8px;min-width:0;margin-top:0;}
.alert-card-foot{grid-column:1 / -1;grid-row:3;display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;margin-top:1px;}
.alert-card-actions{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:4px;margin:0;flex:0 0 auto;}
.alert-info{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;line-height:1.4;color:var(--paper-dim);font-family:var(--font-mono);}
.alert-info .alert-date{white-space:nowrap;}
.alert-remain{flex:0 0 auto;font-size:13px;font-weight:800;line-height:1.35;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;letter-spacing:-.02em;}
@media (max-width:360px){
  .alert-card{padding:9px 10px;column-gap:6px;}
  .alert-card-head{gap:4px;}
  .alert-card .badge{padding:1px 4px;font-size:9px;letter-spacing:0;}
  .alert-card-head .alert-edit{font-size:9px;padding:1px;margin-left:2px;}
  .alert-card-head .alert-edit svg{width:9px;height:9px;}
  .alert-remain{font-size:12px;}
}

.alert-remain.is-ok{color:var(--ok);}

/* ----- glass: ink/navy + analogous blue→cyan light, visionOS-like frost ----- */
html[data-theme="glass"]{
  --asphalt:transparent;
  --panel:rgba(255,255,255,.16);
  --panel-light:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.44);
  --paper:#f3f7ff;
  --paper-dim:rgba(220,230,245,.82);
  --amber:#7ee0ff;
  --ok:#5ee0b5;
  --danger:#ff7a62;
  --cold:#7ad7ff;
  --tab-home:#7ee0ff;--tab-input:#5ee0c8;--tab-hist:#6aa8ff;--tab-alert:#ff7a62;--tab-set:#9ad7ff;

  --chip-bg:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.32);--chip-fg:#f3f7ff;
  --kpi-bg:rgba(255,255,255,.10);--kpi-line:rgba(255,255,255,.28);
  --hairline:rgba(255,255,255,.18);
  --input-bg:rgba(6,12,24,.55);--input-line:rgba(255,255,255,.32);--input-fg:#fff;
  --nav-bg:rgba(7,14,28,.84);
  --topbar-bg:rgba(7,14,28,.55);
  --ink-on-accent:#07101c;
  --radius-card:20px;--radius-tile:16px;--radius-chip:999px;--radius-btn:12px;
  --card-border-w:1px;
  --card-shadow:0 8px 24px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.72);
  --tile-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  --nav-top-line:1px solid rgba(255,255,255,.2);
  --glass-fill:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.11));
}
html[data-theme="glass"]{
  background-color:#07101c;
  background-image:
    radial-gradient(100vw 85vh at 8% -12%, rgba(70,150,255,.64), transparent 64%),
    radial-gradient(92vw 78vh at 96% 90%, rgba(36,230,215,.54), transparent 60%),
    radial-gradient(58vw 50vh at 78% 14%, rgba(28,200,140,.32), transparent 62%);

}

}

  --chip-bg:#120e0c;--chip-line:#2ec8d4;--chip-fg:#e8f4f0;
  --kpi-bg:rgba(10,8,7,.9);--kpi-line:#2ec8d4;
  --hairline:rgba(46,200,212,.16);
  --input-bg:#120e0c;--input-line:#2ec8d4;--input-fg:#e8f4f0;
  --nav-bg:#0a0908;
  --topbar-bg:rgba(10,9,8,.94);
  --ink-on-accent:#0a0908;
  --radius-card:16px;--radius-tile:14px;--radius-chip:12px;--radius-btn:12px;
  --card-border-w:2px;
  --tube:#2ec8d4;
  --card-shadow:0 0 0 3px #0a0908, 0 0 0 5px color-mix(in srgb, var(--tube) 70%, #000), 0 0 7px color-mix(in srgb, var(--tube) 70%, transparent), 0 0 16px color-mix(in srgb, var(--tube) 40%, transparent), inset 0 0 0 1px rgba(255,255,255,.18), inset 0 0 8px color-mix(in srgb, var(--tube) 16%, transparent);
  --tile-shadow:0 0 6px color-mix(in srgb, var(--tube) 35%, transparent);
  --nav-top-line:0 solid transparent;
}
html[data-theme="neon"]{
  background-color:#0a0908;
  background-image:
    radial-gradient(80% 50% at 50% -5%, rgba(46,200,212,.11), transparent 68%),
    radial-gradient(70% 45% at 88% 108%, rgba(224,154,42,.08), transparent 64%),
    radial-gradient(18px 10px at 22% 48%, rgba(20,14,8,.55), transparent 70%),
    radial-gradient(28px 14px at 71% 62%, rgba(0,0,0,.55), transparent 70%),
    radial-gradient(50% 40% at 12% 80%, rgba(36,22,12,.4), transparent 70%),
    radial-gradient(40% 30% at 88% 18%, rgba(0,0,0,.55), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 13px, rgba(0,0,0,.68) 13px 14px),
    linear-gradient(90deg, rgba(0,0,0,.62) 1px, transparent 1px) 0 0 / 70px 28px,
    linear-gradient(90deg, rgba(0,0,0,.58) 1px, transparent 1px) 35px 14px / 70px 28px,
    linear-gradient(180deg, #14110e, #0a0908 42%, #070605);
  background-attachment:fixed;
}
html[data-theme="neon"] body{background:transparent;}
html[data-theme="neon"] body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 22%, rgba(0,0,0,.66) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
  background-size:auto, 160px 160px;
  opacity:.55;
}
html[data-theme="neon"] #app{position:relative;z-index:1;}
html[data-theme="neon"] .topbar{z-index:30;border-bottom:0;box-shadow:0 1px 0 rgba(46,200,212,.18);}
html[data-theme="neon"] .nav{z-index:40;box-shadow:0 -1px 10px rgba(0,0,0,.55);}
html[data-theme="neon"] .modal-bg{z-index:80;}

/* section tubes: cyan, hot pink, acid lime, warm red/amber — no purple */

/* ----- home banner (optional, per vehicle) ----- */

}

#page-input{padding-bottom:70px;}
html[data-theme] #page-input .cat-select{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:52px;padding:10px 14px;margin:0 0 8px;
  border:2px solid var(--input-line);border-radius:10px;box-sizing:border-box;
  background:var(--input-bg);color:var(--input-fg);
  font-size:16px;font-weight:700;text-align:left;line-height:1.2;
}
html[data-theme] #page-input .cat-select:focus,
html[data-theme] #page-input .cat-select:focus-visible{
  outline:none;border-color:var(--amber);
}
html[data-theme] #page-input .cat-select .icn{
  width:28px;height:28px;flex-shrink:0;color:var(--amber);
  display:flex;align-items:center;justify-content:center;
}
html[data-theme] #page-input .cat-select .icn svg{width:24px;height:24px;display:block;}
html[data-theme] #page-input .cat-select .lbl{
  flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
html[data-theme] #page-input .cat-select .chev{
  flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  color:var(--paper-dim);opacity:.55;
}
html[data-theme] #page-input .cat-select .chev svg{width:18px;height:18px;display:block;}
#modal.cat-sheet{transition:none;animation:none;}
#modal.cat-sheet .cat-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;}
#modal.cat-sheet .cat-sheet-head h3{margin:0;flex:1;min-width:0;}
#modal.cat-sheet .cat-sheet-close{
  flex-shrink:0;width:36px;height:36px;padding:0;border:0;border-radius:8px;
  background:transparent;color:var(--paper);font-size:22px;font-weight:500;line-height:1;
}


.grade-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;}
html[data-theme] #page-input .grade-chips button{
  flex:1 1 0;min-width:0;min-height:48px;padding:10px 6px;font-size:13px;font-weight:700;
  border-radius:12px;border-width:2px;box-sizing:border-box;
  white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:1.2;
}
.op-row{margin:6px 0 8px;}
.op-row{max-width:100%;overflow:hidden;}
.op-row input[type=range]{display:block;width:100%;max-width:100%;min-width:0;margin:0;box-sizing:border-box;accent-color:var(--amber);}
.op-presets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0;}
.op-presets button{min-height:40px;padding:8px 12px;font-size:13px;font-weight:700;}
.op-val{font-variant-numeric:tabular-nums;font-weight:800;margin-left:6px;}
.help-topics{display:flex;flex-direction:column;gap:8px;margin:8px 0;}
.help-topics button, #modal.help-modal .btn-row .btn{
  min-height:48px;padding:12px 14px;font-size:15px;font-weight:700;text-align:left;
}
.help-topic-body{font-size:14px;line-height:1.6;color:var(--paper);margin:8px 0 16px;}
.help-topic-body p{margin:0 0 10px;}
.help-topic-body ol{margin:0 0 10px;padding-left:1.3em;}
.help-topic-body li{margin:0 0 6px;}
#modal.help-modal, #modal.int-editor, #modal.repl-sheet, #modal.cat-sheet{transition:none;animation:none;}

#page-alert .add-int-row{margin-top:12px;}
#vehCard.has-banner{padding-top:0;overflow:hidden;}
#vehCard.has-banner .home-banner{
  margin:0 -10px 8px;border:0;box-shadow:none;border-radius:0;height:128px;padding:0;background:transparent;
}
#vehCard.has-banner .home-banner .banner-photo{border-radius:0;height:100%;}
#vehCard.has-banner .home-banner .banner-scrim{border-radius:0;inset:0;}
#vehCard.has-banner .home-banner .banner-meta{left:12px;right:12px;bottom:10px;}
html[data-theme="neumo"] #vehCard.has-banner .home-banner,
html[data-theme="neumo-dark"] #vehCard.has-banner .home-banner{margin-bottom:10px;}
.int-block{padding:12px 0;border-bottom:1px solid var(--hairline);}
.int-block:last-of-type{border-bottom:0;}
.int-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.int-top .int-name{font-weight:800;font-size:14px;}
.int-summary{font-size:12px;font-weight:600;color:var(--paper-dim);margin-top:8px;line-height:1.45;}
.int-summary .next{color:var(--paper);font-weight:700;}
.int-set-last,.alert-set-last{background:none;border:0;color:var(--amber);font-size:12px;font-weight:700;padding:8px 0;cursor:pointer;text-align:left;}
html[data-theme] #page-alert .int-block input[type=number],
html[data-theme] #page-alert .int-block input[type=date],
html[data-theme] #page-alert .int-block input[type=text],
html[data-theme] #modal.repl-sheet input[type=number],
html[data-theme] #modal.repl-sheet input[type=date],
html[data-theme] #modal.repl-sheet textarea,
html[data-theme] #modal.int-editor input[type=number],
html[data-theme] #modal.int-editor input[type=date],
html[data-theme] #modal.int-editor input[type=text]{
  min-height:52px;font-size:18px;padding:12px 14px;border-width:2px;border-radius:10px;box-sizing:border-box;width:100%;
  font-variant-numeric:tabular-nums;
}
html[data-theme] #page-alert .int-block input[type=date],
html[data-theme] #modal.repl-sheet input[type=date]{
  width:15.5em;max-width:100%;font-size:16px;min-height:52px;display:inline-block;
}
html[data-theme] #modal.repl-sheet textarea{font-size:16px;min-height:72px;}
/* 2列の中の日付欄: iOS の日付欄は中身の幅が大きく、隣の欄に被るため、列の幅に収める */
html[data-theme] #modal .grid2 input[type=date]{min-width:0;max-width:100%;width:100%;display:block;-webkit-appearance:none;appearance:none;font-size:16px;text-align:left;}

/* ===== 0.9.57 追加テーマ: hygge / industrial / mecha / sf（どれも特定の作品・ロゴ・配色をまねないオリジナル） ===== */
html[data-theme="industrial"],html[data-theme="sf"]{color-scheme:dark;}
html[data-theme="hygge"],html[data-theme="mecha"]{color-scheme:light;}

/* swatches */
.sw-hygge{background:
  radial-gradient(9px 9px at 26% 52%, #c07a5c 0 98%, transparent 100%),
  radial-gradient(9px 9px at 50% 52%, #8fa98a 0 98%, transparent 100%),
  radial-gradient(9px 9px at 74% 52%, #c9a77c 0 98%, transparent 100%),
  #f3ece1;border-color:#dccfbc !important;}
.sw-industrial{background:
  linear-gradient(90deg, transparent 0 70%, #d9822b 70% 76%, transparent 76%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
  linear-gradient(180deg, #4a4d52, #2c2e31);border-color:#5f636a !important;border-radius:3px !important;}
.sw-mecha{background:
  linear-gradient(#2a5fb8,#2a5fb8) 12% 50%/18% 34% no-repeat,
  linear-gradient(#cf3a32,#cf3a32) 36% 50%/8% 34% no-repeat,
  linear-gradient(#f0b400,#f0b400) 50% 50%/6% 34% no-repeat,
  linear-gradient(90deg, transparent 64%, #b9bfc9 64% 65%, transparent 65%),
  #f4f5f7;border-color:#aeb4be !important;border-radius:3px !important;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
.sw-sf{background:
  linear-gradient(#ff8a1f,#ff8a1f) 8% 30%/40% 2px no-repeat,
  linear-gradient(#a6e23a,#a6e23a) 8% 70%/22% 2px no-repeat,
  linear-gradient(90deg, transparent 0 60%, rgba(255,138,31,.5) 60% 61%, transparent 61%),
  #0c0f0d;border-color:#ff8a1f !important;border-radius:2px !important;}

html[data-theme="mecha"]{

    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function ensureCurrentVehicle(){

function normalizeShortcutIconSize(v){
  v = String(v==null?'':v).toLowerCase();
  if(v==='s' || v==='small' || v==='小') return 's';
  if(v==='l3' || v==='large3' || v==='l-3' || v==='大') return 'l3';
  if(v==='l' || v==='large' || v==='xl' || v==='xlarge' || v==='特大') return 'l';
  if(v==='mw' || v==='medium-wide' || v==='mediumwide' || v==='mwide' || v==='中横' || v==='中横長') return 'mw';
  if(v==='w' || v==='wide' || v==='sw' || v==='横長' || v==='小横長' || v==='小横') return 'w';
  if(v==='m' || v==='medium' || v==='中' || v==='') return 'm';
  return 'm';
}
function defaultShortcutIconSize(){
  return normalizeShortcutIconSize(state.settings && state.settings.shortcutIconSize) || 'm';
}
function shortcutSizeMap(){
  const m = state.settings && state.settings.shortcutSizes;
  return (m && typeof m==='object' && !Array.isArray(m)) ? m : {};
}
function shortcutSizeOf(sc){
  sc = sc || {};
  if(sc.size) return normalizeShortcutIconSize(sc.size);
  const id = sc.id || '';
  const map = shortcutSizeMap();
  if(id && map[id]) return normalizeShortcutIconSize(map[id]);
  if(sc.customId){
    const cat = customCatById(sc.customId);
    if(cat && cat.size) return normalizeShortcutIconSize(cat.size);
  } else {
    const look = builtinLook(sc.id) || (sc.category ? builtinLook(sc.category) : null);
    if(look && look.size) return normalizeShortcutIconSize(look.size);
  }
  return defaultShortcutIconSize();
}
function setShortcutSize(id, size, persist){
  size = normalizeShortcutIconSize(size) || 'm';
  if(!state.settings.shortcutSizes || typeof state.settings.shortcutSizes!=='object' || Array.isArray(state.settings.shortcutSizes)){
    state.settings.shortcutSizes = {};
  }
  if(id) state.settings.shortcutSizes[id] = size;
  if(persist!==false) persistSettings();
  return size;
}
/* Back-compat: used to set the global size; now sets the inherited default for items without a size. */
function applyShortcutIconSize(size, persist){
  size = normalizeShortcutIconSize(size) || 'm';
  if(state && state.settings){
    state.settings.shortcutIconSize = size;
    if(persist) persistSettings();

  return size;
}
function shortcutIconSize(){ return defaultShortcutIconSize(); }
function persistSettings(){ saveJson(KEYS.settings, state.settings); }
function persistCategories(){ saveJson(KEYS.categories, state.customCats); }
function persistLooks(){ saveJson(KEYS.looks, state.builtinLooks); }

/* ----- home banners (IndexedDB, per vehicle) ----- */
const BANNER_DB_NAME = 'carlog_banners';
const BANNER_STORE = 'banners';
const BANNER_MAX_WIDTH = 1200;
const BANNER_MAX_BYTES = 250000;
let bannerDb = null;
const bannerCache = Object.create(null);

function bannerSupportWebp(){
  try{
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  }catch(e){ return false; }
}
function revokeBannerUrl(rec){
  if(rec && rec.url && String(rec.url).indexOf('blob:')===0){
    try{ URL.revokeObjectURL(rec.url); }catch(e){}
  }
}
function openBannerDb(){
  return new Promise(function(resolve, reject){
    if(bannerDb){ resolve(bannerDb); return; }
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(BANNER_DB_NAME, 1);
    req.onupgradeneeded = function(){
      const db = req.result;
      if(!db.objectStoreNames.contains(BANNER_STORE)) db.createObjectStore(BANNER_STORE, { keyPath:'vehicleId' });
    };
    req.onsuccess = function(){ bannerDb = req.result; resolve(bannerDb); };
    req.onerror = function(){ reject(req.error || new Error('banner db')); };
  });
}
function bannerStore(mode){
  return openBannerDb().then(function(db){
    const tx = db.transaction(BANNER_STORE, mode || 'readonly');
    return tx.objectStore(BANNER_STORE);
  });
}
function idbReq(req){
  return new Promise(function(resolve, reject){
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function cacheBannerRec(rec){
  if(!rec || !rec.vehicleId) return null;
  const prev = bannerCache[rec.vehicleId];
  if(prev && prev.url && prev.url !== rec.url) revokeBannerUrl(prev);
  const url = rec.url || (rec.blob ? URL.createObjectURL(rec.blob) : '');
  const out = {
    vehicleId: rec.vehicleId,
    blob: rec.blob,
    mime: rec.mime || (rec.blob && rec.blob.type) || 'image/jpeg',
    focalX: clampBannerFocal(rec.focalX, 50),
    focalY: clampBannerFocal(rec.focalY, 50),
    zoom: clampBannerZoom(rec.zoom),
    url: url,
    updatedAt: rec.updatedAt || new Date().toISOString()
  };
  bannerCache[rec.vehicleId] = out;
  return out;
}
function clampBannerFocal(v, fallback){
  const n = Number(v);
  if(!isFinite(n)) return fallback == null ? 50 : fallback;
  return Math.max(0, Math.min(100, n));
}
function clampBannerZoom(v){
  const n = Number(v);
  if(!isFinite(n)) return 1;
  return Math.max(1, Math.min(2.2, n));
}
function getBanner(vehicleId){
  return bannerCache[vehicleId] || null;
}
function hasBanner(vehicleId){
  const rec = bannerCache[vehicleId];
  return !!(rec && rec.url);
}
function putBanner(vehicleId, rec){
  if(!vehicleId || !rec || !rec.blob) return Promise.reject(new Error('banner required'));
  const stored = cacheBannerRec({
    vehicleId: vehicleId,
    blob: rec.blob,
    mime: rec.mime || rec.blob.type || 'image/jpeg',
    focalX: rec.focalX,
    focalY: rec.focalY,
    zoom: rec.zoom,
    updatedAt: new Date().toISOString()
  });
  return bannerStore('readwrite').then(function(st){
    return idbReq(st.put({
      vehicleId: vehicleId,
      blob: stored.blob,
      mime: stored.mime,
      focalX: stored.focalX,
      focalY: stored.focalY,
      zoom: stored.zoom,
      updatedAt: stored.updatedAt
    }));
  }).then(function(){ return stored; });
}
function removeBanner(vehicleId){
  const prev = bannerCache[vehicleId];
  if(prev){ revokeBannerUrl(prev); delete bannerCache[vehicleId]; }
  return bannerStore('readwrite').then(function(st){
    return idbReq(st.delete(vehicleId));
  }).catch(function(){ return null; });
}
function clearAllBanners(){
  Object.keys(bannerCache).forEach(function(id){ revokeBannerUrl(bannerCache[id]); delete bannerCache[id]; });
  return bannerStore('readwrite').then(function(st){
    return idbReq(st.clear());
  }).catch(function(){ return null; });
}
function loadAllBanners(){
  return bannerStore('readonly').then(function(st){
    return idbReq(st.getAll());
  }).then(function(rows){
    (rows || []).forEach(function(row){ cacheBannerRec(row); });
    return bannerCache;
  });
}
function initBanners(){
  return openBannerDb().then(function(){ return loadAllBanners(); }).catch(function(){ return null; });
}
function blobToImage(source){
  return new Promise(function(resolve, reject){
    if(!source){ reject(new Error('no image')); return; }
    if(typeof createImageBitmap === 'function' && (source instanceof Blob)){
      createImageBitmap(source).then(resolve).catch(function(){
        blobToImageEl(source).then(resolve, reject);
      });
      return;
    }
    blobToImageEl(source).then(resolve, reject);
  });
}
function blobToImageEl(source){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('画像を読めません')); };
    if(typeof source === 'string'){ img.src = source; return; }
    img.src = URL.createObjectURL(source);
    img.onload = function(){
      try{ URL.revokeObjectURL(img.src); }catch(e){}
      resolve(img);
    };
  });
}
function canvasToBlob(canvas, mime, quality){
  return new Promise(function(resolve, reject){
    canvas.toBlob(function(blob){
      if(!blob) reject(new Error('圧縮に失敗しました'));
      else resolve(blob);
    }, mime, quality);
  });
}
function compressBannerImage(source, opts){
  opts = opts || {};
  const maxW = opts.maxWidth || BANNER_MAX_WIDTH;
  const maxBytes = opts.maxBytes || BANNER_MAX_BYTES;
  const preferWebp = opts.mime ? opts.mime === 'image/webp' : bannerSupportWebp();
  return blobToImage(source).then(function(img){
    let w = img.naturalWidth || img.width || 0;
    let h = img.naturalHeight || img.height || 0;
    if(!w || !h) return Promise.reject(new Error('画像サイズが不明です'));
    if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    function paint(tw, th){
      canvas.width = tw; canvas.height = th;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, tw, th);
      ctx.drawImage(img, 0, 0, tw, th);
    }
    paint(w, h);
    const tryMime = preferWebp ? 'image/webp' : 'image/jpeg';
    function encode(mime, q, tw, th){
      if(tw !== canvas.width || th !== canvas.height) paint(tw, th);
      return canvasToBlob(canvas, mime, q).then(function(blob){
        return { blob:blob, mime:blob.type || mime, width:tw, height:th, quality:q };
      });
    }
    function shrink(mime, tw, th, q){
      return encode(mime, q, tw, th).then(function(out){
        if(out.blob.size <= maxBytes || (q <= 0.62 && tw <= 960)) return out;
        if(q > 0.62) return shrink(mime, tw, th, Math.max(0.62, q - 0.08));
        const nw = Math.round(tw * 0.85), nh = Math.round(th * 0.85);
        if(nw < 640) return out;
        return shrink(mime, nw, nh, 0.78);
      });
    }
    return shrink(tryMime, w, h, 0.84).then(function(out){
      if(out.mime === 'image/webp' && out.blob.size > maxBytes){
        return shrink('image/jpeg', out.width, out.height, 0.82);
      }
      return out;
    });
  });
}
function generateAbstractBannerBlob(){
  const w = 1200, h = 400;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#12151c');
  g.addColorStop(0.45, '#1a2430');
  g.addColorStop(1, '#0c1014');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  function blob(x, y, r, color){
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  blob(260, 80, 260, 'rgba(46,140,200,0.45)');
  blob(980, 300, 280, 'rgba(40,180,150,0.32)');
  blob(700, 60, 200, 'rgba(220,90,70,0.22)');
  blob(120, 320, 180, 'rgba(180,200,80,0.16)');
  ctx.globalAlpha = 0.18;
  for(let i=0;i<7;i++){
    ctx.strokeStyle = i%2 ? 'rgba(180,220,230,0.7)' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2 + (i%3);
    ctx.beginPath();
    ctx.moveTo(-40 + i*80, h);
    ctx.quadraticCurveTo(300 + i*90, 40 + i*18, w+40, 80 + i*40);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const noise = ctx.getImageData(0, 0, w, h);
  const d = noise.data;
  for(let i=0;i<d.length;i+=16){
    const n = (Math.random()*30)|0;
    d[i] = Math.max(0, Math.min(255, d[i]+n-12));
    d[i+1] = Math.max(0, Math.min(255, d[i+1]+n-12));
    d[i+2] = Math.max(0, Math.min(255, d[i+2]+n-12));
  }
  ctx.putImageData(noise, 0, 0);
  return canvasToBlob(canvas, bannerSupportWebp() ? 'image/webp' : 'image/jpeg', 0.82);
}
function installDemoBanner(vehicleId){
  vehicleId = vehicleId || (currentVehicle() && currentVehicle().id);
  if(!vehicleId) return Promise.resolve();
  return generateAbstractBannerBlob().then(function(blob){
    return putBanner(vehicleId, { blob:blob, mime:blob.type, focalX:50, focalY:42, zoom:1.06 });
  });
}
function bannerCssVars(rec){
  rec = rec || {};
  return '--banner-x:'+clampBannerFocal(rec.focalX,50)+'%;--banner-y:'+clampBannerFocal(rec.focalY,50)+'%;--banner-z:'+clampBannerZoom(rec.zoom);
}
function homeBannerHtml(veh, odo){
  const rec = veh && getBanner(veh.id);
  if(!rec || !rec.url) return '';
  const name = vehicleName(veh);
  return '<div class="home-banner" id="homeBanner" style="'+bannerCssVars(rec)+'">'+
    '<img class="banner-photo" alt="" src="'+escapeHtml(rec.url)+'">'+
    '<div class="banner-scrim"></div>'+
    '<div class="banner-meta"><div class="banner-name">'+escapeHtml(name)+'</div>'+
    '<div class="banner-odo" id="odoVal">'+escapeHtml(odo!=null?km(odo):'—')+'</div></div></div>';
}
function blobToDataUrl(blob){
  return new Promise(function(resolve, reject){
    const r = new FileReader();
    r.onload = function(){ resolve(String(r.result||'')); };
    r.onerror = function(){ reject(r.error); };
    r.readAsDataURL(blob);
  });
}
function dataUrlToBlob(url){
  try{
    const m = String(url||'').match(/^data:([^;]+);base64,(.+)$/);
    if(!m) return null;
    const bin = atob(m[2]);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type:m[1]||'image/jpeg' });
  }catch(e){ return null; }
}
function exportBannersForBackup(){
  const ids = Object.keys(bannerCache);
  return Promise.all(ids.map(function(id){
    const rec = bannerCache[id];
    if(!rec || !rec.blob) return null;
    return blobToDataUrl(rec.blob).then(function(data){
      return [id, { mime: rec.mime, data: data, focalX: rec.focalX, focalY: rec.focalY, zoom: rec.zoom }];
    });
  })).then(function(pairs){
    const out = {};
    pairs.forEach(function(p){ if(p) out[p[0]] = p[1]; });
    return out;
  });
}
function hydrateBannersFromMap(banners){
  if(!banners || typeof banners !== 'object' || Array.isArray(banners)) return;
  Object.keys(banners).forEach(function(id){
    const row = banners[id] || {};
    const blob = dataUrlToBlob(row.data || row.dataUrl || '');
    if(!blob) return;
    cacheBannerRec({ vehicleId:id, blob:blob, mime:row.mime || blob.type, focalX:row.focalX, focalY:row.focalY, zoom:row.zoom });
  });
}
function persistBannerCache(){
  const recs = Object.keys(bannerCache).map(function(id){ return bannerCache[id]; });
  if(!recs.length) return Promise.resolve(recs);
  return bannerStore('readwrite').then(function(st){
    recs.forEach(function(rec){
      st.put({
        vehicleId: rec.vehicleId, blob: rec.blob, mime: rec.mime,
        focalX: rec.focalX, focalY: rec.focalY, zoom: rec.zoom, updatedAt: rec.updatedAt
      });
    });
    return recs;
  });
}
function applyBannersFromBackup(banners, opts){
  opts = opts || {};
  const start = opts.replace ? clearAllBanners().catch(function(){ return null; }) : Promise.resolve();
  return start.then(function(){
    hydrateBannersFromMap(banners);
    return persistBannerCache();
  }).catch(function(){ return null; });
}
function applyBannersFromBackupSync(banners, opts){
  opts = opts || {};
  if(opts.replace){
    Object.keys(bannerCache).forEach(function(id){ revokeBannerUrl(bannerCache[id]); delete bannerCache[id]; });
  }
  hydrateBannersFromMap(banners);
  const recs = Object.keys(bannerCache).map(function(id){ return bannerCache[id]; });
  bannerStore('readwrite').then(function(st){
    if(opts.replace) st.clear();
    recs.forEach(function(rec){
      st.put({
        vehicleId: rec.vehicleId, blob: rec.blob, mime: rec.mime,
        focalX: rec.focalX, focalY: rec.focalY, zoom: rec.zoom, updatedAt: rec.updatedAt
      });
    });
  }).catch(function(){});
}
function buildBackupPayloadAsync(opts){
  opts = opts || {};
  const payload = buildBackupPayload(opts);
  if(!opts.includeBanners) return Promise.resolve(payload);
  return exportBannersForBackup().then(function(banners){
    payload.banners = banners;
    return payload;
  });
}

function bindBannerEditor(vehicleId, mount){
  const wrap = mount || document.getElementById('vBannerEdit');
  if(!wrap) return;
  const file = document.getElementById('vBannerFile');
  const frame = document.getElementById('vBannerFrame');
  const img = document.getElementById('vBannerImg');
  const zoomEl = document.getElementById('vBannerZoom');
  const fyEl = document.getElementById('vBannerFocal');
  const pick = document.getElementById('vBannerPick');
  const rm = document.getElementById('vBannerRemove');
  const existing = getBanner(vehicleId);
  const draft = {
    blob: existing && existing.blob,
    url: existing && existing.url,
    mime: existing && existing.mime,
    focalX: existing ? existing.focalX : 50,
    focalY: existing ? existing.focalY : 50,
    zoom: existing ? existing.zoom : 1,
    removed: false,
    dirty: false
  };
  function applyVars(el){
    if(!el) return;
    el.style.setProperty('--banner-x', clampBannerFocal(draft.focalX,50)+'%');
    el.style.setProperty('--banner-y', clampBannerFocal(draft.focalY,50)+'%');
    el.style.setProperty('--banner-z', String(clampBannerZoom(draft.zoom)));
  }
  function paint(){
    const has = !!(draft.blob && !draft.removed && draft.url);
    wrap.classList.toggle('is-empty', !has);
    if(pick) pick.textContent = has ? '画像を選び直す' : 'バナーを追加';
    if(has){
      applyVars(wrap); applyVars(frame);
      if(img) img.src = draft.url;
    }
    if(zoomEl) zoomEl.value = String(draft.zoom);
    if(fyEl) fyEl.value = String(Math.round(draft.focalY));
  }
  paint();
  wrap._bannerDraft = draft;
  if(pick && file){
    pick.onclick = function(){ file.click(); };
    file.onchange = function(){
      const f = file.files && file.files[0];
      file.value = '';
      if(!f) return;
      compressBannerImage(f).then(function(out){
        if(draft.url && draft.url.indexOf('blob:')===0 && (!existing || draft.url !== existing.url)){
          try{ URL.revokeObjectURL(draft.url); }catch(e){}
        }
        draft.blob = out.blob;
        draft.mime = out.mime;
        draft.url = URL.createObjectURL(out.blob);
        draft.removed = false;
        draft.dirty = true;
        if(draft.zoom < 1) draft.zoom = 1;
        paint();
      }).catch(function(){ toast('画像を読み込めませんでした'); });
    };
  }
  if(rm) rm.onclick = function(){
    draft.removed = true;
    draft.dirty = true;
    paint();
  };
  if(zoomEl) zoomEl.oninput = function(){ draft.zoom = clampBannerZoom(zoomEl.value); draft.dirty = true; paint(); };
  if(fyEl) fyEl.oninput = function(){ draft.focalY = clampBannerFocal(fyEl.value, 50); draft.dirty = true; paint(); };
  if(frame){
    let dragging = false, lx = 0, ly = 0;
    function onDown(e){
      if(wrap.classList.contains('is-empty')) return;
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      lx = p.clientX; ly = p.clientY;
      if(e.pointerId != null && frame.setPointerCapture) try{ frame.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const r = frame.getBoundingClientRect();
      const dx = p.clientX - lx, dy = p.clientY - ly;
      lx = p.clientX; ly = p.clientY;
      const span = Math.max(1, (draft.zoom - 1) * 80 + 40);
      draft.focalX = clampBannerFocal(draft.focalX - (dx / Math.max(1,r.width)) * span, 50);
      draft.focalY = clampBannerFocal(draft.focalY - (dy / Math.max(1,r.height)) * span, 50);
      draft.dirty = true;
      if(fyEl) fyEl.value = String(Math.round(draft.focalY));
      paint();
      e.preventDefault();
    }
    function onUp(){ dragging = false; }
    frame.addEventListener('pointerdown', onDown);
    frame.addEventListener('pointermove', onMove);
    frame.addEventListener('pointerup', onUp);
    frame.addEventListener('pointercancel', onUp);
  }
  return draft;
}
function commitBannerDraft(vehicleId, draft){
  if(!vehicleId || !draft || !draft.dirty) return Promise.resolve(null);
  if(draft.removed || !draft.blob) return removeBanner(vehicleId);
  return putBanner(vehicleId, draft);
}

const CAT_COLORS = ['#dfac58','#ff5a2e','#3fa9f5','#4ade80','#c084fc','#f472b6','#94a3b8','#fb923c'];
function safeColor(v){
  const s = String(v==null?'':v).trim();
  if(/^#([0-9a-fA-F]{6})$/.test(s)) return '#'+s.slice(1).toLowerCase();
  if(/^#([0-9a-fA-F]{3})$/.test(s)){
    return ('#'+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2)+s.charAt(3)+s.charAt(3)).toLowerCase();
  }
  return '';
}
// 塗りの色と線の色を、シートの「色」列に1つの文字列で入れる（Code.gs は変えない）: 「#塗り/#線」
function packColors(fill, line){
  const f = safeColor(fill), l = safeColor(line);
  return l ? (f + '/' + l) : f;
}
function unpackColors(v){
  const parts = String(v==null?'':v).split('/');
  return { color: safeColor(parts[0]), lineColor: safeColor(parts[1]) };
}
function parseLookField(v){
  const raw = String(v==null?'':v).trim();
  let base = raw, op = null;
  const m = raw.match(/^(.*?)[:：](\d{1,3})$/);
  if(m){ base = m[1].trim(); op = Number(m[2]); if(!isFinite(op)) op = null; }
  let style = '';
  if(base==='fill' || base==='塗り') style = 'fill';
  else if(base==='line' || base==='線') style = 'line';
  return { style: style, opacity: clampOpacity(op, null) };
}
function safeStyle(v){
  return parseLookField(v).style;
}
function clampOpacity(n, fallback){
  if(n==null || n==='') return fallback;
  const x = Number(n);

  return Math.max(10, Math.min(100, Math.round(x)));
}
function lookOpacity(style, opacity){
  const st = safeStyle(style) || 'line';
  return clampOpacity(opacity, st==='fill' ? FILL_BG_PCT : 100);
}
function isLightTheme(){
  const t = document.documentElement.getAttribute('data-theme');
  return t==='neumo' || t==='glass-light' || t==='hygge' || t==='mecha' || t==='marchen' || t==='pastel' || t==='flower';

function mixHex(fg, bg, pct){
  const a = safeColor(fg), b = safeColor(bg);
  if(!a) return b || '';

  const t = Math.max(0, Math.min(1, (Number(pct)||0)/100));
  function ch(h, i){ return parseInt(h.slice(1+i*2, 3+i*2), 16); }
  function hex(n){ return ('0'+Math.round(n).toString(16)).slice(-2); }
  const r = ch(a,0)*t + ch(b,0)*(1-t);
  const g = ch(a,1)*t + ch(b,1)*(1-t);
  const bl = ch(a,2)*t + ch(b,2)*(1-t);
  return '#'+hex(r)+hex(g)+hex(bl);
}
function themeBgHex(){
  return isLightTheme() ? '#e8eef2' : '#12161c';
}
function readableInk(color, style, opacity){
  const st = safeStyle(style) || 'line';
  if(st!=='fill' || !color){
    return color || (isLightTheme() ? '#1a1408' : '#f4f0e8');
  }
  const op = lookOpacity('fill', opacity);
  // Strong fills contrast against the paint color; thin fills contrast against the mixed tile.
  if(op >= 60) return contrastInk(color);
  const mixed = mixHex(color, themeBgHex(), op);
  return contrastInk(mixed || color);

function hexLum(hex){
  const c = safeColor(hex);
  if(!c) return 0;
  function lin(n){ n=n/255; return n<=0.04045 ? n/12.92 : Math.pow((n+0.055)/1.055, 2.4); }
  const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);

  const c = safeColor(hex) || '#dfac58';
  const L = hexLum(c);
  const white = 1.05 / (L + 0.05);
  const darkL = hexLum('#1a1408');
  const dark = (L + 0.05) / (darkL + 0.05);

}
const FILL_BG_PCT = 85;
function fillBg(hex, pct){
  const c = safeColor(hex) || '#dfac58';

  }

    lineColor: fields && 'lineColor' in fields ? safeColor(fields.lineColor) : (prev.lineColor||''),
    style: fields && 'style' in fields ? safeStyle(fields.style) : (prev.style||''),
    opacity: fields && 'opacity' in fields ? clampOpacity(fields.opacity, null) : (prev.opacity!=null?prev.opacity:null),

    const t = Math.min(1, (y - (botLim - edge)) / edge);
    dy = Math.ceil(4 + t * maxStep);
  }
  if(!dy){ d.scrolling = false; return; }
  const maxScroll = Math.max(0, document.documentElement.scrollHeight - vh);
  const prev = window.scrollY || document.documentElement.scrollTop || 0;
  const next = Math.max(0, Math.min(maxScroll, prev + dy));
  const applied = next - prev;
  if(!applied){ d.scrolling = false; return; }
  window.scrollTo(0, next);
  d.scrolling = true;
  if(d.slots){
    d.slots.forEach(function(s){
      s.top -= applied; s.bottom -= applied; s.cy -= applied;
    });
  }
}
function scCommitReorder(dragId, placeholder){
  const grid = document.getElementById('scGrid');
  const ids = [];
  if(grid){
    Array.from(grid.children).forEach(function(el){
      if(el.classList.contains('is-dragging')) return;
      if(el.classList.contains('sc-placeholder')){ if(dragId) ids.push(dragId); }
      else if(el.getAttribute('data-sc')) ids.push(el.getAttribute('data-sc'));
    });
  }
  const uniq = [], seen = {};
  ids.forEach(function(id){ if(id && !seen[id]){ uniq.push(id); seen[id]=true; } });
  if(dragId && uniq.indexOf(dragId)<0) uniq.push(dragId);
  const enabled = enabledShortcuts().map(function(s){ return s.id; });
  enabled.forEach(function(id){ if(uniq.indexOf(id)<0) uniq.push(id); });
  endScDrag();
  persistShortcuts(uniq);
  if(state.tab==='home') renderHome();
}
function beginScDrag(tile, id, e){
  if(!tile || !id) return;
  endScDrag();
  const grid = document.getElementById('scGrid');
  if(!grid) return;
  scDragMetricsReset();
  const rect = tile.getBoundingClientRect();
  if(scDragMetrics) scDragMetrics.rectReads++;
  const placeholder = document.createElement('div');
  placeholder.className = 'sc-placeholder '+scSpanClass(tile);
  placeholder.setAttribute('aria-hidden', 'true');
  const prevCss = tile.getAttribute('style') || '';
  grid.insertBefore(placeholder, tile);
  tile.classList.add('is-dragging');
  tile.style.position = 'fixed';
  tile.style.left = '0';
  tile.style.top = '0';
  tile.style.right = 'auto';
  tile.style.bottom = 'auto';
  tile.style.width = rect.width+'px';
  tile.style.height = rect.height+'px';
  tile.style.zIndex = '90';
  tile.style.margin = '0';
  tile.style.pointerEvents = 'none';
  tile.style.transition = 'none';
  tile.style.animation = 'none';
  tile.style.willChange = 'transform';
  tile.style.gridColumn = 'auto';
  tile.style.gridRow = 'auto';
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;
  function applyTransform(x, y){
    tile.style.transform = 'translate3d('+(x-offsetX)+'px,'+(y-offsetY)+'px,0)';
  }
  applyTransform(e.clientX, e.clientY);
  document.documentElement.classList.add('sc-drag-lock');
  document.body.classList.add('sc-drag-lock');
  const wrap = document.getElementById('scWrap') || grid;
  const ptr = e.pointerId;
  const capEl = wrap;
  try{ capEl.setPointerCapture(ptr); }catch(err){}
  const d = {
    tile:tile, id:id, placeholder:placeholder, prevCss:prevCss, ptr:ptr,
    grid:grid, capEl:capEl, x:e.clientX, y:e.clientY, pending:false, raf:0,
    scrolling:false, hoverEl:null, hoverAfter:false, move:null, up:null, touchMove:null
  };
  scCacheSlots(d);
  d.hoverEl = placeholder;
  function tick(){
    d.raf = 0;
    if(scDrag !== d) return;
    if(scDragMetrics) scDragMetrics.rafs++;
    applyTransform(d.x, d.y);
    scAutoScroll(d);
    scPickSlot(d, d.x, d.y);
    d.pending = false;
    if(d.scrolling && scDrag === d) d.raf = requestAnimationFrame(tick);
  }
  function onMove(ev){
    if(ptr!=null && ev.pointerId!==ptr) return;
    d.x = ev.clientX; d.y = ev.clientY;
    d.pending = true;
    if(scDragMetrics) scDragMetrics.moves++;
    if(ev.cancelable) ev.preventDefault();
    if(!d.raf) d.raf = requestAnimationFrame(tick);
  }
  function onTouchMove(ev){
    if(ev.cancelable) ev.preventDefault();
  }
  function onUp(ev){
    if(scDrag !== d) return;
    if(ptr!=null && ev.pointerId!=null && ev.pointerId!==ptr) return;
    scSuppressClick = true;
    scCommitReorder(id, placeholder);
  }
  d.move = onMove; d.up = onUp; d.touchMove = onTouchMove;
  scDrag = d;
  document.addEventListener('pointermove', onMove, {passive:false});
  document.addEventListener('pointerup', onUp, true);
  document.addEventListener('pointercancel', onUp, true);
  document.addEventListener('touchmove', onTouchMove, {passive:false, capture:true});
}

function onScPointerDown(e){
  if(e.button!=null && e.button!==0) return;
  const tile = e.currentTarget;
  const id = tile && tile.getAttribute('data-sc');
  if(!id) return;
  if(scReorder && e.target && e.target.closest && e.target.closest('.sc-del')){
    if(e.cancelable) e.preventDefault();
    e.stopPropagation();
    scSuppressClick = true;
    scRemoveFromHome(id);
    return;
  }
  if(scReorder && scColorMode){
    // 色変更モード: タップで選ぶ。動かしたら並べ替え
    if(e.cancelable) e.preventDefault();
    e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, sp = e.pointerId;
    function off(){
      document.removeEventListener('pointermove', mv, true);
      document.removeEventListener('pointerup', up, true);
      document.removeEventListener('pointercancel', up, true);
    }
    function mv(ev){
      if(sp!=null && ev.pointerId!==sp) return;
      if(Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8){
        off();
        beginScDrag(tile, id, ev);
      }
    }
    function up(ev){
      if(sp!=null && ev.pointerId!=null && ev.pointerId!==sp) return;
      off();
      scSuppressClick = true;
      scSelId = id;
      refreshScColorUi();
    }
    document.addEventListener('pointermove', mv, true);
    document.addEventListener('pointerup', up, true);
    document.addEventListener('pointercancel', up, true);
    return;
  }
  if(scReorder){
    if(e.cancelable) e.preventDefault();
    e.stopPropagation();
    beginScDrag(tile, id, e);
    return;
  }
  const startX = e.clientX, startY = e.clientY, ptr = e.pointerId;
  let cleared = false;
  const timer = setTimeout(function(){
    if(cleared) return;
    cleanup();
    scSuppressClick = true;
    enterReorderInPlace();
    const live = document.querySelector('#scGrid .sc-tile[data-sc="'+id+'"]') || tile;
    beginScDrag(live, id, { clientX:startX, clientY:startY, pointerId:ptr });
  }, 400);
  function cleanup(){
    if(cleared) return;
    cleared = true;
    clearTimeout(timer);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  function onMove(ev){
    if(ptr!=null && ev.pointerId!==ptr) return;
    if(Math.hypot(ev.clientX-startX, ev.clientY-startY) > 10) cleanup();
  }
  function onUp(ev){
    if(ptr!=null && ev.pointerId!==ptr) return;
    cleanup();
  }
  document.addEventListener('pointermove', onMove, {passive:true});
  document.addEventListener('pointerup', onUp, {passive:true});
  document.addEventListener('pointercancel', onUp, {passive:true});
}

function odoInfo(veh){
  veh = veh || currentVehicle();
  if(!veh) return { km:null, source:null, date:null, record:null };
  const recs = recordsOf(veh).filter(function(r){
    return r.odometer!=null && r.odometer!=='' && isFinite(Number(r.odometer));
  });
  if(!recs.length){
    const fallback = Number(veh && veh.currentOdometer);
    if(isFinite(fallback) && fallback>0) return { km: fallback, source:'manual', date:null, record:null };
    return { km:null, source:null, date:null, record:null };
  }
  recs.sort(function(a,b){
    const ao = Number(a.odometer), bo = Number(b.odometer);
    if(ao!==bo) return bo-ao;
    const fa = isFuelRecord(a)?1:0, fb = isFuelRecord(b)?1:0;
    if(fa!==fb) return fb-fa;
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  const r = recs[0];
  return { km: Number(r.odometer), source: isFuelRecord(r)?'fuel':'record', date: r.date, record: r };
}

  if(info.source==='record' && info.record) return '走行距離 '+kmTxt+'（'+fmtDate(info.date)+' '+recordCategoryName(info.record)+'より）';
  if(info.source==='manual') return '走行距離 '+kmTxt+'（手動）';
  return '走行距離 '+kmTxt;
}

function loadCodeGs(force){

    fillCodeGsView();
    return Promise.resolve(codeGsText);
  }
  if(codeGsPromise && !force) return codeGsPromise;
  codeGsPromise = fetch('./Code.gs').then(function(res){
    if(!res || !res.ok) throw new Error(res ? ('http '+res.status) : 'network');
    return res.text();
  }).then(function(t){
    codeGsText = t;
    fillCodeGsView();
    return t;
  }).catch(function(err){
    codeGsPromise = null;
    const st = document.getElementById('gsCodeStatus');

function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.setAttribute('aria-hidden','true');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;padding:0;border:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return !!ok;
}
async function copyCodeGs(opts){
  opts = opts || {};
  try{
    const text = await loadCodeGs();
    if(text == null || text===''){ toast('Code.gs を読み込めませんでした'); return false; }
    let ok = false;
    if(!opts.forceFallback && navigator.clipboard && typeof navigator.clipboard.writeText==='function'){
      try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){ ok = false; }
    }
    if(!ok) ok = copyTextFallback(text);
    if(ok){
      toast('コピーしました（'+gsLineCount(text)+'行）');
      return true;
    }
    toast('コピーできませんでした。下の「コードを表示」から選択してください');
    return false;
  }catch(err){
    toast('Code.gs を読み込めませんでした');
    return false;
  }
}

function openHelp(topicId){
  const bg = document.getElementById('modalBg');
  const box = document.getElementById('modal');
  box.className = 'modal help-modal';
  const topic = topicId && HELP_TOPICS.find(function(t){ return t.id===topicId; });
  if(!topic){
    box.innerHTML =
      '<h3>使い方</h3>'+
      '<div class="help">見たい項目を選んでください。戻るボタンで一覧に戻れます。</div>'+
      '<div class="help-topics" id="helpTopics">'+HELP_TOPICS.map(function(t){
        return '<button type="button" class="chip-btn" data-help="'+t.id+'">'+escapeHtml(t.title)+'</button>';
      }).join('')+'</div>'+
      '<div class="btn-row"><button type="button" class="btn ghost" id="helpClose">閉じる</button></div>';
    bg.classList.add('show');
    bindModalBackdrop(bg);
    document.getElementById('helpClose').onclick = closeModal;
    box.querySelectorAll('[data-help]').forEach(function(b){
      b.onclick = function(){ openHelp(b.getAttribute('data-help')); };
    });
    return;
  }
  box.innerHTML =
    '<h3>'+escapeHtml(topic.title)+'</h3>'+
    '<div class="help-topic-body">'+topic.body+'</div>'+
    '<div class="btn-row"><button type="button" class="btn ghost" id="helpBack">戻る</button>'+
    '<button type="button" class="btn ghost" id="helpClose">閉じる</button></div>';
  bg.classList.add('show');
  bindModalBackdrop(bg);
  document.getElementById('helpBack').onclick = function(){ openHelp(); };
  document.getElementById('helpClose').onclick = closeModal;
  const gas = document.getElementById('helpOpenGas');
  if(gas) gas.onclick = function(){ closeModal(); go('set'); setTimeout(function(){ openGasHelp(); }, 0); };
}

function openGasHelp(){
  go('set');
  setTimeout(function(){
    const d = document.getElementById('gasHelp');
    if(!d) return;
    d.open = true;
    const bar = document.querySelector('header.topbar');
    const extra = bar ? bar.getBoundingClientRect().height + 6 : 0;
    const y = Math.max(0, d.getBoundingClientRect().top + window.scrollY - extra);
    window.scrollTo(0, y);
  }, 40);
}
async function testGasConnection(){
  const inp = document.getElementById('gasUrl');
  const url = ((inp && inp.value) || state.settings.gasUrl || '').trim();
  if(!url){ toast('URLを貼ってください'); return false; }
  if(isGasDevUrl(url)){
    toast('テスト用の /dev ではなく、末尾が /exec の URL を貼ってください');
    return false;
  }
  if(!isGasExecUrl(url) && url.indexOf('script.google.com')>=0){
    toast('末尾が /exec のウェブアプリ URL を貼ってください');
    return false;
  }
  state.settings.gasUrl = url;
  persistSettings();
  updateSyncBtn();
  try{
    const getUrl = url + (url.indexOf('?')>=0?'&':'?') + 'action=getAll';
    const res = await gasFetch(getUrl, null, 15000);
    let data = null;
    try{ data = await res.json(); }catch(e){ data = null; }
    if(res.ok && data && data.status==='ok'){
      lastSyncError = false;
      toast('接続できました');
      const st = document.getElementById('syncStatus');
      if(st) st.innerHTML = '<span class="sync-dot on"></span>接続できました　未送信 '+(pendingCount())+'件';
      updateSetTabSyncMark();
      return true;
    }
    lastSyncError = true;
    toast('接続に失敗しました（URLや承認を確認）');

    return false;
  }catch(err){
    lastSyncError = true;
    toast('接続に失敗しました（URLや承認を確認）');
    updateSyncStatus();
    return false;
  }
}

function fillVehicleSelect(){
  const sel = document.getElementById('vehicleSelect');
  const wrap = document.getElementById('vehicleTitleWrap');
  const title = document.getElementById('vehicleTitle');
  if(!sel) return;
  if(!state.vehicles.length){
    sel.innerHTML = '';
    sel.hidden = true;
    sel.setAttribute('aria-hidden','true');
    if(title) title.textContent = '';
    if(wrap){ wrap.hidden = true; wrap.classList.remove('is-overflow'); }
    return;
  }
  sel.hidden = false;
  sel.removeAttribute('aria-hidden');
  if(wrap) wrap.hidden = false;
  const cur = state.settings.currentVehicleId;
  const allOn = histAllMode();
  sel.innerHTML = state.vehicles.map(function(v){
    return '<option value="'+escapeHtml(v.id)+'"'+(v.id===cur && !allOn?' selected':'')+'>'+escapeHtml(v.name)+'</option>';
  }).join('') + (state.vehicles.length>1 ? '<option value="__all__"'+(allOn?' selected':'')+'>全車（履歴）</option>' : '');
  if(title) title.textContent = selectedVehicleLabel(sel);
  scheduleVehicleSelectOverflow();
}
function selectedVehicleLabel(sel){
  sel = sel || document.getElementById('vehicleSelect');
  if(!sel || sel.selectedIndex < 0) return '';
  const opt = sel.options[sel.selectedIndex];
  return opt ? String(opt.text || '') : '';
}
function syncVehicleSelectOverflow(){
  const sel = document.getElementById('vehicleSelect');
  const wrap = document.getElementById('vehicleTitleWrap');
  const title = document.getElementById('vehicleTitle');
  if(!sel || sel.hidden || !wrap || wrap.hidden || !title){
    if(wrap) wrap.classList.remove('is-overflow');
    return false;
  }
  const label = selectedVehicleLabel(sel);
  if(title.textContent !== label) title.textContent = label;
  // Measure as the default (centered) so a name that fits is not left-aligned
  // just because a previous overflow class changed padding/alignment.
  wrap.classList.remove('is-overflow');
  const cs = getComputedStyle(title);
  let probe = document.getElementById('vehicleSelectProbe');
  if(!probe){
    probe = document.createElement('span');
    probe.id = 'vehicleSelectProbe';
    probe.setAttribute('aria-hidden','true');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(probe);
  }
  probe.style.font = cs.font;
  probe.style.fontFamily = cs.fontFamily;
  probe.style.fontSize = cs.fontSize;
  probe.style.fontWeight = cs.fontWeight;
  probe.style.letterSpacing = cs.letterSpacing;
  probe.textContent = label;
  const textW = probe.scrollWidth;
  const avail = title.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
  const overflow = textW > avail + 0.5;
  wrap.classList.toggle('is-overflow', overflow);
  return overflow;
}
function scheduleVehicleSelectOverflow(){
  if(scheduleVehicleSelectOverflow._raf) cancelAnimationFrame(scheduleVehicleSelectOverflow._raf);
  scheduleVehicleSelectOverflow._raf = requestAnimationFrame(function(){
    scheduleVehicleSelectOverflow._raf = 0;
    syncVehicleSelectOverflow();
  });
}

function taxBundle(veh, asOf){

  });

function isCustomInterval(it){
  if(!it) return false;
  if(it.custom) return true;
  return String(it.id||'').indexOf('cust')===0;
}
function isCustomIntervalId(id){ return String(id||'').indexOf('cust')===0; }
function intervalsFor(veh){
  if(!veh) return [];
  const vid = veh.id;
  const all = (state.intervals||[]).filter(function(it){ return it && !it.deleted; });
  const ownById = {};
  all.filter(function(it){ return it.vehicleId === vid; }).forEach(function(it){ ownById[it.id]=it; });
  const globals = all.filter(function(it){ return !it.vehicleId; });
  const seen = {};
  const list = [];
  all.filter(function(it){ return it.vehicleId === vid && isCustomInterval(it); }).forEach(function(it){
    if(!seen[it.id]){ list.push(it); seen[it.id]=true; }
  });
  globals.forEach(function(it){
    const use = ownById[it.id] || it;
    if(!seen[use.id]){ list.push(use); seen[use.id]=true; }
  });
  all.filter(function(it){ return it.vehicleId === vid && !isCustomInterval(it); }).forEach(function(it){
    if(!seen[it.id]){ list.push(it); seen[it.id]=true; }
  });
  if(veh.fuelType==='ev'){
    const evSkip = { engine_oil:1, oil_filter:1, spark_plug:1, air_filter:1 };
    for(let i=list.length-1;i>=0;i--){ if(evSkip[list[i].id] && !isCustomInterval(list[i])) list.splice(i,1); }
  }
  return list.concat(customAlertItems());
}
function ensureVehicleInterval(id, veh){
  veh = veh || currentVehicle();
  if(!veh) return null;
  let it = state.intervals.find(function(x){ return x.id===id && x.vehicleId===veh.id && !x.deleted; });
  if(it) return it;
  const glob = state.intervals.find(function(x){ return x.id===id && !x.vehicleId && !x.deleted; });
  if(glob){
    it = Object.assign({}, glob, { vehicleId: veh.id, updatedAt: new Date().toISOString() });
    state.intervals.push(it);
    return it;
  }
  return null;
}
function upsertMaintenanceItem(fields){
  const veh = currentVehicle();
  if(!veh){ toast('まずは車を登録しましょう'); return null; }
  fields = fields || {};
  const now = new Date().toISOString();
  let it = fields.id ? state.intervals.find(function(x){ return x.id===fields.id && !x.deleted; }) : null;
  if(!it){
    const name = (fields.label||'').trim();
    it = {
      id: fields.id || newId('cust'),
      vehicleId: veh.id,
      label: name,
      category: fields.category || 'メンテナンス',
      subcategory: fields.subcategory || name,
      km: fields.km!=null && fields.km!=='' ? Number(fields.km) : null,
      months: fields.months!=null && fields.months!=='' ? Number(fields.months) : null,
      custom: true,
      deleted: false,
      lastReplacedDate: fields.lastReplacedDate || '',
      lastReplacedOdo: (fields.lastReplacedOdo==null || fields.lastReplacedOdo==='' || !isFinite(Number(fields.lastReplacedOdo))) ? null : Number(fields.lastReplacedOdo),
      updatedAt: now
    };
    if(it.km!=null && !isFinite(it.km)) it.km = null;
    if(it.months!=null && !isFinite(it.months)) it.months = null;
    state.intervals.push(it);
  } else {
    if(fields.label) it.label = String(fields.label).trim();
    if(fields.subcategory || fields.label) it.subcategory = fields.subcategory || fields.label;
    if(fields.category) it.category = fields.category;
    if('km' in fields) it.km = fields.km!=null && fields.km!=='' && isFinite(Number(fields.km)) ? Number(fields.km) : null;
    if('months' in fields) it.months = fields.months!=null && fields.months!=='' && isFinite(Number(fields.months)) ? Number(fields.months) : null;
    if('lastReplacedDate' in fields) it.lastReplacedDate = fields.lastReplacedDate || '';
    if('lastReplacedOdo' in fields){
      const n = fields.lastReplacedOdo==null || fields.lastReplacedOdo==='' ? null : Number(fields.lastReplacedOdo);
      it.lastReplacedOdo = isFinite(n) ? n : null;
    }
    if(fields.custom) it.custom = true;
    it.deleted = false;
    it.updatedAt = now;
    if(!it.vehicleId) it.vehicleId = veh.id;
  }
  if('lastReplacedDate' in fields && it) it.lastReplacedDate = fields.lastReplacedDate || '';
  if('lastReplacedOdo' in fields && it){
    const n2 = fields.lastReplacedOdo==null || fields.lastReplacedOdo==='' ? null : Number(fields.lastReplacedOdo);
    it.lastReplacedOdo = isFinite(n2) ? n2 : null;
  }
  persistIntervals();
  return it;
}
function deleteMaintenanceItem(id){
  const it = state.intervals.find(function(x){ return x.id===id && !x.deleted; });
  if(!it || !isCustomInterval(it)){ toast('組み込みの項目は削除できません'); return false; }
  it.deleted = true;
  it.updatedAt = new Date().toISOString();
  persistIntervals();
  return true;
}
function itemMatchesRecord(it, rec){
  if(!it || !rec) return false;
  return !!(C.lastRecordForItem([rec], rec.vehicle, it) || C.lastRecordForItem([rec], rec.vehicleId, it));
}
function applyLastReplacement(it, date, odo, when){
  const veh = currentVehicle();
  if(!it || !veh) return;
  const own = isCustomInterval(it) && it.vehicleId===veh.id
    ? it
    : (ensureVehicleInterval(it.id, veh) || it);
  if(!own) return;
  if(date) own.lastReplacedDate = date;
  if(odo!=null && odo!=='' && isFinite(Number(odo))) own.lastReplacedOdo = Number(odo);
  own.updatedAt = when || new Date().toISOString();
  persistIntervals();
  return own;
}
function touchLastReplacementFromRecord(rec){
  if(!rec || rec.deleted) return;
  const veh = (state.vehicles||[]).find(function(v){ return v.id===rec.vehicleId; })
    || (state.vehicles||[]).find(function(v){ return v.name===rec.vehicle; })
    || currentVehicle();
  if(!veh) return;
  let changed = false;
  intervalsFor(veh).forEach(function(it){
    if(!isReplaceableInterval(it) || !itemMatchesRecord(it, rec)) return;
    const own = isCustomInterval(it) && it.vehicleId===veh.id ? it : (ensureVehicleInterval(it.id, veh) || it);
    if(!own) return;
    const incoming = { date: rec.date||null, odometer: rec.odometer };
    const current = { date: own.lastReplacedDate||null, odometer: own.lastReplacedOdo };
    if(!C.hasBaselineValue(current) || C.isNewerBaseline(incoming, current) ||
       (String(incoming.date||'')===String(current.date||'') && Number(incoming.odometer||0)===Number(current.odometer||0))){
      if(rec.date) own.lastReplacedDate = rec.date;
      if(rec.odometer!=null && rec.odometer!=='' && isFinite(Number(rec.odometer))) own.lastReplacedOdo = Number(rec.odometer);
      own.updatedAt = rec.updatedAt || new Date().toISOString();
      changed = true;
    }
  });
  if(changed) persistIntervals();
}

function alertsFor(veh){
  if(!veh) return [];
  const monthlyKm = C.estimateMonthlyKm(recordsOf(veh), vehicleName(veh), new Date());
  const list = C.computeAlerts(intervalsFor(veh), recordsOf(veh), vehicleName(veh), currentOdo(veh), new Date(), { monthlyKm: monthlyKm });
  const sh = C.shakenAlert(veh, new Date());
  if(sh){
    list.unshift({
      item: { id:'shaken', label:'車検' },
      status: sh.status,
      message: sh.message,
      dueDate: sh.dueDate,
      remainDays: sh.remainDays,
      windowOpen: sh.windowOpen,
      reserved: !!sh.reserved,
      reservedDate: sh.reservedDate || '',
      last: null,
      kind: 'shaken'
    });
  }
  return list;
}
function isActiveAlert(a){
