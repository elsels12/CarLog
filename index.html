/* ---------- summaries ---------- */
function inPeriod(dateStr, from, to){
  if(!dateStr) return false;
  return dateStr >= from && dateStr <= to;
}
function monthRange(d){
  d = d || new Date();
  const from = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return { from: from, to: C.ymd(last) };
}
function yearRange(d){
  d = d || new Date();
  return { from: d.getFullYear()+'-01-01', to: d.getFullYear()+'-12-31' };
}
function yearToDateRange(d){
  d = d || new Date();
  return { from: d.getFullYear()+'-01-01', to: C.ymd(d) };
}
function sumAmount(list, from, to){
  let s = 0;
  list.forEach(function(r){
    if(inPeriod(r.date, from, to)) s += Number(r.amount) || 0;
  });
  return s;
}
function byCategory(list, from, to){
  const map = {};
  list.forEach(function(r){
    if(!inPeriod(r.date, from, to)) return;
    const k = recordCategoryName(r);
    map[k] = (map[k] || 0) + (Number(r.amount) || 0);
  });
  return Object.keys(map).map(function(k){ return { name:k, amount:map[k] }; })
    .sort(function(a,b){ return b.amount - a.amount; });
}

/* ---------- render ---------- */
function isEvVeh(veh){ veh = veh || currentVehicle(); return !!veh && veh.fuelType==='ev'; }
function volUnit(veh){ return isEvVeh(veh) ? 'kWh' : 'L'; }
function ecoUnit(veh){ return isEvVeh(veh) ? 'km/kWh' : 'km/L'; }
function fmtKmL(n){
  if(n==null || n==='' || !isFinite(Number(n))) return '—';
  return Number(n).toFixed(1)+' '+ecoUnit();
}
function sortedRecords(veh){
  return recordsOf(veh).slice().sort(function(a,b){
    if(a.date!==b.date) return String(b.date).localeCompare(String(a.date));
    return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''));
  });
}
function monthShort(ym){
  const m = String(ym||'').match(/^(\d{4})-(\d{2})/);
  if(!m) return ym || '';
  return Number(m[2])+'月';
}

function fitShortcutLabels(root){
  root = root || document.getElementById('scGrid');
  if(!root) return;
  root.querySelectorAll('.sc-tile.sc-s').forEach(function(t){
    t.classList.remove('sc-icon-only');
    const lbl = t.querySelector('.lbl');
    if(!lbl) return;
    const text = (lbl.textContent || '').trim();
    if(text && !t.getAttribute('aria-label')) t.setAttribute('aria-label', text);
    if(!text){ t.classList.add('sc-icon-only'); return; }
    const fs = parseFloat(getComputedStyle(lbl).fontSize) || 8;
    const tight = lbl.scrollWidth + 6 > lbl.clientWidth;
    const cramped = fs < 9 && text.length >= 3;
    if(tight || cramped) t.classList.add('sc-icon-only');
  });
}
function fitWideShortcutLabels(root){
  root = root || document.getElementById('scGrid');
  if(!root) return;
  root.querySelectorAll('.sc-tile.sc-w .lbl, .sc-tile.sc-mw .lbl, .sc-tile.sc-l3 .lbl').forEach(function(lbl){
    lbl.style.fontSize = '';
    lbl.style.textOverflow = 'clip';
    const base = parseFloat(getComputedStyle(lbl).fontSize) || 9;
    let fs = base;
    while(lbl.scrollWidth > lbl.clientWidth + 0.5 && fs > 8){
      fs -= 0.5;
      lbl.style.fontSize = fs+'px';
    }
    if(lbl.scrollWidth > lbl.clientWidth + 0.5) lbl.style.textOverflow = 'ellipsis';
  });
}
function scheduleFitShortcutLabels(){
  if(scheduleFitShortcutLabels._raf) cancelAnimationFrame(scheduleFitShortcutLabels._raf);
  scheduleFitShortcutLabels._raf = requestAnimationFrame(function(){
    scheduleFitShortcutLabels._raf = 0;
    requestAnimationFrame(function(){ fitShortcutLabels(); fitWideShortcutLabels(); });
  });
}
function observeShortcutGrid(){
  const grid = document.getElementById('scGrid');
  if(!grid) return;
  if(typeof ResizeObserver === 'function'){
    if(!observeShortcutGrid._ro){
      observeShortcutGrid._ro = new ResizeObserver(function(){ scheduleFitShortcutLabels(); });
    }
    observeShortcutGrid._ro.disconnect();
    observeShortcutGrid._ro.observe(grid);
  }
  fitShortcutLabels(grid);
  fitWideShortcutLabels(grid);
  scheduleFitShortcutLabels();
}

function lastNextHtml(last, dueDate, dueKm){
  const lastBits = [];
  if(last && last.date) lastBits.push(fmtDate(last.date));
  if(last && last.odometer!=null) lastBits.push(km(last.odometer));
  const nextBits = [];
  if(dueDate) nextBits.push(fmtDate(dueDate));
  if(dueKm!=null) nextBits.push(km(dueKm));
  const lastPart = lastBits.length ? '前回交換 '+escapeHtml(lastBits.join(' · ')) : '';
  const nextPart = nextBits.length ? '次回目安 '+escapeHtml(nextBits.join(' · ')) : '';
  if(lastPart && nextPart) return lastPart+'<br>'+nextPart;
  return lastPart || nextPart;
}
function intervalSettingText(it){
  if(!it) return '交換間隔 未設定';
  const bits = [];
  if(it.km!=null && it.km!=='' && Number(it.km)>0) bits.push(km(it.km));
  if(it.months!=null && it.months!=='' && Number(it.months)>0) bits.push(Number(it.months)+'か月');
  return bits.length ? '交換間隔 '+bits.join(' / ') : '交換間隔 未設定';
}

const ICO_PENCIL = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
const ICO_CHEVRON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>';
const ICO_CHEVRON_DOWN = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>';
function alertCardVariant(opts){
  if(opts && (opts.variant==='A' || opts.variant==='B')) return opts.variant;
  const v = (typeof window!=='undefined' && window.__ALERT_CARD_VARIANT) || 'A';
  return v==='B' ? 'B' : 'A';
}
function alertKeyInfo(a){
  const item = (a && a.item) || {};
  if(item.id==='shaken'){
    if(a.message) return a.message;
    if(a.dueDate){
      const d = C.toDate(a.dueDate);
      if(!d) return '期限 '+a.dueDate;
      return '期限 '+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
    }
    return '車検日を設定してください';
  }
  if(!C.hasBaselineValue(a && a.last)) return '前回交換を設定してください';
  const parts = [];
  if(a.dueDate) parts.push(fmtDate(a.dueDate));
  if(a.dueKm!=null) parts.push(km(a.dueKm));
  return parts.length ? '次回 '+parts.join('・') : '次回目安はありません';
}
function formatShakenInfoHtml(text){
  return escapeHtml(text||'').replace(/(予約日\s*\d{1,2}\/\d{1,2}|（期限\s*\d{1,2}\/\d{1,2}）|期限\s*\d{1,2}\/\d{1,2}|\d{1,2}\/\d{1,2}〜)/g, '<span class="alert-date">$1</span>');
}
function alertKeyInfoHtml(a){
  const item = (a && a.item) || {};
  if(item.id==='shaken') return formatShakenInfoHtml(alertKeyInfo(a));
  return escapeHtml(alertKeyInfo(a));
}
function remainLines(a){
  if(!a) return [];
  const lines = [];
  if(a.remainDays!=null && a.remainDays!==''){
    const st = a.dayStatus || (a.kind==='shaken' ? (a.status||'ok') : (Number(a.remainDays)<=0 ? 'overdue' : 'ok'));
    lines.push({ kind:'days', text: C.formatRemainDays(a.remainDays), status: st });
  }
  if(a.remainKm!=null && a.remainKm!==''){
    const st = a.kmStatus || (Number(a.remainKm)<=0 ? 'overdue' : 'ok');
    lines.push({ kind:'km', text: C.formatRemainKm(a.remainKm), status: st });
  }
  return lines.filter(function(ln){ return ln.text; });
}
// 点検アラートの色: すべて固定色（テーマで変えない）。赤は点検タブに近い色、ほかは同じくすみ・透け感のそろった色
const SCORE_STOPS = ['#ff7a5c','#f0a561','#e6cb7c','#79c9a0']; // 赤(点検タブに近い色・固定)→オレンジ→黄→緑。テーマで変えない
function scoreColor(score){
  if(score==null || !isFinite(score)) return '';
  const x = Math.max(0, Math.min(3, score));
  const i = Math.min(2, Math.floor(x)), f = x - i;
  if(f<=0.001) return SCORE_STOPS[i];
  if(f>=0.999) return SCORE_STOPS[i+1];
  const pa = Math.round((1-f)*100);
  return 'color-mix(in srgb, '+SCORE_STOPS[i]+' '+pa+'%, '+SCORE_STOPS[i+1]+')';
}
function alertScore(a){
  if(!a) return null;
  if(a.score!=null) return a.score;
  const m = { overdue:0, action:0, caution:1.5, soon:1.5, ok:3, reserved:3 };
  return m[a.status]!=null ? m[a.status] : null;
}
// 色の位置（0=赤〜3=緑）に合わせた5段階: 余裕 / 確認（1,200km・80日〜）/ 注意 / 警告 / 超過
function scoreLabel(score){
  if(score==null || !isFinite(score)) return '';
  if(score<=0) return '超過';
  if(score<1) return '警告';
  if(score<2) return '注意';
  if(score<3) return '確認';
  return '余裕';
}
function alertTier(a){
  if(!a) return '';
  return a.tier || C.tierFromStatus(a.status) || '';
}
function remainBlockHtml(a){
  const lines = remainLines(a);
  if(!lines.length) return '';
  const tcls = '';
  return '<div class="alert-card-remain">'+lines.map(function(ln){
    return '<div class="alert-remain is-'+escapeHtml(ln.status)+tcls+'" data-remain="'+escapeHtml(ln.kind)+'">'+escapeHtml(ln.text)+'</div>';
  }).join('')+'</div>';
}
function remainHighlight(a){
  return remainLines(a).map(function(ln){ return ln.text; }).join('\n');
}
function alertUsedPct(a){
  const item = (a && a.item) || {};
  if(item.id==='shaken'){
    if(a.remainDays==null) return 0;
    if(a.remainDays<=0) return 100;
    const cycle = 24*30.4375;
    return Math.max(0, Math.min(100, (1 - a.remainDays/cycle)*100));
  }
  if(!C.hasBaselineValue(a && a.last)) return 0;
  // バーの長さを色（残りの近さ）にそろえる: 緑の入口は短く、赤（超過）で満杯。連続で伸びる。
  const sc = alertScore(a);
  if(sc==null) return 0;
  if(sc<=0) return 100;
  return Math.max(6, (1 - sc/3)*100);
}
function alertCardHtml(a, opts){
  opts = opts || {};
  const item = (a && a.item) || {};
  const isShaken = item.id==='shaken';
  const canRec = !isShaken && isReplaceableInterval(item);
  const canEdit = !!(opts.edit && !isShaken && (isReplaceableInterval(item) || isCustomInterval(item)));
  const hasLast = !isShaken && C.hasBaselineValue(a.last);
  const st = (!isShaken && !hasLast) ? 'unknown' : (a.status||'unknown');
  const keepLabel = (a.status==='reserved' || a.status==='info' || a.status==='action');
  const badgeLabel = (!isShaken && !hasLast) ? '未設定' : (keepLabel ? statusLabel(a.status) : (scoreLabel(alertScore(a)) || statusLabel(a.status)));
  const badge = '<span class="badge '+escapeHtml(st)+'">'+escapeHtml(badgeLabel)+'</span>';
  const info = alertKeyInfo(a);
  const remainHtml = remainBlockHtml(a);
  const pct = Math.max(0, Math.min(100, alertUsedPct(a)));
  const tcol = (isShaken || hasLast) ? scoreColor(alertScore(a)) : '';
  const variant = alertCardVariant(opts);
  const actions = [];
  const shakenOpen = isShaken && !!(a.windowOpen || (a.dueDate && C.shakenWindowIsOpen(a.dueDate, new Date())));
  const shakenReserved = isShaken && (a.status==='reserved' || a.reserved || C.isShakenReserved(currentVehicle()));
  if(shakenOpen){
    actions.push('<button type="button" class="alert-action'+(shakenReserved?' is-reserved':'')+'" data-shaken-reserve="1" aria-pressed="'+(shakenReserved?'true':'false')+'">'+(shakenReserved?'予約済':'予約完了')+'</button>');
    actions.push('<button type="button" class="alert-action" data-shaken-done="1">完了</button>');
  }
  if(canRec) actions.push('<button type="button" class="alert-action" data-rec-int="'+escapeHtml(item.id)+'">完了</button>');
  if(canEdit && variant==='B') actions.push('<span class="alert-chevron" aria-hidden="true">'+ICO_CHEVRON+'</span>');
  const editBtn = (canEdit && variant==='A') ? '<button type="button" class="alert-edit" data-edit-int="'+escapeHtml(item.id)+'" aria-label="編集">'+ICO_PENCIL+'</button>' : '';
  const editAttr = (canEdit && variant==='B') ? ' data-edit-int="'+escapeHtml(item.id)+'"' : '';
  return '<div class="alert-card'+(isShaken?' alert-shaken':'')+(canEdit && variant==='B'?' is-editable':'')+'" data-iid="'+escapeHtml(item.id||'')+'"'+(tcol?' style="--tc:'+tcol+'"':'')+editAttr+'>'+
    '<div class="alert-card-head"><span class="name">'+escapeHtml(item.label||'')+'</span>'+badge+editBtn+'</div>'+
    remainHtml+
    '<div class="alert-card-sub"><div class="alert-info">'+alertKeyInfoHtml(a)+'</div></div>'+
    '<div class="alert-card-foot">'+
      '<div class="alert-bar is-'+escapeHtml(st)+''+'" aria-hidden="true"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
      (actions.length?'<div class="alert-card-actions">'+actions.join('')+'</div>':'')+
    '</div>'+
    '</div>';
}

    b.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openReplacementInput(b.getAttribute('data-rec-int')); };
  });

    b.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openMaintenanceEditor(b.getAttribute('data-edit-int')); };
  });

  });
  root.querySelectorAll('[data-shaken-done]').forEach(function(b){
    b.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openShakenDoneSheet(); };
  });

function inputEnterOrder(){

function onInputEnterKey(e){
  const isEnter = e.key==='Enter' || e.key==='Return' || e.keyCode===13 || e.which===13;
  if(!isEnter) return;
  const order = inputEnterOrder();
  let id = e.currentTarget && e.currentTarget.id;
  // 単価 is optional; send it on to 走行距離
  if(id==='fUnit' && order.indexOf('fOdo')>=0) id = 'fLiters';
  const i = order.indexOf(id);
  if(i<0) return;
  e.preventDefault();
  e.stopPropagation();
  if(i>=order.length-1){
    if(e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
    return;
  }
  const next = document.getElementById(order[i+1]);
  if(next) next.focus();
}
function bindInputEnterOrder(){
  const ids = ['fAmt','fLiters','fUnit','fOdo','fWt','fJb','fSt','fSv'];
  ids.forEach(function(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.removeEventListener('keydown', onInputEnterKey);
    el.addEventListener('keydown', onInputEnterKey);
  });
  const order = inputEnterOrder();
  order.forEach(function(id, i){
    const el = document.getElementById(id);
    if(el) el.setAttribute('enterkeyhint', i===order.length-1 ? 'done' : 'next');
  });

  if(unit) unit.setAttribute('enterkeyhint', 'next');
}

let fuelTyped = [];
const FUEL_IDS = { amount:'fAmt', liters:'fLiters', unitPrice:'fUnit' };

function readFuelValues(){
  const values = {}, hasValue = {};
  Object.keys(FUEL_IDS).forEach(function(k){
    const el = document.getElementById(FUEL_IDS[k]);
    const n = el && el.value !== '' ? Number(el.value) : NaN;
    values[k] = isFinite(n) && n > 0 ? n : null;
    hasValue[k] = values[k] != null;
  });
  return { values: values, hasValue: hasValue };
}
function markFuelAuto(derived){
  Object.keys(FUEL_IDS).forEach(function(k){
    const el = document.getElementById(FUEL_IDS[k]);
    const tag = document.getElementById('tag-'+k);
    const isAuto = !!(derived && k === derived);
    if(el) el.classList.toggle('auto-val', isAuto);
    if(tag) tag.hidden = !isAuto;
  });
}
function formatDerivedFuel(key, n){
  if(key === 'amount') return String(Math.round(n));
  if(key === 'unitPrice') return n.toFixed(1);
  return String(+(Math.round(n * 100) / 100).toFixed(2));
}
function onFuelFieldInput(field){
  if(!document.getElementById('fLiters')){ markFuelAuto(null); return; }
  const cur = readFuelValues();
  const plan = C.fuelSourcePlan(fuelTyped, field, cur.hasValue);
  fuelTyped = plan.typedOrder;
  if(!plan.derived || plan.sources.length !== 2){ markFuelAuto(null); return; }
  // Never rewrite the field the user is editing (clear, 0, or mid-retype).
  if(plan.derived === field){ markFuelAuto(null); return; }
  const out = C.deriveFuel(cur.values, plan.sources);
  if(!out.ok){ markFuelAuto(null); return; }
  const el = document.getElementById(FUEL_IDS[out.derived]);
  if(!el) return;
  el.value = formatDerivedFuel(out.derived, out[out.derived]);
  markFuelAuto(out.derived);
}
function bindFuelCalc(){
  fuelTyped = [];
  markFuelAuto(null);
  const map = { fAmt:'amount', fLiters:'liters', fUnit:'unitPrice' };
  Object.keys(map).forEach(function(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.oninput = function(){ onFuelFieldInput(map[id]); };
  });
}
function unbindFuelCalc(){
  Object.keys(FUEL_IDS).forEach(function(k){
    const el = document.getElementById(FUEL_IDS[k]);
    if(!el) return;
    el.oninput = null;
    el.classList.remove('auto-val');
  });
  fuelTyped = [];
  markFuelAuto(null);
}

const FUEL_GRADES = ['レギュラー','ハイオク','軽油'];
function normalizeFuelGrade(v){
  const s = String(v==null?'':v).trim();
  if(FUEL_GRADES.indexOf(s)>=0) return s;
  const map = { regular:'レギュラー', premium:'ハイオク', highoctane:'ハイオク', 'ハイオクガソリン':'ハイオク', diesel:'軽油', light:'軽油' };
  return map[s] || '';
}
function lastFuelGradeFor(veh){
  veh = veh || currentVehicle();
  if(!veh) return '';
  if(veh.lastFuelGrade!=null && veh.lastFuelGrade!=='') return normalizeFuelGrade(veh.lastFuelGrade);
  const recs = recordsOf(veh).filter(function(r){ return r && !r.deleted && r.category==='燃費' && normalizeFuelGrade(r.fuelGrade); })
    .sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')) || String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')); });
  return recs.length ? normalizeFuelGrade(recs[0].fuelGrade) : '';
}
function fuelGradeMeta(r){
  return r && r.category==='燃費' ? normalizeFuelGrade(r.fuelGrade) : '';
}

  if(!veh){ toast('まずは車を登録しましょう'); openVehicleEditor(null); return; }
  const cat = document.getElementById('fCat').value;
  const rec0 = state.editId ? state.records.find(function(r){ return r.id===state.editId; }) : null;
  const rec = {
    id: state.editId || newId('k'),
    vehicle: veh.name,
    vehicleId: veh.id,
    date: document.getElementById('fDate').value || todayYmd(),
    category: cat,
    categoryId: (document.getElementById('fCatId') && document.getElementById('fCatId').value) || '',
    maintenanceItemId: (document.getElementById('fMaintId') && document.getElementById('fMaintId').value) || (state.editId && rec0 && rec0.maintenanceItemId) || '',
    subcategory: document.getElementById('fSub').value || '',
    amount: readNum('fAmt'),
    odometer: readNum('fOdo'),
    memo: document.getElementById('fMemo').value || '',
    liters: null, unitPrice: null, isFullTank: false, fuelGrade: '',
    weightTax: null, liability: null, stampFee: null, serviceFee: null,
    deviceId: getDeviceId(),
    updatedAt: new Date().toISOString()
  };
  rec.fuelGrade = '';
  if(cat==='燃費'){
    rec.liters = readNum('fLiters');
    rec.unitPrice = readNum('fUnit');
    rec.isFullTank = !!(document.getElementById('fFull') && document.getElementById('fFull').checked);
    rec.fuelGrade = normalizeFuelGrade(document.getElementById('fGrade') && document.getElementById('fGrade').value);
    if((rec.amount==null || rec.amount===0) && rec.liters && rec.unitPrice) rec.amount = Math.round(rec.liters*rec.unitPrice);
    veh.lastFuelGrade = rec.fuelGrade;
    persistVehicles();
  }
  if(cat==='車検'){
    rec.weightTax = readNum('fWt');
    rec.liability = readNum('fJb');
    rec.stampFee = readNum('fSt');
    rec.serviceFee = readNum('fSv');
    const sum = (rec.weightTax||0)+(rec.liability||0)+(rec.stampFee||0)+(rec.serviceFee||0);
    if((rec.amount==null || rec.amount===0) && sum>0) rec.amount = sum;
  }
  if(rec.odometer!=null){
    if(veh.currentOdometer==null || rec.odometer > Number(veh.currentOdometer)){
      veh.currentOdometer = rec.odometer;
      veh.updatedAt = rec.updatedAt;
      persistVehicles();
    }
  }
  const idx = state.records.findIndex(function(r){ return r.id===rec.id; });
  if(idx>=0) state.records[idx] = rec; else state.records.push(rec);
  persistRecords();
  markPending(rec.id, rec.updatedAt);
  touchLastReplacementFromRecord(rec);
  state.editId = null;
  state.inputPreset = null;
  toast('保存しました');
  updateSyncBtn();
  goHistList();
  setTimeout(showAlertPopup, 450);
}

function deleteRecord(id){

  markPendingDelete(id);

  toast('削除しました');

  renderAll();
}

function categoryBarsHtml(list, from, to){

    }).join('')+'</div>';

function summaryKpiHtml(veh, allRecs){

  const now = new Date();

  const fuelSub = allRecs ? '車ごとに表示' : (fuel.kmPerL != null ? '通算・満タン法' : '満タン2回以上で算出');

    '<div class="kpi tint tint-month" id="monthKpi"><div class="lbl">今月</div><div class="val">'+escapeHtml(yen(monthSum))+'</div></div>'+
    '<div class="kpi tint tint-year" id="yearKpi"><div class="lbl">今年</div><div class="val">'+escapeHtml(yen(yearSum))+'</div></div>'+

let histCatsNow = ['all'], histFilNow = 'all';
// 履歴: 絞り込みタブより下を横スワイプ → 画面の位置と高さはそのままで、項目（絞り込み）だけ隣に切り替える
function stepHistFilter(dir){
  const i = histCatsNow.indexOf(histFilNow);
  const n = i + dir;
  if(i<0 || n<0 || n>=histCatsNow.length) return false;
  const pg = document.getElementById('page-hist');
  const y = window.scrollY || 0;
  if(pg){ const h = pg.offsetHeight; if(!pg.style.minHeight || parseInt(pg.style.minHeight,10) < h) pg.style.minHeight = h+'px'; }
  state.histFilter = histCatsNow[n];
  renderHist();
  window.scrollTo(0, y);
  const on = document.querySelector('#histFilters button.on');
  const bar = document.getElementById('histFilters');
  if(on && bar && bar.scrollWidth > bar.clientWidth){ bar.scrollLeft = Math.max(0, on.offsetLeft - (bar.clientWidth - on.offsetWidth)/2); }
  const card = document.getElementById('histListCard');
  if(card && card.animate && !reduceMotion()){ try{ card.animate([{opacity:.35, transform:'translateX('+(dir*28)+'px)'},{opacity:1, transform:'none'}],{duration:180, easing:'ease-out'}); }catch(e){} }
  return true;
}
function isHistStepStart(el, y){
  if(state.tab!=='hist') return false;

function renderHist(){
  const veh = currentVehicle();
  if(!veh){
    document.getElementById('page-hist').innerHTML = needVehicleHtml({
      title: '履歴',
      msg: 'まずは車を登録しましょう。登録すると、この車の記録がここに並びます。'
    });
    bindNeedVehicle();
    return;
  }
  const allMode = histAllMode();
  const baseRecs = allMode ? state.records.filter(function(r){ return !r.deleted; }) : recordsOf(veh);
  const recs = baseRecs.slice().sort(function(a,b){
    if(a.date!==b.date) return String(b.date).localeCompare(String(a.date));
    return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''));
  });
  let fil = state.histFilter || 'all';
  const cats = ['all'];
  const seen = { all:true };
  recs.forEach(function(r){
    const n = recordCategoryName(r);
    if(n && !seen[n]){ cats.push(n); seen[n]=true; }
    if(r.category) seen[r.category]=true;
  });
  if(fil!=='all'){
    const mapped = C.categoryLabel(C.canonicalizeCategory(fil)) || fil;
    if(seen[mapped]) fil = mapped;
    else if(!seen[fil]){
      fil = 'all';
      state.histFilter = 'all';
    }
  }
  const shown = recs.filter(function(r){ return recordMatchesFilter(r, fil); });
  histCatsNow = cats.slice(); histFilNow = fil;
  const filters = cats.map(function(c){
    return '<button type="button" class="'+(c===fil?'on':'')+'" data-f="'+escapeHtml(c)+'">'+escapeHtml(c==='all'?'すべて':c)+'</button>';
  }).join('');
  let ecoMap = {};
  if(allMode){
    state.vehicles.forEach(function(v){ Object.assign(ecoMap, C.fuelEconomyByRecordId(recordsOf(v), vehicleName(v))); });
  } else {
    ecoMap = C.fuelEconomyByRecordId(recordsOf(veh), vehicleName(veh));
  }
  const rows = shown.map(function(r){
    const grade = fuelGradeMeta(r);
    const memo = r.memo || (r.category==='燃費' && r.liters ? (r.liters+'L'+(grade?' '+grade:'')+(r.isFullTank?' 満タン':'')) : (r.subcategory||''));
    const eco = ecoMap[r.id];
    const kml = (r.category==='燃費' && eco) ? '<span class="kml">'+escapeHtml(fmtKmL(eco.kmPerL))+'</span>' : '';
    const rv = allMode ? vehicleOfRecord(r) : null;
    const vtag = allMode ? '<span class="hist-veh">'+escapeHtml(rv ? rv.name : (r.vehicle||'不明'))+'</span>' : '';
    return '<div class="hist-item" data-id="'+escapeHtml(r.id)+'">'+
      '<div class="d">'+escapeHtml(fmtDate(r.date))+'</div>'+
      '<div class="b"><div class="t">'+escapeHtml(recordCategoryName(r))+(r.subcategory && r.subcategory!==recordCategoryName(r)?' · '+escapeHtml(r.subcategory):'')+(grade?' · '+escapeHtml(grade):'')+kml+'</div>'+
      '<div class="m">'+vtag+escapeHtml(memo)+(r.odometer!=null?' · '+escapeHtml(km(r.odometer)):'')+'</div></div>'+
      '<div class="a">'+escapeHtml(yen(r.amount))+'</div></div>';
  }).join('') || '<div class="empty">記録はまだありません</div>';
  const yr = yearToDateRange(new Date());
  document.getElementById('page-hist').innerHTML =
    (allMode ? '<div class="hist-scope">全車の履歴（'+state.vehicles.length+'台分）　<span>車を選ぶと、その車だけに戻ります</span></div>' : '')+
    summaryKpiHtml(veh, allMode ? baseRecs : null)+
    (allMode ? '' : fuelDetailHtml(recordsOf(veh), vehicleName(veh)))+
    categoryBarsHtml(allMode ? baseRecs : recordsOf(veh), yr.from, yr.to)+
    '<div class="filter-bar" id="histFilters">'+filters+'</div>'+
    '<div class="card tint tint-hist" id="histListCard" style="padding-top:2px"><div class="hist">'+rows+'</div></div>'+
    '<div class="help est-note" style="padding:0 4px 8px">金額・燃費は目安です。正確さは保証できません。ご自身でご確認ください。</div>';
  bindSummaryKpis();
  document.getElementById('histFilters').onclick = function(e){
    const b = e.target.closest('button'); if(!b) return;
    state.histFilter = b.getAttribute('data-f');
    renderHist();
    pinHistFiltersSoon();
  };
  document.querySelectorAll('.hist-item').forEach(function(el){
    el.addEventListener('click', function(){
      state.editId = el.getAttribute('data-id');
      if(histAllMode()){
        // 全車の履歴から開いたときは、その記録の車に切り替えてから編集する（全車表示は保ったまま）
        const rec = state.records.find(function(r){ return r.id===state.editId; });
        const rv = vehicleOfRecord(rec);
        if(rv && rv.id!==state.settings.currentVehicleId){ state.settings.currentVehicleId = rv.id; persistSettings(); }
      }
      go('input');
    });
  });
}

function upsertCustomCategory(fields, opts){
  opts = opts || {};
  if(!fields || !String(fields.name||'').trim()) return null;
  const id = fields.id || newId('c');
  const cat = {
    id: id,
    name: String(fields.name).trim(),
    icon: fields.icon || 'star',
    color: safeColor(fields.color),
    lineColor: 'lineColor' in fields ? safeColor(fields.lineColor) : undefined,
    style: safeStyle(fields.style),
    opacity: 'opacity' in fields ? clampOpacity(fields.opacity, null) : (fields.style!=null ? parseLookField(fields.style).opacity : undefined),
    subs: Array.isArray(fields.subs) ? fields.subs.filter(Boolean) : parseSubs(fields.subs),
    alertKm: (fields.alertKm==null || fields.alertKm==='') ? null : Number(fields.alertKm),
    alertMonths: (fields.alertMonths==null || fields.alertMonths==='') ? null : Number(fields.alertMonths),
    size: 'size' in fields ? (normalizeShortcutIconSize(fields.size)||'') : undefined,
    deleted: false,
    updatedAt: new Date().toISOString()
  };
  if(cat.alertKm!=null && !isFinite(cat.alertKm)) cat.alertKm = null;
  if(cat.alertMonths!=null && !isFinite(cat.alertMonths)) cat.alertMonths = null;
  const i = (state.customCats||[]).findIndex(function(c){ return c.id===id; });
  if(!('opacity' in fields)) delete cat.opacity;
  if(!('size' in fields)) delete cat.size;
  if(!('lineColor' in fields)) delete cat.lineColor;
  if(i>=0) state.customCats[i] = Object.assign({}, state.customCats[i], cat, { deleted:false });

    if(!state.customCats) state.customCats = [];

  }
  persistCategories();
  if(opts.addShortcut){
    let ids = (state.settings.shortcuts && state.settings.shortcuts.slice()) || SHORTCUT_CATALOG.map(function(x){ return x.id; });
    const sid = 'cc:'+id;

function shortcutSettingsHtml(){
  const enabled = (state.settings.shortcuts && state.settings.shortcuts.slice()) || SHORTCUT_CATALOG.map(function(s){ return s.id; });
  const enabledSet = {};
  enabled.forEach(function(id){ enabledSet[id]=true; });
  const ordered = [];
  enabled.forEach(function(id){ const s=shortcutById(id); if(s) ordered.push(s); });
  allShortcutDefs().forEach(function(s){ if(!enabledSet[s.id]) ordered.push(s); });
  return ordered.map(function(s, i){
    const on = !!enabledSet[s.id];
    const look = resolvedLook(s);
    const ink = look.style==='fill' && look.color ? contrastInk(look.color) : (look.color || 'var(--amber)');
    const icss = look.style==='fill' && look.color
      ? 'width:22px;height:22px;color:'+escapeHtml(ink)+';background:'+escapeHtml(look.color)+';border-radius:6px;display:inline-flex;align-items:center;justify-content:center'
      : 'width:22px;height:22px;color:'+escapeHtml(look.color || '#dfac58')+';display:inline-flex';
    return '<div class="sc-edit" data-sid="'+escapeHtml(s.id)+'">'+
      '<input type="checkbox" class="sc-on"'+(on?' checked':'')+' aria-label="'+escapeHtml(s.label)+'を表示">'+
      '<span class="icn" style="'+icss+'">'+shortcutSvg(s.icon||s.id)+'</span>'+
      '<span class="nm">'+escapeHtml(s.label)+'</span>'+
      '<button type="button" class="chip-btn look-btn sc-look">見た目</button>'+
      '<span class="move">'+
        '<button type="button" class="chip-btn sc-up" '+(i===0?'disabled':'')+'>上へ</button>'+
        '<button type="button" class="chip-btn sc-down" '+(i===ordered.length-1?'disabled':'')+'>下へ</button>'+
      '</span></div>';
  }).join('');
}
function collectShortcutIdsFromUi(){
  const rows = document.querySelectorAll('#shortcutSet .sc-edit');
  const ids = [];
  rows.forEach(function(row){
    const on = row.querySelector('.sc-on');
    if(on && on.checked) ids.push(row.getAttribute('data-sid'));
  });

function bindShortcutSettings(){
  const box = document.getElementById('shortcutSet');
  if(!box) return;
  function commitAndRedraw(){
    persistShortcuts(collectShortcutIdsFromUi());
    renderSet();
  }
  box.onchange = function(e){
    if(e.target && e.target.classList.contains('sc-on')) commitAndRedraw();
  };
  box.onclick = function(e){
    const lookBtn = e.target.closest('.sc-look');
    if(lookBtn){
      const row = lookBtn.closest('.sc-edit');
      const sid = row && row.getAttribute('data-sid');
      const sc = shortcutById(sid);
      if(!sc) return;
      if(sc.customId) openCategoryEditor(sc.customId);
      else if(sc.kind==='replace') openCategoryEditor('bi:'+sc.id, { builtin:true, shortcut:sc });
      else openCategoryEditor('bi:'+sc.category, { builtin:true, shortcut:sc });
      return;
    }
    const up = e.target.closest('.sc-up');
    const down = e.target.closest('.sc-down');
    if(!up && !down) return;
    const row = e.target.closest('.sc-edit');
    if(!row) return;
    if(up && row.previousElementSibling && row.previousElementSibling.classList.contains('sc-edit')){
      row.parentNode.insertBefore(row, row.previousElementSibling);
    }
    if(down && row.nextElementSibling && row.nextElementSibling.classList.contains('sc-edit')){
      row.parentNode.insertBefore(row.nextElementSibling, row);
    }
    commitAndRedraw();
  };
}

const VEH_CC_OPTIONS = [
  {v:'kei', t:'軽自動車（660cc以下）', cc:660},
  {v:'1000', t:'1.0L以下', cc:1000},
  {v:'1500', t:'1.0L超〜1.5L以下', cc:1500},

  if(v && v.isKei) return 'kei';
  const cc = Number(v && v.displacementCc) || 0;
  if(!cc) return '';
  for(let k=1;k<VEH_CC_OPTIONS.length-1;k++){ if(cc <= VEH_CC_OPTIONS[k].cc) return VEH_CC_OPTIONS[k].v; }
  return '6001';
}

  const k = vehCcSelectValue(v);

  return o ? o.t.replace('（660cc以下）','') : '';

function csvColsSelected(){

function sanitizeFilenamePart(s){
  s = String(s == null ? '' : s).trim();
  s = s.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, '_');
  s = s.replace(/_+/g, '_').replace(/^_|_$/g, '');
  return s || '車';
}

function ecoMapAllRecords(){
  const map = {};
  (state.vehicles||[]).forEach(function(v){
    Object.assign(map, C.fuelEconomyByRecordId(recordsOf(v), vehicleName(v)));
  });
  return map;
}
function recordToCsvRow(r, cols, ecoMap){
  cols = cols || CSV_EXPORT_COLS;
  return cols.map(function(c){
    let v;
    if(c.get) v = c.get(r, ecoMap);
    else v = r[c.key];
    return C.escapeCsvField(v==null?'':v);
  }).join(',');
}
function recordsForCsvExport(opts){
  opts = opts || {};
  const vehScope = opts.vehicle != null ? opts.vehicle : csvVehicleScope();
  const period = opts.period != null ? opts.period : csvPeriodScope();
  let recs = (state.records || []).filter(function(r){ return !r.deleted; });
  if(vehScope !== 'all'){
    const v = currentVehicle();
    const name = vehicleName(v);
    const id = v && v.id;
    recs = recs.filter(function(r){ return r.vehicle === name || r.vehicleId === id || r.vehicle === id; });
  }
  if(period === 'year'){
    const yr = yearToDateRange();
    recs = recs.filter(function(r){ return inPeriod(r.date, yr.from, yr.to); });
  }
  const cats = opts.cats != null ? opts.cats : csvCatsSelected();
  if(cats && cats.length){
    recs = recs.filter(function(r){ return cats.indexOf(recordCategoryName(r))>=0 || cats.indexOf(r.category)>=0 || cats.indexOf(C.canonicalizeCategory(r.category))>=0; });
  }
  return recs;
}
function exportCsvText(opts){
  opts = opts || {};
  const ids = opts.cols || csvColsSelected();
  const cols = ids.map(function(id){ return CSV_EXPORT_COLS.find(function(c){ return c.id===id; }); }).filter(Boolean);
  if(!cols.length) return '';
  const recs = recordsForCsvExport(opts);
  const ecoMap = ecoMapAllRecords();
  const header = cols.map(function(c){ return C.escapeCsvField(c.label); }).join(',');
  const lines = [header].concat(recs.map(function(r){ return recordToCsvRow(r, cols, ecoMap); }));
  return '\uFEFF'+lines.join('\r\n');
}
function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
function shareOrDownload(blob, filename, mime, okMsg){
  const type = mime || blob.type || 'application/octet-stream';
  const file = new File([blob], filename, { type: type });
  const canFiles = navigator.share && navigator.canShare && (function(){
    try{ return navigator.canShare({ files: [file] }); }catch(e){ return false; }
  })();
  if(canFiles){
    return navigator.share({ files: [file], title: filename }).then(function(){
      if(okMsg) toast(okMsg);
      return 'shared';
    }).catch(function(e){
      if(e && e.name === 'AbortError') return 'abort';
      downloadBlob(blob, filename);
      if(okMsg) toast(okMsg);
      return 'download';
    });
  }
  downloadBlob(blob, filename);
  if(okMsg) toast(okMsg);
  return Promise.resolve('download');
}
function exportCsv(){
  const cols = csvColsSelected();
  if(!cols.length){ toast('項目を1つ以上選んでください'); return; }
  const lines = exportCsvText();
  const blob = new Blob([lines], {type:'text/csv;charset=utf-8'});
  shareOrDownload(blob, csvExportFilename(), 'text/csv;charset=utf-8', 'CSVを書き出しました');
}

const BACKUP_SCHEMA_VERSION = 1;
let pendingRestore = null;

function stampBackup(){
  state.settings.lastBackupAt = new Date().toISOString();
  persistSettings();
}
function backupAgeMs(){
  const t = Date.parse(state.settings && state.settings.lastBackupAt || '');
  return isFinite(t) ? (Date.now() - t) : null;
}
function formatBackupDate(iso){
  const t = Date.parse(iso || '');
  if(!isFinite(t)) return '';
  const d = new Date(t);
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
}
function isConnected(){
  return !!(state.settings && (state.settings.gasUrl||'').trim());
}
function backupHintHtml(){
  const at = state.settings && state.settings.lastBackupAt;
  const age = backupAgeMs();
  const connected = isConnected();
  const line = at && formatBackupDate(at)
    ? '最終バックアップ：' + formatBackupDate(at)
    : '最終バックアップ：まだ';
  let hint = '';
  if(!connected && (age == null || age > 30*24*60*60*1000)){
    hint = at
      ? '<div class="help">バックアップから30日以上経っています。書き出しておくと安心です。</div>'
      : '<div class="help">バックアップがまだありません。書き出しておくと安心です。</div>';
  }
  const cloud = connected
    ? '<div class="help">連携中のスプレッドシートがクラウドの控えになります。</div>'
    : '';
  return '<div class="help">'+escapeHtml(line)+'</div>'+hint+cloud;
}
function buildBackupPayload(opts){
  opts = opts || {};
  const settings = Object.assign({}, state.settings || {});
  if(!opts.includeGasUrl) delete settings.gasUrl;
  return {
    app: 'CarLog',
    schemaVersion: BACKUP_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    vehicles: (state.vehicles || []).slice(),
    records: (state.records || []).slice(),
    categories: (state.customCats || []).slice(),
    builtinLooks: Object.assign({}, state.builtinLooks || {}),
    intervals: (state.intervals || []).slice(),
    settings: settings
  };
}
function validateBackup(data){
  if(!data || typeof data !== 'object' || Array.isArray(data)) return { ok:false, error:'形式が正しくありません' };
  if(data.app && data.app !== 'CarLog') return { ok:false, error:'CarLogのバックアップではありません' };
  if(data.schemaVersion != null && Number(data.schemaVersion) > BACKUP_SCHEMA_VERSION){
    return { ok:false, error:'新しいバージョンのバックアップです。アプリを更新してください' };
  }
  if(data.records != null && !Array.isArray(data.records)) return { ok:false, error:'記録の形式が正しくありません' };
  if(data.vehicles != null && !Array.isArray(data.vehicles)) return { ok:false, error:'車両の形式が正しくありません' };
  if(data.categories != null && !Array.isArray(data.categories)) return { ok:false, error:'費目の形式が正しくありません' };
  if(data.intervals != null && !Array.isArray(data.intervals)) return { ok:false, error:'点検項目の形式が正しくありません' };
  if(data.builtinLooks != null && (typeof data.builtinLooks !== 'object' || Array.isArray(data.builtinLooks))) return { ok:false, error:'スタイルの形式が正しくありません' };
  if(data.settings != null && (typeof data.settings !== 'object' || Array.isArray(data.settings))) return { ok:false, error:'設定の形式が正しくありません' };
  if(data.banners != null && (typeof data.banners !== 'object' || Array.isArray(data.banners))){
    return { ok:false, error:'バナーの形式が正しくありません' };
  }
  if(!Array.isArray(data.records) && !Array.isArray(data.vehicles) && !Array.isArray(data.intervals) && !Array.isArray(data.categories)){
    return { ok:false, error:'記録または車両がありません' };
  }
  return { ok:true };
}
function parseBackupText(text){
  let data;
  try{ data = JSON.parse(String(text||'')); }
  catch(e){ return { ok:false, error:'JSONを読めません' }; }
  const v = validateBackup(data);
  if(!v.ok) return v;
  return { ok:true, data:data };
}
function queueImportedRecords(recs){
  (recs||[]).forEach(function(r){
    if(!r || !r.id) return;
    if(r.deleted) markPendingDelete(r.id);
    else markPending(r.id, r.updatedAt);
  });
}
function mergeBackupVehicles(list){
  if(!Array.isArray(list)) return;
  list.forEach(function(rv){
    if(!rv||!rv.id) return;
    const i = state.vehicles.findIndex(function(v){ return v.id===rv.id; });
    if(i<0) state.vehicles.push(rv);
    else if((Date.parse(rv.updatedAt||'')||0) >= (Date.parse(state.vehicles[i].updatedAt||'')||0)) state.vehicles[i]=Object.assign({}, state.vehicles[i], rv);
  });
  persistVehicles();
  migrateShakenFields();
  fillVehicleSelect();
}
function mergeBackupIntervals(list){
  if(!Array.isArray(list)) return;
  list.forEach(function(ri){
    if(!ri||!ri.id) return;
    const i = state.intervals.findIndex(function(x){ return x.id===ri.id && (x.vehicleId||'')===(ri.vehicleId||''); });
    if(i<0) state.intervals.push(ri);
    else if((Date.parse(ri.updatedAt||'')||0) >= (Date.parse(state.intervals[i].updatedAt||'')||0)) state.intervals[i]=Object.assign({}, state.intervals[i], ri);
  });
  persistIntervals();
}
function mergeBackupCategories(list, looks){
  if(Array.isArray(list)){
    list.forEach(function(rc){
      if(!rc||!rc.id) return;
      if(String(rc.id).indexOf('bi:')===0){
        applyBuiltinLookFromRow(rc);
        return;
      }
      const parsed = parseLookField(rc.style);
      const ucb = unpackColors(rc.color);
      rc.color = ucb.color;
      if(ucb.lineColor) rc.lineColor = ucb.lineColor;
      rc.style = parsed.style;
      if(rc.opacity==null) rc.opacity = parsed.opacity;
      const i = state.customCats.findIndex(function(c){ return c.id===rc.id; });
      if(i<0) state.customCats.push(rc);
      else if((Date.parse(rc.updatedAt||'')||0) >= (Date.parse(state.customCats[i].updatedAt||'')||0)) state.customCats[i]=Object.assign({}, state.customCats[i], rc);
    });
    persistCategories();
    persistLooks();
  }
  if(looks && typeof looks === 'object' && !Array.isArray(looks)){
    state.builtinLooks = Object.assign({}, state.builtinLooks || {}, looks);
    persistLooks();
  }
}
function mergeBackupSettings(incoming){
  if(!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) return;
  const keepUrl = state.settings.gasUrl;
  const next = Object.assign({}, state.settings, incoming);
  if(incoming.gasUrl == null || incoming.gasUrl === '') next.gasUrl = keepUrl;
  state.settings = next;
  persistSettings();
}
function applyBackupMerge(data){
  const recs = Array.isArray(data.records) ? data.records : [];
  const imported = [];
  const localById = {};
  state.records.forEach(function(r){ localById[r.id]=r; });
  recs.forEach(function(en){
    if(!en || !en.id) return;
    const loc = localById[en.id];
    if(!loc){
      state.records.push(en);
      imported.push(en);
      return;
    }
    const lt = Date.parse(loc.updatedAt||'')||0;
    const rt = Date.parse(en.updatedAt||'')||0;
    if(rt>lt){
      Object.assign(loc, en);
      imported.push(loc);
    }
  });
  persistRecords();
  mergeBackupVehicles(data.vehicles);
  mergeBackupIntervals(data.intervals);
  mergeBackupCategories(data.categories, data.builtinLooks);
  mergeBackupSettings(data.settings);
  ensureCurrentVehicle();
  persistSettings();
  fillVehicleSelect();
  queueImportedRecords(imported);
  migrateMergedCategories();
  applyTheme(state.settings.theme, false);
  if(data.banners) applyBannersFromBackupSync(data.banners, { replace:false });
  return { imported: imported.length, records: state.records.length };
}
function applyBackupReplace(data){
  const keepUrl = state.settings.gasUrl;
  state.records = Array.isArray(data.records) ? data.records.slice() : [];
  if(Array.isArray(data.vehicles) && data.vehicles.length){
    state.vehicles = data.vehicles.slice();
  }
  if(Array.isArray(data.intervals)) state.intervals = data.intervals.slice();
  if(Array.isArray(data.categories)) state.customCats = data.categories.slice();
  if(data.builtinLooks && typeof data.builtinLooks === 'object' && !Array.isArray(data.builtinLooks)){
    state.builtinLooks = Object.assign({}, data.builtinLooks);
  }
  if(data.settings && typeof data.settings === 'object' && !Array.isArray(data.settings)){
    state.settings = Object.assign({}, data.settings);
    if(!state.settings.gasUrl) state.settings.gasUrl = keepUrl;
  }
  persistRecords();
  persistVehicles();
  migrateShakenFields();
  persistIntervals();
  persistCategories();
  persistLooks();
  persistSettings();
  ensureCurrentVehicle();
  persistSettings();
  state.pending = {};
  state.pendingDel = {};
  persistPending();
  queueImportedRecords(state.records);
  fillVehicleSelect();
  migrateMergedCategories();
  applyTheme(state.settings.theme, false);
  if(data.banners) applyBannersFromBackupSync(data.banners, { replace:true });
  return { records: state.records.length };
}

function finishRestore(mode){

function parseBool(v){ const s=String(v||'').trim(); return s==='1'||s.toLowerCase()==='true'; }
function parseNum(v){ if(v==null||v==='') return null; const n=Number(String(v).replace(/^'/,'')); return isFinite(n)?n:null; }
function normalizeCsvHeader(name){
  const s = String(name||'').trim().replace(/^\uFEFF/,'').replace(/^'/, '');
  return CSV_HEADER_ALIASES[s] || s;
}
function rowToRecord(h, cols){
  const hn = (h||[]).map(normalizeCsvHeader);
  function g(k){ const i=hn.indexOf(k); return i>=0?cols[i]:''; }
  const id = String(g('id')||'').trim().replace(/^'/,'') || newId('k');
  const rec = {
    id: id,
    vehicle: String(g('vehicle')||'').replace(/^'/,''),
    date: String(g('date')||'').replace(/^'/,''),
    category: String(g('category')||'').replace(/^'/,''),
    subcategory: String(g('subcategory')||'').replace(/^'/,''),
    amount: parseNum(g('amount')),
    odometer: parseNum(g('odometer')),
    memo: String(g('memo')||'').replace(/^'/,''),
    liters: parseNum(g('liters')),
    unitPrice: parseNum(g('unitPrice')),
    isFullTank: parseBool(g('isFullTank')),
    fuelGrade: normalizeFuelGrade(g('fuelGrade')),
    weightTax: parseNum(g('weightTax')),
    liability: parseNum(g('liability')),
    stampFee: parseNum(g('stampFee')),
    serviceFee: parseNum(g('serviceFee')),
    deviceId: getDeviceId(),
    updatedAt: String(g('updatedAt')||'').replace(/^'/,'') || new Date().toISOString(),
    categoryId: String(g('categoryId')||'').replace(/^'/,''),
    maintenanceItemId: String(g('maintenanceItemId')||'').replace(/^'/,'')
  };
  return C.migrateRecordCategory(rec);
}
function importCsvText(text){
  const rows = C.parseCsv(String(text||''));
  if(!rows.length) return 0;
  const h = rows[0].map(function(x){ return String(x).trim().replace(/^\uFEFF/,''); });
  let n=0;
  for(let i=1;i<rows.length;i++){
    if(rows[i].every(function(c){ return String(c).trim()===''})) continue;
    const rec = rowToRecord(h, rows[i]);
    const idx = state.records.findIndex(function(r){ return r.id===rec.id; });
    if(idx>=0){
      if(String(rec.updatedAt) >= String(state.records[idx].updatedAt||'')){ state.records[idx]=rec; n++; }
    } else { state.records.push(rec); n++; }
    markPending(rec.id, rec.updatedAt);
  }
  persistRecords();
  updateSyncBtn();
  renderAll();
  return n;
}
function importCsvFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const n = importCsvText(reader.result||'');
      if(!n && !String(reader.result||'').trim()){ toast('CSVが空です'); return; }
      toast(n+'件を読み込みました');
    }catch(err){ toast('読み込みに失敗しました'); }
  };
  reader.readAsText(file, 'utf-8');
}

/* ---------- sync ---------- */
async function gasFetch(url, opts, timeoutMs){
  timeoutMs = timeoutMs || 30000;
  const ctrl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs) : null;
  try{
    return await fetch(url, Object.assign({}, opts||{}, ctrl?{signal:ctrl.signal}:{}));
  } finally { if(timer) clearTimeout(timer); }
}

async function syncAll(manual){
  const url = (state.settings.gasUrl||'').trim();
  if(!url){ if(manual) toast('設定で GAS の URL を入れてください'); return; }
  const st = document.getElementById('syncStatus');
  if(st) st.innerHTML = '<span class="sync-dot pending"></span>同期中…';
  try{
    const delIds = Object.keys(state.pendingDel);
    if(delIds.length){
      const delRes = await gasFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'bulk_delete', ids: delIds })
      });
      const delJson = await delRes.json();
      if(delJson && delJson.status==='ok'){
        delIds.forEach(function(id){ delete state.pendingDel[id]; });
        persistPending();
      }
    }
    const pendingEntries = state.records.filter(function(r){ return state.pending[r.id]; });
    if(pendingEntries.length){
      const upRes = await gasFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'bulk_upload', entries: pendingEntries })
      });
      const upJson = await upRes.json();
      if(upJson && upJson.status==='ok'){
        pendingEntries.forEach(function(r){
          if(!state.pending[r.id] || state.pending[r.id] <= r.updatedAt) delete state.pending[r.id];
        });
        persistPending();
      }
    }
    if(state.vehicles.length){
      await gasFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'save_vehicles', vehicles: state.vehicles })
      });
    }
    if(state.intervals.length){
      await gasFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'save_intervals', intervals: state.intervals })
      });
    }
    const catsToSync = categoriesForSync();
    if(catsToSync.length){
      await gasFetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'save_categories', categories: catsToSync })
      });
    }
    const getUrl = url + (url.indexOf('?')>=0?'&':'?') + 'action=getAll';
    const getRes = await gasFetch(getUrl);
    const data = await getRes.json();
    if(data && data.status==='ok' && Array.isArray(data.entries)){
      mergeRemote(data.entries, data.vehicles, data.intervals, data.categories);
    }
    stampBackup();
    lastSyncError = false;
    toast('同期しました');
    if(state.settings.calendarOn) syncCalendar({});
  }catch(err){
    lastSyncError = true;
    toast('同期に失敗しました（オフラインのときは後で）');
  }
  updateSyncStatus();
  renderAll();
}

let calendarMsg = '';
function calendarEvents(){
  const base = location.href.split('#')[0].split('?')[0];
  const today = C.ymd(C.toDate(new Date()));
  const out = [];
  state.vehicles.forEach(function(v){
    const vn = v.name || '車';
    const due = C.effectiveShakenDue(v, new Date()) || '';
    out.push({
      key: 'shaken:' + v.id,
      title: '車検期限　' + vn,
      date: due,
      skipIfNew: !!due && due < today,
      description: 'CarLog が自動で作った予定です。車検証の日付を優先してください。自賠責も同じ時期に切れるので、あわせて確認してください。\n' + base
    });
    // 点検・メンテ: 月数が決まっている項目だけ（前回交換＋月数の日付）。距離だけの項目は対象外。
    let list = [];
    try{ list = C.computeAlerts(intervalsFor(v), recordsOf(v), vehicleName(v), currentOdo(v), new Date()); }catch(e){ list = []; }
    list.forEach(function(a){
      const it = a.item || {};

      } else {

        if(!state.settings.calendarBase[mkey]) state.settings.calendarBase[mkey] = today;
        d = C.ymd(C.addMonths(C.toDate(state.settings.calendarBase[mkey]), Number(it.months)));
        provisional = true;
      }
      const lastTxt = (last.date ? String(last.date).replace(/-/g,'/') : '') + (last.odometer != null && last.odometer !== '' ? '・' + Math.round(Number(last.odometer)).toLocaleString('ja-JP') + ' km' : '');
      const kmTxt = Number(it.km) > 0 ? '（' + Number(it.km).toLocaleString('ja-JP') + ' km ごと）' : '';
      out.push({
        key: mkey,
        title: (it.label || '点検') + (provisional ? '（仮）' : '') + '　' + vn,
        date: d,
        skipIfNew: !!d && d < today,
        description: 'CarLog が自動で作った予定です。' + (provisional ? '前回の記録がないため、アプリに登録した日を起点にした仮の予定です。点検タブで「完了」にすると、実績の日付に置き換わります。' : '') + '\n前回：' + (lastTxt || '未設定') + '\n目安：' + Number(it.months) + 'か月ごと' + kmTxt + '\n距離が先に目安へ達したときは、アプリの点検タブで確認してください。\n' + base
      });
    });
  });
  return out;
}

async function syncCalendar(opts){
  opts = opts || {};
  const url = (state.settings.gasUrl || '').trim();
  if(!url){ if(opts.manual) toast('先に GAS の URL を入れてください'); return false; }
  const cur = calendarEvents();
  const curKeys = cur.map(function(e){ return e.key; });
  const prevKeys = Array.isArray(state.settings.calendarKeys) ? state.settings.calendarKeys : [];
  let events;
  if(opts.removeAll){
    events = cur.concat(prevKeys.filter(function(k){ return curKeys.indexOf(k) < 0; }).map(function(k){ return { key:k }; }))
      .map(function(e){ return { key:e.key, date:'' }; });
  } else {
    events = cur.concat(prevKeys.filter(function(k){ return curKeys.indexOf(k) < 0; }).map(function(k){ return { key:k, date:'' }; }));
  }
  const sig = JSON.stringify(events);
  if(!opts.force && !opts.removeAll && state.settings.calendarSig === sig) return true;
  try{
    const res = await gasFetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'sync_calendar', events: events, force: !!opts.force })
    }, 45000);
    let json = null;
    try{ json = await res.json(); }catch(e){ json = null; }
    if(json && json.status === 'ok'){
      state.settings.calendarSig = opts.removeAll ? '' : sig;
      state.settings.calendarKeys = opts.removeAll ? [] : curKeys;
      state.settings.calendarAt = new Date().toISOString();
      persistSettings();
      calendarMsg = '';
      return true;
    }
    if(json && json.status === 'unknown_action') calendarMsg = 'Code.gs が古いようです。最新の Code.gs に入れ替えて、新しいバージョンをデプロイしてください。';
    else calendarMsg = 'カレンダーに反映できませんでした：' + ((json && json.message) ? String(json.message).slice(0, 120) : 'カレンダーの承認を確認してください');
    return false;
  }catch(err){
    calendarMsg = 'カレンダーに反映できませんでした（オフラインのときは後で）';
    return false;
  }finally{
    updateCalStatus();
  }
}

function mergeRemote(entries, vehicles, intervals, categories){
  const localById = {};
  state.records.forEach(function(r){ localById[r.id]=r; });
  entries.forEach(function(en){
    if(!en || !en.id) return;
    C.migrateRecordCategory(en);
    if(state.pendingDel[en.id]) return;
    const loc = localById[en.id];
    if(!loc){ state.records.push(en); return; }
    const lt = Date.parse(loc.updatedAt||'')||0;
    const rt = Date.parse(en.updatedAt||'')||0;
    if(rt>lt){ Object.assign(loc, en); C.migrateRecordCategory(loc); }
  });
  persistRecords();
  migrateMergedCategories();
  if(Array.isArray(vehicles) && vehicles.length){
    vehicles.forEach(function(rv){
      if(!rv||!rv.id) return;
      const i = state.vehicles.findIndex(function(v){ return v.id===rv.id; });
      if(i<0) state.vehicles.push(rv);
      else if((Date.parse(rv.updatedAt||'')||0) >= (Date.parse(state.vehicles[i].updatedAt||'')||0)) state.vehicles[i]=Object.assign({}, state.vehicles[i], rv);
    });
    persistVehicles();
    migrateShakenFields();
    ensureCurrentVehicle();
    persistSettings();
    fillVehicleSelect();
  }
  if(Array.isArray(intervals) && intervals.length){
    intervals.forEach(function(ri){
      if(!ri||!ri.id) return;
      const i = state.intervals.findIndex(function(x){ return x.id===ri.id && (x.vehicleId||'')===(ri.vehicleId||''); });
      if(i<0) state.intervals.push(ri);
      else if((Date.parse(ri.updatedAt||'')||0) >= (Date.parse(state.intervals[i].updatedAt||'')||0)) state.intervals[i]=Object.assign({}, state.intervals[i], ri);
    });
    persistIntervals();
  }
  if(Array.isArray(categories) && categories.length){
    categories.forEach(function(rc){
      if(!rc||!rc.id) return;
      if(String(rc.id).indexOf('bi:')===0){
        applyBuiltinLookFromRow(rc);
        return;
      }
      const ucr = unpackColors(rc.color);
      rc.color = ucr.color;
      if(ucr.lineColor) rc.lineColor = ucr.lineColor; else if(!('lineColor' in rc)) rc.lineColor = '';
      rc.style = safeStyle(rc.style);
      const i = state.customCats.findIndex(function(c){ return c.id===rc.id; });
      if(i<0) state.customCats.push(rc);
      else if((Date.parse(rc.updatedAt||'')||0) >= (Date.parse(state.customCats[i].updatedAt||'')||0)) state.customCats[i]=Object.assign({}, state.customCats[i], rc);
    });
    persistCategories();
    persistLooks();
  }
}

const TAB_ORDER = ['home','input','hist','alert','set'];
const TAB_SWIPE_PX = 60;
function isHorizontallyScrollable(el){
  if(!el || el===document.body || el===document.documentElement) return false;
  try{
    const st = window.getComputedStyle(el);
    const ox = st && st.overflowX;
    if((ox==='auto' || ox==='scroll' || ox==='overlay') && el.scrollWidth > el.clientWidth + 4) return true;
  }catch(e){}
  return false;
}
function isSwipeIgnoredTarget(el){
  if(!el) return true;
  if(document.getElementById('modalBg') && document.getElementById('modalBg').classList.contains('show')) return true;
  const node = el.nodeType===3 ? el.parentElement : el;
  if(!node || !node.closest) return true;
  if(node.closest('input, textarea, select, [contenteditable="true"]')) return true;
  if(node.closest('.nav, .topbar, .modal-bg, .modal, .banner-edit-frame')) return true;
  if(scReorder && node.closest('#scWrap, #scToolbar, .sc-tile, .sc-placeholder')) return true;
  let n = node;
  while(n && n!==document.body){
    if(isHorizontallyScrollable(n)) return true;
    n = n.parentElement;
  }
  return false;
}
function reduceMotion(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }
}
function tabPageEl(id){ return document.getElementById('page-'+id); }
function neighborTab(dir){
  const i = TAB_ORDER.indexOf(state.tab);
  const n = i + dir;
  if(n<0 || n>=TAB_ORDER.length) return null;
  return TAB_ORDER[n];

const navInd = { el:null, pill:null, bar:null };
function navBtn(id){ return document.querySelector('#nav button[data-page="'+id+'"]'); }
function navIndEls(){
  if(!navInd.el){
    navInd.el = document.getElementById('navInd');
    if(navInd.el){
      navInd.pill = navInd.el.querySelector('.nav-ind-pill');
      navInd.bar = navInd.el.querySelector('.nav-ind-bar');
    }
  }
  return !!(navInd.el && navInd.pill && navInd.bar);
}
function navGeom(id){
  const nv = document.getElementById('nav');
  const b = navBtn(id);
  if(!nv || !b) return null;
  const pill = b.querySelector('.tab-pill') || b;
  const nr = nv.getBoundingClientRect(), br = b.getBoundingClientRect(), pr = pill.getBoundingClientRect();
  const ox = nr.left + nv.clientLeft, oy = nr.top + nv.clientTop;
  return {
    pl: pr.left - ox, pt: pr.top - oy, pw: pr.width, ph: pr.height,
    bl: br.left - ox + br.width*0.18, bw: br.width*0.64, bt: br.top - oy,
    tab: getComputedStyle(b).getPropertyValue('--tab').trim()
  };
}
function navIndPlace(a, b, t){
  const L = function(x, y){ return x + (y - x) * t; };
  const p = navInd.pill, r = navInd.bar;
  p.style.top = a.pt + 'px';
  p.style.height = a.ph + 'px';
  p.style.width = L(a.pw, b.pw) + 'px';
  p.style.transform = 'translate3d(' + L(a.pl, b.pl) + 'px,0,0)';
  r.style.top = a.bt + 'px';
  r.style.width = L(a.bw, b.bw) + 'px';
  r.style.transform = 'translate3d(' + L(a.bl, b.bl) + 'px,0,0)';
  navInd.el.style.setProperty('--tab', t <= 0 ? a.tab : (t >= 1 ? b.tab : 'color-mix(in oklab, ' + b.tab + ' ' + (t*100).toFixed(1) + '%, ' + a.tab + ')'));
}
function syncNavInd(){
  if(!navIndEls()) return;
  const g = navGeom(state.tab);
  if(!g || !(g.pw > 0)) return;
  const nv = document.getElementById('nav');
  if(nv) nv.classList.remove('is-anim');
  navIndPlace(g, g, 0);
  navInd.el.classList.add('ready');
}
function navSwipeBegin(fromId, toId){
  if(!navIndEls()) return null;
  const fb = navBtn(fromId), tb = navBtn(toId);
  const a = navGeom(fromId), b = navGeom(toId);
  if(!fb || !tb || !a || !b || !(a.pw > 0)) return null;
  fb.style.color = ''; tb.style.color = '';
  const col = function(el){ return getComputedStyle(el).color; };
  const hadF = fb.classList.contains('active'), hadT = tb.classList.contains('active');
  fb.classList.add('active'); tb.classList.remove('active');
  const fromOn = col(fb), toOff = col(tb);
  fb.classList.remove('active'); tb.classList.add('active');
  const fromOff = col(fb), toOn = col(tb);
  fb.classList.toggle('active', hadF); tb.classList.toggle('active', hadT);
  const ctx = { a:a, b:b, fb:fb, tb:tb, fromOn:fromOn, fromOff:fromOff, toOn:toOn, toOff:toOff, t:0 };
  const nv = document.getElementById('nav');
  if(nv) nv.classList.remove('is-anim');
  navSwipeSet(ctx, 0);
  return ctx;
}
function navSwipeSet(ctx, t){
  if(!ctx) return;
  t = Math.max(0, Math.min(1, t));
  ctx.t = t;
  navIndPlace(ctx.a, ctx.b, t);
  // 文字色は中間で一気に切り替えて、動くハイライトの上でも読めるようにする
  const e = t*t*(3 - 2*t);
  const pct = (e*100).toFixed(1) + '%';
  ctx.fb.style.color = 'color-mix(in oklab, ' + ctx.fromOff + ' ' + pct + ', ' + ctx.fromOn + ')';
  ctx.tb.style.color = 'color-mix(in oklab, ' + ctx.toOn + ' ' + pct + ', ' + ctx.toOff + ')';
}
function navSwipeSettle(ctx, t){
  if(!ctx) return;
  const nv = document.getElementById('nav');
  if(nv) nv.classList.add('is-anim');
  navSwipeSet(ctx, t);
}
function navSwipeClear(){
  const nv = document.getElementById('nav');
  if(!nv) return;
  nv.classList.remove('is-anim');
  nv.querySelectorAll('button').forEach(function(b){ b.style.color = ''; });
}

function cleanupTabPanes(){
  if(tabSwipe && tabSwipe.raf) cancelAnimationFrame(tabSwipe.raf);
  document.querySelectorAll('.page').forEach(function(p){
    p.classList.remove('is-swipe-pane','is-swipe-animating');
    ['transform','transition','willChange','top','left','right','bottom','width','height','position','zIndex','display','overflow','pointerEvents','background','boxSizing','padding'].forEach(function(k){ p.style[k] = ''; });
  });
  const app = document.getElementById('app');
  if(app) app.classList.remove('is-tab-swiping');
  document.documentElement.classList.remove('tab-swipe-lock');
  document.body.classList.remove('tab-swipe-lock');
  navSwipeClear();
  syncNavInd();
}
// スライド用の一時ペインは、止まったあとの通常配置（#app の余白・幅・背景）と同じ見た目にそろえる。
function layoutSwipePanes(fromId, toId, dir){
  const app = document.getElementById('app');
  const from = tabPageEl(fromId);
  const to = tabPageEl(toId);
  if(!app || !from || !to) return null;
  const bar = document.querySelector('header.topbar');
  const nav = document.querySelector('.nav');
  const scrollY = window.pageYOffset || 0;
  const top = bar ? bar.getBoundingClientRect().bottom : 0;
  const bot = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const ar = app.getBoundingClientRect();
  const cs = getComputedStyle(app);
  const padT = parseFloat(cs.paddingTop) || 0;
  const padR = parseFloat(cs.paddingRight) || 0;
  const padL = parseFloat(cs.paddingLeft) || 0;
  const padB = parseFloat(cs.paddingBottom) || 0;
  const bodyPadB = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
  const navH = nav ? nav.getBoundingClientRect().height : 0;
  const gapB = padB + Math.max(0, bodyPadB - navH);
  const left = ar.left;
  const width = ar.width;
  const height = Math.max(1, bot - top);
  const navCtx = navSwipeBegin(fromId, toId);
  app.classList.add('is-tab-swiping');
  document.documentElement.classList.add('tab-swipe-lock');
  document.body.classList.add('tab-swipe-lock');
  [from, to].forEach(function(p, i){
    p.classList.add('is-swipe-pane');
    p.style.display = 'block';
    p.style.position = 'fixed';
    p.style.boxSizing = 'border-box';
    p.style.left = left+'px';
    p.style.right = 'auto';
    p.style.top = top+'px';
    p.style.width = width+'px';
    p.style.height = height+'px';
    p.style.padding = padT+'px '+padR+'px '+gapB+'px '+padL+'px';
    p.style.overflow = 'hidden auto';
    p.style.willChange = 'transform';
    p.style.transition = 'none';
    p.style.pointerEvents = 'none';
    p.style.zIndex = i===0 ? '7' : '6';
  });
  from.style.transform = 'translate3d(0,0,0)';
  to.style.transform = 'translate3d('+(dir>0?width:-width)+'px,0,0)';
  from.scrollTop = scrollY;
  to.scrollTop = 0;
  return { from:from, to:to, width:width, dir:dir, fromId:fromId, toId:toId, scrollY:scrollY, nav:navCtx };
}
function applySwipeX(panes, dx){
  if(!panes) return;
  const w = panes.width;
  let x = dx;
  if(panes.dir>0 && x>0) x = x*0.28;
  if(panes.dir<0 && x<0) x = x*0.28;
  panes.from.style.transform = 'translate3d('+x+'px,0,0)';
  panes.to.style.transform = 'translate3d('+(x + (panes.dir>0?w:-w))+'px,0,0)';
  if(panes.nav) navSwipeSet(panes.nav, ((panes.dir>0 ? -x : x)) / w);
}
function settleSwipePanes(panes, commit, onDone){
  if(!panes){ if(onDone) onDone(); return; }
  if(reduceMotion()){ if(onDone) onDone(); return; }
  const gen = tabSwipeGen;
  const w = panes.width;
  const endX = commit ? (panes.dir>0 ? -w : w) : 0;
  const ease = 'transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1)';
  panes.from.style.transition = ease;
  panes.to.style.transition = ease;
  panes.from.classList.add('is-swipe-animating');
  panes.to.classList.add('is-swipe-animating');
  panes.from.style.transform = 'translate3d('+endX+'px,0,0)';
  panes.to.style.transform = 'translate3d('+(endX + (panes.dir>0?w:-w))+'px,0,0)';
  if(panes.nav) navSwipeSettle(panes.nav, commit ? 1 : 0);
  let done=false;
  function finish(){
    if(done || gen!==tabSwipeGen) return;
    done=true;
    if(onDone) onDone();
  }
  panes.to.addEventListener('transitionend', finish, {once:true});
  panes.from.addEventListener('transitionend', finish, {once:true});
  setTimeout(finish, 280);
}

let tabSwipe = null;

function trySwitchTabBySwipe(dx, dy, target){
  if(isSwipeIgnoredTarget(target)) return false;
  dx = Number(dx)||0; dy = Number(dy)||0;
  if(Math.abs(dx) < TAB_SWIPE_PX) return false;
  if(Math.abs(dy) >= Math.abs(dx) * 0.75) return false;
  const i = TAB_ORDER.indexOf(state.tab);
  if(i<0) return false;
  const next = dx < 0 ? i+1 : i-1;
  if(next<0 || next>=TAB_ORDER.length) return false;
  const page = TAB_ORDER[next];
  if(page!=='input'){ state.editId=null; state.inputPreset=null; }
  else if(state.tab!=='input'){ state.editId=null; state.inputPreset=null; }
  go(page, { animate:true });
  return true;
}
function bindTabSwipe(){
  let startX=0, startY=0, tracking=false, armed=false, histStep=false;
  const root = document.getElementById('app');
  if(!root || root._tabSwipeBound) return;
  root._tabSwipeBound = true;
  root.addEventListener('touchstart', function(e){
    if(tabAnim || scDrag) { tracking=false; return; }
    if(e.touches.length!==1){ tracking=false; return; }
    const t = e.touches[0];
    startX=t.clientX; startY=t.clientY;
    histStep = isHistStepStart(e.target, t.clientY) && !isSwipeIgnoredTarget(e.target) && !document.getElementById('modalBg')?.classList.contains('show');
    tracking = histStep || !isSwipeIgnoredTarget(e.target);
    armed = false;
  }, {passive:true});
  root.addEventListener('touchmove', function(e){
    if(!tracking || e.touches.length!==1) return;
    if(histStep){
      const t0 = e.touches[0];
      if(Math.abs(t0.clientY-startY) > Math.abs(t0.clientX-startX) && Math.abs(t0.clientY-startY) > 12) tracking=false;
      return;
    }
    if(reduceMotion()){
      const t = e.touches[0];
      const dx = t.clientX-startX, dy = t.clientY-startY;
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 16) tracking=false;
      return;
    }
    const t = e.touches[0];
    const dx = t.clientX-startX, dy = t.clientY-startY;
    if(!armed){
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){ tracking=false; return; }
      if(Math.abs(dx) < 12 || Math.abs(dy) >= Math.abs(dx) * 0.75) return;
      const dir = dx < 0 ? 1 : -1;
      const dest = neighborTab(dir);
      if(!dest){ tracking=false; return; }
      const panes = layoutSwipePanes(state.tab, dest, dir);
      if(!panes){ tracking=false; return; }
      renderTabContentFor(dest);
      bumpTabSwipeGen();
      tabSwipe = Object.assign({ dest:dest, dx:0, raf:0 }, panes);
      armed = true;
    }
    if(armed && tabSwipe){
      if(e.cancelable) e.preventDefault();
      tabSwipe.dx = dx;
      if(!tabSwipe.raf) tabSwipe.raf = requestAnimationFrame(function(){
        if(!tabSwipe) return;
        tabSwipe.raf = 0;
        applySwipeX(tabSwipe, tabSwipe.dx);
      });
    }
  }, {passive:false});
  function endSwipe(e){
    if(!tracking) return;
    tracking=false;
    const t = (e.changedTouches && e.changedTouches[0]) || {};
    const dx = (t.clientX||startX)-startX, dy = (t.clientY||startY)-startY;
    if(histStep){
      histStep = false;
      if(Math.abs(dx) >= TAB_SWIPE_PX*0.7 && Math.abs(dy) < Math.abs(dx)*0.75) stepHistFilter(dx<0 ? 1 : -1);
      return;
    }
    if(armed && tabSwipe){
      const commit = Math.abs(tabSwipe.dx) >= Math.min(TAB_SWIPE_PX, tabSwipe.width*0.22);
      const dest = tabSwipe.dest;
      const panes = tabSwipe;
      if(panes.raf) cancelAnimationFrame(panes.raf);
      tabAnim = true;
      settleSwipePanes(panes, commit, function(){
        tabSwipe = null;
        tabAnim = false;
        cleanupTabPanes();
        if(commit){
          state.editId=null; state.inputPreset=null;
          go(dest, { prerendered:true });
        } else if(panes.scrollY > 0){
          window.scrollTo(0, panes.scrollY);
        }
      });
      armed = false;
      return;
    }
    armed = false;
    trySwitchTabBySwipe(dx, dy, e.target);
  }
  root.addEventListener('touchend', endSwipe, {passive:true});
  root.addEventListener('touchcancel', endSwipe, {passive:true});
}
function previewTabSwipe(frac){
  frac = (frac==null) ? 0.42 : frac;
  if(tabSwipe && tabSwipe.preview){ cleanupTabPanes(); tabSwipe=null; }
  const dir = 1;
  const dest = neighborTab(dir);
  if(!dest) return null;
  const header = document.querySelector('header.topbar');
  const before = header ? header.getBoundingClientRect() : null;
  renderTabContent(dest);
  const panes = layoutSwipePanes(state.tab, dest, dir);
  if(!panes) return null;
  const dx = -panes.width * frac;
  applySwipeX(panes, dx);
  tabSwipe = Object.assign({ dest:dest, dx:dx, raf:0, preview:true }, panes);
  const after = header ? header.getBoundingClientRect() : null;
  return {
    from: state.tab,
    to: dest,
    dx: dx,
    headerBefore: before ? {x:before.x,y:before.y,w:before.width,h:before.height} : null,
    headerAfter: after ? {x:after.x,y:after.y,w:after.width,h:after.height} : null,
    fromTransform: panes.from.style.transform,
    toTransform: panes.to.style.transform,
    fromId: panes.from.id,
    toId: panes.to.id
  };
}
function endTabSwipePreview(){
  if(tabSwipe && tabSwipe.preview){
    cleanupTabPanes();
    tabSwipe=null;
    tabAnim=false;
  }
}

function showAlertPopup(){
  const list = alertPopupItems();

    const isShaken = a.kind==='shaken' || (a.item && a.item.id==='shaken');

function pinHistFilters(){
  const el = document.getElementById('histFilters');
  const pg = document.getElementById('page-hist');
  if(!el) return;
  if(pg){
    const need = el.getBoundingClientRect().top + (window.scrollY||0) + window.innerHeight;
    if(pg.offsetHeight < need) pg.style.minHeight = Math.ceil(need) + 'px';
  }
  el.scrollIntoView({ block:'start', behavior:'auto' });
}

function go(page, opts){
  opts = opts || {};
  try{ const hp = document.getElementById('page-hist'); if(hp && hp.style.minHeight && !(opts && opts.keepHistPad)) hp.style.minHeight = ''; }catch(e){}
  if(tabSwipe || tabAnim){
    const mid = !!(tabSwipe || tabAnim);
    abortTabSwipe();
    if(mid) opts = Object.assign({}, opts, { animate:false });
  }
  const from = state.tab;
  const animate = !!(opts.animate && from && page && page!==from && !reduceMotion() && !scDrag);
  if(animate){
    const dir = (TAB_ORDER.indexOf(page) > TAB_ORDER.indexOf(from)) ? 1 : -1;
    const panes = layoutSwipePanes(from, page, dir);
    if(panes){
      renderTabContent(page);
      bumpTabSwipeGen();
      state.tab = page;
      document.body.setAttribute('data-tab', page);
      document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-page')===page); });
      updateSyncBtn();
      updateAlertBadge();
      tabAnim = true;
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          settleSwipePanes(panes, true, function(){
            tabAnim = false;
            cleanupTabPanes();
            document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id==='page-'+page); });
            updateSyncBtn();
            updateAlertBadge();
            syncNavInd();
            window.scrollTo(0,0);
          });
        });
      });
      return;
    }
  }
  state.tab = page;
  document.body.setAttribute('data-tab', page);
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id==='page-'+page); });
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-page')===page); });
  if(opts.prerendered){ updateSyncBtn(); updateAlertBadge(); }
  else renderAll();
  syncNavInd();
  window.scrollTo(0,0);
}

const THEME_IDS = ['glass','glass-light','neumo','neumo-dark','neon','hygge','industrial','mecha','sf','marchen','pastel','flower'];
const THEME_COLORS = { glass:'#07101c', 'glass-light':'#e8f3fa', neumo:'#c9ccd1', 'neumo-dark':'#2c2e33', neon:'#0a0908', hygge:'#d0ae82', industrial:'#2b2c2e', mecha:'#2b3a56', sf:'#1c1626', marchen:'#fdf0f2', pastel:'#f7f8fd', flower:'#fdf6f3' };
const THEME_META = {
  glass: { id:'glass', name:'ガラス', color: THEME_COLORS.glass },
  'glass-light': { id:'glass-light', name:'ガラス・ライト', color: THEME_COLORS['glass-light'] },
  neumo: { id:'neumo', name:'ニューモ', color: THEME_COLORS.neumo },
  'neumo-dark': { id:'neumo-dark', name:'ニューモ・ダーク', color: THEME_COLORS['neumo-dark'] },
  neon: { id:'neon', name:'ネオン', color: THEME_COLORS.neon },
  hygge: { id:'hygge', name:'ヒュッゲ', color: THEME_COLORS.hygge },
  industrial: { id:'industrial', name:'インダストリアル', color: THEME_COLORS.industrial },
  mecha: { id:'mecha', name:'メカ', color: THEME_COLORS.mecha },
  sf: { id:'sf', name:'SF', color: THEME_COLORS.sf },
  marchen: { id:'marchen', name:'メルヘン', color: THEME_COLORS.marchen },
  pastel: { id:'pastel', name:'パステル', color: THEME_COLORS.pastel },
  flower: { id:'flower', name:'フラワー', color: THEME_COLORS.flower }
};
function normalizeTheme(id){
  id = String(id == null ? '' : id).trim();
  if(id === 'ガラス・ライト' || id === 'glass_light' || id === 'glassLight') id = 'glass-light';
  else if(id === 'C' || id === 'ガラス') id = 'glass';
  if(id === 'ニューモ・ダーク' || id === 'neumo_dark' || id === 'neumoDark') id = 'neumo-dark';
  else if(id === 'I' || id === 'ニューモ') id = 'neumo';
  if(id === 'D' || id === 'ネオン') id = 'neon';
  if(id === 'ヒュッゲ') id = 'hygge';
  else if(id === 'インダストリアル') id = 'industrial';
  else if(id === 'メカ') id = 'mecha';
  else if(id === 'SF' || id === 'ＳＦ') id = 'sf';
  return THEME_IDS.indexOf(id) >= 0 ? id : 'glass';
}
function isLightTheme(id){
  // 引数なしで呼ばれたときは今のテーマで判定する（同じ名前の関数が2つあり、こちらが優先されるため）
  if(id === undefined) id = document.documentElement.getAttribute('data-theme');
  id = normalizeTheme(id);
  return id === 'neumo' || id === 'glass-light' || id === 'hygge' || id === 'mecha' || id === 'marchen' || id === 'pastel' || id === 'flower';
}
function applyTheme(id, persist){
  id = normalizeTheme(id);
  document.documentElement.setAttribute('data-theme', id);
  const color = THEME_COLORS[id] || THEME_COLORS.glass;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', color);
  const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  // メカは上の帯が濃い紺なので、ステータスバーの文字は白にする
  if(bar) bar.setAttribute('content', (isLightTheme(id) && id !== 'mecha') ? 'default' : 'black-translucent');
  if(persist !== false && state && state.settings){
    state.settings.theme = id;
    persistSettings();
  }
  return id;
}
function setTheme(id){ return applyTheme(id, true); }
function currentTheme(){
  return normalizeTheme((state && state.settings && state.settings.theme) || document.documentElement.getAttribute('data-theme'));
}
function themePickerHtml(){
  const cur = currentTheme();
  const items = THEME_IDS.map(function(id){
    const meta = THEME_META[id];

    return '<button type="button" class="theme-swatch'+(on?' on':'')+'" data-theme-id="'+id+'" role="radio" aria-checked="'+(on?'true':'false')+'" aria-pressed="'+(on?'true':'false')+'">'+
      '<span class="sw-preview sw-'+id+'" aria-hidden="true"></span>'+
      '<span class="sw-name">'+escapeHtml(meta.name)+'</span></button>';
  }).join('');
  return '<div class="card tint tint-theme" id="themeSet"><h2>テーマ</h2>'+
    '<div class="theme-swatches" role="radiogroup" aria-label="テーマ">'+items+'</div>'+
    '<div class="help" style="margin:4px 0 0">見た目はこの端末に保存されます。</div></div>';
}

}
