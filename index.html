<!DOCTYPE html>
<html lang="ja" data-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CarLog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#07101c">
<script>
(function(){
  var colors = { glass:'#07101c', 'glass-light':'#e8f3fa', neumo:'#c9ccd1', 'neumo-dark':'#2c2e33', neon:'#0a0908' };
  var ids = { glass:1, 'glass-light':1, neumo:1, 'neumo-dark':1, neon:1 };
  var t = 'glass';
  try{
    var raw = localStorage.getItem('carlog_settings');
    var st = raw ? JSON.parse(raw) : null;
    if(st && ids[st.theme]) t = st.theme;
  }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', colors[t] || colors.glass);
  var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(bar) bar.setAttribute('content', (t==='neumo' || t==='glass-light') ? 'default' : 'black-translucent');
})();
</script>

<title>CarLog beta 0.9.21</title>
<style>
:root{
  --asphalt:#0c0e11;
  --panel:#232933;
  --panel-light:#2f3746;
  --line:#363f4e;
  --paper:#e9e6df;
  --paper-dim:#b0b7c0;
  --amber:#dfac58;
  --ok:#4ade80;
  --danger:#ff5a2e;
  --cold:#3fa9f5;
  --nav-h:56px;
  --tab-home:#dfac58;
  --tab-input:#2dd4bf;
  --tab-hist:#6ea8ff;
  --tab-alert:#ff7a55;
  --tab-set:#ff8fb0;
  --screen: var(--tab-home);
  --font-ui:'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif;
  --font-display:'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif;
  --font-mono:'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,sans-serif;
  --chip-bg:#181d24;
  --chip-line:#3d4756;
  --chip-fg:#cbd5e1;
  --kpi-bg:#1a1f27;
  --kpi-line:#323a47;
  --hairline:#2c3340;
  --input-bg:#14171b;
  --input-line:#384252;
  --input-fg:#fff;
  --nav-bg:#15181c;
  --topbar-bg:linear-gradient(180deg,#0c0e11 70%,rgba(12,14,17,.9));
  --ink-on-accent:#1a1408;
  --radius-card:10px;
  --radius-tile:12px;
  --radius-chip:16px;
  --radius-btn:8px;
  --card-border-w:2px;
  --card-shadow:none;
  --tile-shadow:none;
  --nav-top-line:2px solid var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--asphalt);color:var(--paper);
  font-family:var(--font-ui);width:100%;max-width:100%;overflow-x:hidden;}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));}
button,select,input,textarea{font:inherit;color:inherit;touch-action:manipulation;}
button{cursor:pointer;}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.kpi .val,.stat-line .v,.rank-row .km,.rank-row .kml,.rank-row .lit,.alert-item .adetail,.alert-item .meta,.bar-row .amt,.hist-item .kml,.hist-item .d,.hist-item .a,.int-row input,.home-banner .banner-odo{font-variant-numeric:tabular-nums;}
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);
  border-bottom:3px solid color-mix(in srgb, var(--screen) 72%, var(--line));padding:8px 12px 8px;display:flex;align-items:center;gap:6px;}
.topbar .brand{flex:0 0 auto;flex-shrink:0;min-width:auto;}
.topbar .eyebrow{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--screen);text-transform:none;}
.beta-badge{display:inline-block;margin-left:6px;vertical-align:middle;font-family:var(--font-mono);font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--screen);border:1.5px solid color-mix(in srgb, var(--screen) 55%, transparent);background:color-mix(in srgb, var(--screen) 14%, transparent);border-radius:4px;padding:1px 5px;position:relative;top:-2px;text-transform:uppercase;}
body[data-tab="home"]{--screen:var(--tab-home);}
body[data-tab="input"]{--screen:var(--tab-input);}
body[data-tab="hist"]{--screen:var(--tab-hist);}
body[data-tab="alert"]{--screen:var(--tab-alert);}
body[data-tab="set"]{--screen:var(--tab-set);}
.topbar h1{font-size:22px;letter-spacing:.02em;line-height:1.1;text-transform:none;white-space:nowrap;}
.topbar .tagline{font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--paper-dim);margin-top:2px;letter-spacing:.02em;line-height:1.3;white-space:nowrap;overflow:visible;text-overflow:clip;width:auto;min-width:0;}
.sc-grid{--sc-gap:6px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-flow:dense;gap:var(--sc-gap);margin:0 0 8px;align-items:stretch;}
.sc-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-tile);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--paper);min-height:64px;box-shadow:var(--tile-shadow);grid-column:span 2;grid-row:span 2;min-width:0;}
.sc-tile:active{border-color:var(--amber);background:rgba(223,172,88,.08);}
.sc-tile .icn{width:28px;height:28px;color:var(--amber);display:flex;align-items:center;justify-content:center;}
.sc-tile .icn svg{width:26px;height:26px;display:block;}
.sc-tile .lbl{font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.2;text-align:center;}
.sc-tile.sc-fill{border-width:1.5px;border-style:solid;}
.sc-tile.sc-fill .lbl{font-weight:800;text-shadow:0 1px 1px rgba(0,0,0,.4);}
.sc-tile.sc-fill .icn{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}
#scWrap{container-type:inline-size;}
#scGrid.sc-grid{--sc-cell:calc((100cqi - 7 * var(--sc-gap)) / 8);grid-auto-rows:var(--sc-cell);}
#scGrid .sc-tile{min-height:0;height:auto;}
#scGrid .sc-tile.sc-s{grid-column:span 1;grid-row:span 1;padding:3px 2px 2px;gap:1px;}
#scGrid .sc-tile.sc-s .icn{width:18px;height:18px;}
#scGrid .sc-tile.sc-s .icn svg{width:16px;height:16px;}
#scGrid .sc-tile.sc-s .lbl{font-size:8px;line-height:1.1;letter-spacing:0;max-width:100%;overflow:hidden;white-space:nowrap;word-break:normal;}
#scGrid .sc-tile.sc-s.sc-icon-only .lbl{display:none;}
#scGrid .sc-tile.sc-s.sc-icon-only .icn{width:20px;height:20px;}
#scGrid .sc-tile.sc-s.sc-icon-only .icn svg{width:18px;height:18px;}
#scGrid .sc-tile.sc-m{grid-column:span 2;grid-row:span 2;}
#scGrid .sc-tile.sc-l{grid-column:span 4;grid-row:span 4;min-height:0;height:100%;padding:12px 8px;gap:8px;}
#scGrid .sc-tile.sc-l .icn{width:48px;height:48px;}
#scGrid .sc-tile.sc-l .icn svg{width:44px;height:44px;}
#scGrid .sc-tile.sc-l .lbl{font-size:13px;font-weight:800;line-height:1.25;}
.sc-edit{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:13px;}
.sc-edit .nm{flex:1;font-weight:600;}
.sc-edit .move{display:flex;gap:4px;}
details.tax-fold{background:var(--panel);border:var(--card-border-w) solid var(--line);border-radius:var(--radius-card);padding:8px 10px;margin-bottom:8px;box-shadow:var(--card-shadow);}
details.tax-fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-size:11px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;font-weight:700;}
details.tax-fold>summary::-webkit-details-marker{display:none;}
details.tax-fold>summary .hint{font-family:var(--font-ui);font-size:10px;letter-spacing:0;color:var(--paper-dim);text-transform:none;font-weight:500;}
details.tax-fold[open]>summary{margin-bottom:6px;}
#avgFuelKpi{cursor:pointer;}

.icon-btn,.chip-btn{background:var(--chip-bg);border:1px solid var(--chip-line);color:var(--chip-fg);border-radius:16px;
  font-size:11px;font-weight:700;padding:5px 10px;white-space:nowrap;}
.icon-btn:active,.chip-btn:active{border-color:var(--amber);color:var(--amber);}
.icon-btn.warn{border-color:var(--amber);color:var(--amber);background:rgba(223,172,88,.1);}
#app{padding:8px 10px 6px;max-width:480px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--nav-bg);
  border-top:var(--nav-top-line);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding:0 2px env(safe-area-inset-bottom,0px);}
.nav button{flex:1;min-width:0;background:none;border:0;color:color-mix(in srgb,var(--tab,#8b95a5) 58%,#8a93a3);
  font-size:11px;font-weight:700;letter-spacing:.02em;padding:0;height:100%;position:relative;
  display:flex;align-items:center;justify-content:center;}
.nav button[data-page="home"]{--tab:var(--tab-home);}
.nav button[data-page="input"]{--tab:var(--tab-input);}
.nav button[data-page="hist"]{--tab:var(--tab-hist);}
.nav button[data-page="alert"]{--tab:var(--tab-alert);}
.nav button[data-page="set"]{--tab:var(--tab-set);}
.nav button .tab-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:calc(100% - 4px);max-width:68px;min-width:0;padding:5px 2px 4px;border-radius:12px;}
.nav button .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
.nav button .ic svg{width:20px;height:20px;display:block;}
.nav button .tab-lbl{font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.nav button.active{color:var(--ink-on-accent);}
.nav button.active .tab-pill{background:var(--tab);box-shadow:0 0 0 1px color-mix(in srgb,var(--tab) 70%,#fff 10%);}
.nav button.active::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 3px 3px;background:var(--tab);}
.card{background:var(--panel);border:var(--card-border-w) solid var(--line);border-radius:var(--radius-card);padding:8px 10px;margin-bottom:8px;box-shadow:var(--card-shadow);}
.card h2{font-size:11px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;}
.card h2 .hint{font-family:var(--font-ui);font-size:10px;letter-spacing:0;color:var(--paper-dim);text-transform:none;font-weight:600;}
.row{display:flex;gap:6px;align-items:stretch;}
.kpi-row{margin-bottom:8px;}
.kpi{flex:1;background:var(--kpi-bg);border:2px solid var(--kpi-line);border-radius:var(--radius-btn);padding:6px 8px;min-width:0;box-shadow:var(--tile-shadow);}
.kpi .lbl{font-size:10px;color:var(--paper-dim);letter-spacing:.04em;font-weight:700;}
.kpi .val{font-family:var(--font-mono);font-size:16px;font-weight:800;margin-top:1px;letter-spacing:-.02em;}
.kpi .sub{font-size:10px;color:var(--paper-dim);margin-top:1px;font-weight:600;}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--hairline);font-size:12px;}
.stat-line:last-child{border-bottom:0;}
.stat-line .k{color:var(--paper-dim);font-weight:600;}
.stat-line .v{font-family:var(--font-mono);font-weight:800;}
.rank-row{display:flex;align-items:baseline;gap:6px;padding:2px 0;border-bottom:1px solid var(--hairline);font-size:12px;}
.rank-row:last-child{border-bottom:0;}
.rank-row .rk{flex-shrink:0;width:22px;text-align:center;font-size:14px;line-height:1.2;}
.rank-row .km{font-weight:800;font-family:var(--font-mono);}
.rank-row .dt{color:var(--paper-dim);font-weight:600;flex:1;font-size:11px;}
.rank-row .kml{font-family:var(--font-mono);font-weight:800;font-size:11px;}
.rank-row .lit{color:var(--paper-dim);font-family:var(--font-mono);font-weight:700;font-size:11px;white-space:nowrap;}
.bk-check{display:flex;align-items:center;gap:6px;margin:4px 0 2px;font-size:11px;color:var(--paper-dim);font-weight:600;}
.bk-check input{margin:0;}
.bk-bar{margin-top:6px;padding:6px 8px;border:1px solid var(--chip-line);border-radius:8px;background:var(--chip-bg);}
.btn.danger{border-color:var(--danger);color:var(--danger);}
.csv-chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px;}
.csv-chips button{background:var(--chip-bg);border:1px solid var(--chip-line);color:var(--chip-fg);border-radius:14px;font-size:10px;font-weight:700;padding:4px 8px;}
.csv-chips button.on{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 85%, transparent);color:var(--ink-on-accent);}
.csv-mini{display:flex;gap:8px;margin:0 0 6px;}
.csv-mini button{background:none;border:0;color:var(--amber);font-size:10px;font-weight:700;padding:0;cursor:pointer;}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;letter-spacing:.05em;border:1.5px solid transparent;}
.badge.measu{background:rgba(223,172,88,.15);color:var(--amber);border-color:rgba(223,172,88,.45);}
.badge.heavy{background:rgba(255,90,46,.18);color:var(--danger);border-color:rgba(255,90,46,.45);}
.badge.ok{background:rgba(74,222,128,.16);color:var(--ok);border-color:rgba(74,222,128,.45);}
.badge.soon{background:rgba(223,172,88,.18);color:var(--amber);border-color:rgba(223,172,88,.45);}
.badge.overdue{background:rgba(255,90,46,.2);color:var(--danger);border-color:rgba(255,90,46,.5);}
.badge.unknown{background:#2a303a;color:#c5cdd6;border-color:#4a5464;}
.alert-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--hairline);font-size:12px;}
.alert-item:last-child{border-bottom:0;}
.alert-item .name{flex:1;font-weight:700;min-width:0;}
.alert-item .adetail{font-size:10px;color:var(--paper-dim);font-family:var(--font-mono);margin-top:2px;line-height:1.35;font-weight:600;}
.alert-item .meta{font-size:10px;color:var(--paper-dim);font-family:var(--font-mono);text-align:right;font-weight:700;}
.link-btn{background:none;border:0;color:var(--amber);font-size:10px;font-weight:700;padding:0 0 0 4px;cursor:pointer;vertical-align:baseline;}
.alert-card{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;
  column-gap:8px;row-gap:4px;align-items:center;padding:14px 12px;margin:0 0 8px;
  border:1px solid var(--line);border-radius:var(--radius-card);background:var(--kpi-bg);box-sizing:border-box;}
.alert-card:last-child{margin-bottom:0;}
.alert-card-head{grid-column:1;grid-row:1;display:flex;align-items:center;gap:5px;min-width:0;}
.alert-card-head .name{font-size:16px;font-weight:800;min-width:0;line-height:1.3;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert-card .badge{flex:0 0 auto;font-size:10px;font-weight:700;padding:2px 5px;border-radius:999px;letter-spacing:.02em;line-height:1.2;}
.alert-card-head .alert-edit{
  position:relative;flex:0 0 auto;box-sizing:content-box;width:1.2em;height:1.2em;margin:0 0 0 3px;padding:2px;
  font-size:10px;line-height:1;min-width:0;min-height:0;border-radius:999px;
  border:1.5px solid color-mix(in srgb, var(--paper-dim) 40%, transparent);
  background:color-mix(in srgb, var(--paper-dim) 14%, transparent);color:var(--paper-dim);
  display:inline-flex;align-items:center;justify-content:center;
}
.alert-card-head .alert-edit svg{width:10px;height:10px;display:block;}
.alert-card-head .alert-edit::before{content:"";position:absolute;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);}
.alert-card-remain{grid-column:2;grid-row:1 / 3;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;min-width:0;max-width:38%;width:max-content;justify-self:end;align-self:center;}
.alert-card-sub{grid-column:1;grid-row:2;display:flex;align-items:baseline;gap:8px;min-width:0;margin-top:0;}
.alert-card-foot{grid-column:1 / -1;grid-row:3;display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;margin-top:4px;}
.alert-card-actions{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:4px;margin:0;flex:0 0 auto;}
.alert-info{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;line-height:1.4;color:var(--paper-dim);font-family:var(--font-mono);}
.alert-info .alert-date{white-space:nowrap;}
.alert-remain{flex:0 0 auto;font-size:13px;font-weight:800;line-height:1.35;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;letter-spacing:-.02em;}
@media (max-width:360px){
  .alert-card{padding:12px 10px;column-gap:6px;}
  .alert-card-head{gap:4px;}
  .alert-card .badge{padding:1px 4px;font-size:9px;letter-spacing:0;}
  .alert-card-head .alert-edit{font-size:9px;padding:1px;margin-left:2px;}
  .alert-card-head .alert-edit svg{width:9px;height:9px;}
  .alert-remain{font-size:12px;}
}

.alert-remain.is-ok{color:var(--ok);}
.alert-remain.is-soon,.alert-remain.is-caution{color:var(--amber);}
.alert-remain.is-overdue,.alert-remain.is-action{color:var(--danger);}
.alert-remain.is-info{color:var(--cold,#4a90c8);}
.alert-remain.is-reserved{color:var(--ok);}
.alert-remain.is-unknown{color:var(--paper-dim);}
.alert-bar{flex:1 1 auto;min-width:0;height:4px;margin:0;border-radius:2px;overflow:hidden;align-self:center;
  background:color-mix(in srgb, var(--paper-dim) 28%, transparent);}
.alert-bar>i{display:block;height:100%;width:0;max-width:100%;border-radius:2px;background:var(--paper-dim);}
.alert-bar.is-ok>i{background:var(--ok);}
.alert-bar.is-soon>i,.alert-bar.is-caution>i{background:var(--amber);}
.alert-bar.is-overdue>i,.alert-bar.is-action>i{background:var(--danger);}
.alert-bar.is-info>i{background:var(--cold,#4a90c8);}
.alert-bar.is-reserved>i{background:var(--ok);}
.alert-action{
  flex:0 0 auto;width:auto;min-width:0;min-height:32px;height:32px;padding:0 12px;font-size:13px;font-weight:700;
  border-radius:999px;box-sizing:border-box;touch-action:manipulation;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;line-height:1.2;white-space:nowrap;
  border:1px solid color-mix(in srgb, var(--amber) 40%, transparent);
  background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--amber);
}
.alert-edit,.alert-chevron{
  flex:0 0 auto;width:32px;height:32px;min-width:32px;min-height:32px;padding:0;border:0;background:transparent;
  color:var(--paper-dim);border-radius:8px;box-sizing:border-box;touch-action:manipulation;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-family:inherit;
}
.alert-edit svg,.alert-chevron svg{display:block;}
.alert-chevron{cursor:default;opacity:.7;}
.alert-card.is-editable{cursor:pointer;}
html[data-theme] .badge.unknown{
  background:color-mix(in srgb, var(--paper-dim) 18%, transparent);
  color:var(--paper-dim);
  border-color:color-mix(in srgb, var(--paper-dim) 40%, transparent);
}
html[data-theme="glass-light"] .alert-action,html[data-theme="neumo"] .alert-action{
  background:color-mix(in srgb, var(--amber) 16%, #ffffff);
}
.alert-action.is-reserved{
  border-color:color-mix(in srgb, var(--ok) 45%, transparent);
  background:color-mix(in srgb, var(--ok) 20%, transparent);color:var(--ok);
}
html[data-theme="glass-light"] .alert-action.is-reserved,html[data-theme="neumo"] .alert-action.is-reserved{
  background:color-mix(in srgb, var(--ok) 16%, #ffffff);
}
html[data-theme="neumo"] .alert-bar,html[data-theme="neumo-dark"] .alert-bar{
  box-shadow:inset 1px 1px 2px rgba(0,0,0,.12);
}
#page-alert #btnAddInt,#alertCard #btnAddInt{min-height:44px;font-size:15px;font-weight:800;width:100%;touch-action:manipulation;}

/* ===== Themes: glass (default) / neumo / neon ===== */
html[data-theme="glass"],html[data-theme="neon"],html[data-theme="neumo-dark"]{color-scheme:dark;}
html[data-theme="neumo"],html[data-theme="glass-light"]{color-scheme:light;}

html[data-theme] .rank-row .km,html[data-theme] .rank-row .kml,html[data-theme] .rank-row .lit,
html[data-theme] .hist-item .d,html[data-theme] .hist-item .a,html[data-theme] .topbar .eyebrow,

html[data-theme] .modal-bg{background:rgba(0,0,0,.55);}
html[data-theme] .modal{background:var(--panel);border-color:var(--line);color:var(--paper);box-shadow:var(--card-shadow);border-radius:var(--radius-card) var(--radius-card) 0 0;}

html[data-theme] .veh-chip,html[data-theme] .chip-btn,html[data-theme] .icon-btn,

html[data-theme] .csv-chips button,html[data-theme] .btn.ghost,html[data-theme] .icon-pick button{

}
html[data-theme] .csv-chips button.on,html[data-theme] .btn.primary{background:var(--amber);color:var(--ink-on-accent);}
html[data-theme] a.more-link,html[data-theme] .link-btn,html[data-theme] .csv-mini button,
html[data-theme] .hist-item .kml,html[data-theme] .gas-help-body a{color:var(--amber);}

/* ----- glass: ink/navy + analogous blue→cyan light, visionOS-like frost ----- */

  --cold:#7ad7ff;
  --tab-home:#7ee0ff;--tab-input:#5ee0c8;--tab-hist:#6aa8ff;--tab-alert:#ff7a62;--tab-set:#9ad7ff;

  --chip-bg:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.32);--chip-fg:#f3f7ff;
  --kpi-bg:rgba(255,255,255,.10);--kpi-line:rgba(255,255,255,.28);

  --input-bg:rgba(6,12,24,.55);--input-line:rgba(255,255,255,.32);--input-fg:#fff;
  --nav-bg:rgba(7,14,28,.84);

html[data-theme="glass"]{

/* ----- neon: underground back-alley signs, grimier wall, moodier tubes ----- */
html[data-theme="neon"]{
  --asphalt:#0a0908;
  --panel:rgba(10,8,7,.9);
  --panel-light:#161210;
  --line:#2ec8d4;
  --paper:#f2f4f0;
  --paper-dim:#9aa89a;
  --amber:#2ec8d4;
  --ok:#b8d400;
  --danger:#ff3b80;
  --cold:#2ec8d4;
  --tab-home:#2ec8d4;--tab-input:#b8d400;--tab-hist:#e09a2a;--tab-alert:#ff3b80;--tab-set:#2ec8d4;

  --chip-bg:#120e0c;--chip-line:#2ec8d4;--chip-fg:#e8f4f0;
  --kpi-bg:rgba(10,8,7,.9);--kpi-line:#2ec8d4;
  --hairline:rgba(46,200,212,.16);
  --input-bg:#120e0c;--input-line:#2ec8d4;--input-fg:#e8f4f0;
  --nav-bg:#0a0908;
  --topbar-bg:rgba(10,9,8,.94);
  --ink-on-accent:#0a0908;
  --radius-card:16px;--radius-tile:14px;--radius-chip:12px;--radius-btn:12px;
  --card-border-w:2px;
  --tube:#2ec8d4;
  --card-shadow:0 0 0 3px #0a0908, 0 0 0 5px color-mix(in srgb, var(--tube) 70%, #000), 0 0 7px color-mix(in srgb, var(--tube) 70%, transparent), 0 0 16px color-mix(in srgb, var(--tube) 40%, transparent), inset 0 0 0 1px rgba(255,255,255,.18), inset 0 0 8px color-mix(in srgb, var(--tube) 16%, transparent);
  --tile-shadow:0 0 6px color-mix(in srgb, var(--tube) 35%, transparent);
  --nav-top-line:0 solid transparent;
}
html[data-theme="neon"]{
  background-color:#0a0908;
  background-image:
    radial-gradient(80% 50% at 50% -5%, rgba(46,200,212,.11), transparent 68%),
    radial-gradient(70% 45% at 88% 108%, rgba(224,154,42,.08), transparent 64%),
    radial-gradient(18px 10px at 22% 48%, rgba(20,14,8,.55), transparent 70%),
    radial-gradient(28px 14px at 71% 62%, rgba(0,0,0,.55), transparent 70%),
    radial-gradient(50% 40% at 12% 80%, rgba(36,22,12,.4), transparent 70%),
    radial-gradient(40% 30% at 88% 18%, rgba(0,0,0,.55), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 13px, rgba(0,0,0,.68) 13px 14px),
    linear-gradient(90deg, rgba(0,0,0,.62) 1px, transparent 1px) 0 0 / 70px 28px,
    linear-gradient(90deg, rgba(0,0,0,.58) 1px, transparent 1px) 35px 14px / 70px 28px,
    linear-gradient(180deg, #14110e, #0a0908 42%, #070605);
  background-attachment:fixed;
}
html[data-theme="neon"] body{background:transparent;}
html[data-theme="neon"] body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 22%, rgba(0,0,0,.66) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
  background-size:auto, 160px 160px;
  opacity:.55;
}
html[data-theme="neon"] #app{position:relative;z-index:1;}
html[data-theme="neon"] .topbar{z-index:30;border-bottom:0;box-shadow:0 1px 0 rgba(46,200,212,.18);}
html[data-theme="neon"] .nav{z-index:40;box-shadow:0 -1px 10px rgba(0,0,0,.55);}
html[data-theme="neon"] .modal-bg{z-index:80;}
html[data-theme="neon"] .toast{z-index:80;}

/* section tubes: cyan, hot pink, acid lime, warm red/amber — no purple */
html[data-theme="neon"] .tint-vehicle,
html[data-theme="neon"] .tint-odo,
html[data-theme="neon"] .tint-input,
html[data-theme="neon"] .tint-interval,
html[data-theme="neon"] .tint-misc,
html[data-theme="neon"] .tint-hide{--_t:#2ec8d4;--tube:#2ec8d4;}

html[data-theme="neon"] .tint-fuel,
html[data-theme="neon"] .tint-cat,
html[data-theme="neon"] .tint-theme{--_t:#e09a2a;--tube:#e09a2a;}
html[data-theme="neon"] .tint-tax{--_t:#ff5c3a;--tube:#ff5c3a;}
html[data-theme="neon"] .tint-alert{--_t:#ff3b80;--tube:#ff3b80;}
html[data-theme="neon"] .tint-year,
html[data-theme="neon"] .tint-sum,
html[data-theme="neon"] .tint-csv,
html[data-theme="neon"] .tint-sync{--_t:#b8d400;--tube:#b8d400;}

/* one slightly dimmer, dustier tube */
html[data-theme="neon"] .tint-hist{--_t:#6e9a8e;--tube:#6e9a8e;}

html[data-theme="neon"] .card,
html[data-theme="neon"] details.tax-fold,
html[data-theme="neon"] .modal,
html[data-theme="neon"] .tint,
html[data-theme="neon"] details.tax-fold.tint{
  --tube:var(--_t, #2ec8d4);
  background:rgba(10,8,7,.9);
  border:2px solid color-mix(in srgb, var(--tube) 70%, #fff 12%);
  border-radius:16px;
  position:relative;
  box-shadow:
    0 0 0 3px #0a0908,
    0 0 0 5px color-mix(in srgb, var(--tube) 72%, #000),
    0 0 7px color-mix(in srgb, var(--tube) 65%, transparent),
    0 0 16px color-mix(in srgb, var(--tube) 38%, transparent),
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 0 8px color-mix(in srgb, var(--tube) 16%, transparent);
}
html[data-theme="neon"] .card.tint-hist,
html[data-theme="neon"] .tint-hist{
  box-shadow:
    0 0 0 3px #0a0908,
    0 0 0 5px color-mix(in srgb, var(--tube) 55%, #000),
    0 0 4px color-mix(in srgb, var(--tube) 40%, transparent),
    0 0 9px color-mix(in srgb, var(--tube) 22%, transparent),
    inset 0 0 0 1px rgba(255,255,255,.1),
    inset 0 0 6px color-mix(in srgb, var(--tube) 10%, transparent);
  border-color:color-mix(in srgb, var(--tube) 55%, #000 20%);
}
html[data-theme="neon"] .kpi,
html[data-theme="neon"] .kpi.tint{
  --tube:var(--_t, #2ec8d4);
  background:rgba(10,8,7,.9);
  border:2px solid color-mix(in srgb, var(--tube) 70%, #fff 12%);
  border-radius:14px;
  box-shadow:
    0 0 0 2px #0a0908,
    0 0 0 3px color-mix(in srgb, var(--tube) 68%, #000),
    0 0 6px color-mix(in srgb, var(--tube) 55%, transparent),
    inset 0 0 0 1px rgba(255,255,255,.16);
}
html[data-theme="neon"] .sc-tile:not(.sc-fill){
  background:rgba(10,8,7,.9);
  border:2px solid color-mix(in srgb, var(--tube, #2ec8d4) 68%, #fff 14%);
  box-shadow:0 0 6px color-mix(in srgb, var(--tube, #2ec8d4) 32%, transparent), inset 0 0 0 1px rgba(255,255,255,.14);
}
html[data-theme="neon"] .sc-wrap{--tube:#e09a2a;}
html[data-theme="neon"] .card,html[data-theme="neon"] details.tax-fold,html[data-theme="neon"] .kpi-row{margin-bottom:12px;}
html[data-theme="neon"] .topbar h1{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
html[data-theme="neon"] .topbar h1 .brand-logo{
  font-family:var(--font-display);
  font-weight:800;
  letter-spacing:.04em;
  line-height:1;

  text-shadow:0 0 3px #fff, 0 0 8px #2ec8d4, 0 0 18px rgba(46,200,212,.75);

html[data-theme="neon"] .card h2,

}
html[data-theme="neon"] .kpi .val{
  text-shadow:0 0 6px color-mix(in srgb, var(--tube, var(--amber)) 45%, transparent);
}
html[data-theme="neon"] .nav button.active .tab-pill{
  box-shadow:0 0 6px var(--tab), 0 0 14px color-mix(in srgb,var(--tab) 55%, transparent), inset 0 0 0 1px rgba(255,255,255,.28);

html[data-theme="neon"] .nav button.active::before{display:none;}

html[data-theme="neon"] input[type=text],html[data-theme="neon"] input[type=number],
html[data-theme="neon"] input[type=date],html[data-theme="neon"] input[type=month],

html[data-theme="neon"] .toast{
  --tube:#2ec8d4;
  background:rgba(10,8,7,.95);

html[data-theme="neon"] .veh-chip,html[data-theme="neon"] .chip-btn,html[data-theme="neon"] .icon-btn,

/* ----- home banner (optional, per vehicle) ----- */
.home-banner{
  position:relative;height:120px;margin:0 0 10px;border-radius:var(--radius-card);
  overflow:hidden;isolation:isolate;
}
.home-banner .banner-photo{
  width:100%;height:100%;object-fit:cover;display:block;
  object-position:var(--banner-x,50%) var(--banner-y,50%);
  transform:scale(var(--banner-z,1));
  transform-origin:var(--banner-x,50%) var(--banner-y,50%);
  pointer-events:none;
}
.home-banner .banner-scrim{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.08) 28%, rgba(0,0,0,.58) 100%);
}
.home-banner .banner-meta{
  position:absolute;left:12px;right:12px;bottom:9px;z-index:1;
  display:flex;justify-content:space-between;align-items:flex-end;gap:8px;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);
  pointer-events:none;
}
.home-banner .banner-name{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.01em;line-height:1.15;}
.home-banner .banner-odo{font-family:var(--font-mono);font-weight:800;font-size:13px;letter-spacing:-.02em;white-space:nowrap;}
html[data-theme="glass"] .home-banner{
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.72);
}

  background:linear-gradient(180deg, rgba(7,16,28,.08) 24%, rgba(7,16,28,.62) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
html[data-theme="glass-light"] .home-banner{
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 8px 20px rgba(70,110,150,.16), 0 0 0 1px rgba(90,130,160,.22), inset 0 1px 0 #fff;
}
html[data-theme="glass-light"] .home-banner .banner-scrim{
  background:linear-gradient(180deg, rgba(21,32,43,.08) 24%, rgba(21,32,43,.58) 100%);

}
html[data-theme="neumo"] .home-banner{

}

}

html[data-theme="neon"] .home-banner{
  --tube:#ff5c3a;
  border:2px solid color-mix(in srgb, #ff5c3a 68%, #fff 12%);

  box-shadow:
    0 0 0 3px #0a0908,

.banner-edit{margin:8px 0 4px;}

<script>
(function(){
"use strict";
const C = window.KakeLogCalc;
const KEYS = {
  records: 'carlog_records',
  vehicles: 'carlog_vehicles',
  intervals: 'carlog_intervals',
  settings: 'carlog_settings',
  pending: 'carlog_pending_sync',
  pendingDel: 'carlog_pending_deletes',
  device: 'carlog_device_id',
  categories: 'carlog_categories',
  looks: 'carlog_builtin_looks'
};
const LEGACY_KEY_SETS = [
  {
    records: 'carmo_records',
    vehicles: 'carmo_vehicles',
    intervals: 'carmo_intervals',
    settings: 'carmo_settings',
    pending: 'carmo_pending_sync',
    pendingDel: 'carmo_pending_deletes',
    device: 'carmo_device_id'
  },
  {
    records: 'kakelog_records',
    vehicles: 'kakelog_vehicles',
    intervals: 'kakelog_intervals',
    settings: 'kakelog_settings',
    pending: 'kakelog_pending_sync',
    pendingDel: 'kakelog_pending_deletes',
    device: 'kakelog_device_id'
  }
];
function migrateLegacyKeys(){
  try{
    Object.keys(KEYS).forEach(function(k){
      if(localStorage.getItem(KEYS[k]) != null) return;
      for(var i=0;i<LEGACY_KEY_SETS.length;i++){
        var old = localStorage.getItem(LEGACY_KEY_SETS[i][k]);
        if(old != null){ localStorage.setItem(KEYS[k], old); break; }
      }
    });
  }catch(e){}
}

function escapeHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function jsArg(v){
  return escapeHtml(String(v == null ? '' : v)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029'));
}
function loadJson(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    const v = JSON.parse(raw);
    return v == null ? fallback : v;
  }catch(e){ return fallback; }
}
function saveJson(key, v){
  localStorage.setItem(key, JSON.stringify(v));
}
function newId(prefix){
  return (prefix || 'k') + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function getDeviceId(){
  let id = localStorage.getItem(KEYS.device);
  if(!id){ id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); localStorage.setItem(KEYS.device, id); }
  return id;
}
function yen(n){
  if(n == null || n === '' || !isFinite(Number(n))) return '—';
  return '¥' + Math.round(Number(n)).toLocaleString('ja-JP');
}
function km(n){
  if(n == null || n === '' || !isFinite(Number(n))) return '—';
  return Number(n).toLocaleString('ja-JP') + ' km';
}
function fmtDate(s){
  if(!s) return '';
  const d = C.toDate(s);
  if(!d) return String(s);
  return (d.getMonth()+1) + '/' + d.getDate();
}
function todayYmd(){
  return C.ymd(new Date());
}

/* Used only by loadDemoData() when the user explicitly adds sample data. Not seeded on a fresh install. */
const DEFAULT_VEHICLE = {
  id: 'v_zn6',
  name: '86 ZN6',
  displacementCc: 1998,
  fuelType: 'gasoline',
  registeredYm: '2012-04',
  weightKg: 1240,
  isKei: false,
  isEco: false,
  currentOdometer: null,
  nextShakenDate: '',
  jibaisekiMonths: 24,
  updatedAt: '2026-01-01T00:00:00.000Z'
};

let state = {
  records: [],
  vehicles: [],
  intervals: [],
  settings: { gasUrl: '', currentVehicleId: '', shortcuts: null, hiddenCategories: [], iconStyle: 'line', shortcutIconSize: 'm', shortcutSizes: {} },
  customCats: [],
  builtinLooks: {},
  pending: {},
  pendingDel: {},
  tab: 'home',
  histFilter: 'all',
  editId: null
};

function loadState(){
  migrateLegacyKeys();
  state.records = loadJson(KEYS.records, []);
  if(!Array.isArray(state.records)) state.records = [];
  state.vehicles = loadJson(KEYS.vehicles, null);
  if(!Array.isArray(state.vehicles)) state.vehicles = [];
  state.intervals = loadJson(KEYS.intervals, null);
  if(!Array.isArray(state.intervals) || state.intervals.length === 0){
    state.intervals = C.DEFAULT_INTERVALS.map(function(it){
      return Object.assign({}, it, { vehicleId: '', updatedAt: '2026-01-01T00:00:00.000Z' });
    });
    saveJson(KEYS.intervals, state.intervals);
  }
  state.settings = Object.assign({ gasUrl: '', currentVehicleId: (state.vehicles[0] && state.vehicles[0].id) || '' }, loadJson(KEYS.settings, {}));
  if(!state.settings.gasUrl) state.settings.gasUrl = '';
  state.settings.theme = normalizeTheme(state.settings.theme);
  applyTheme(state.settings.theme, false);
  if(!Array.isArray(state.settings.hiddenCategories)) state.settings.hiddenCategories = [];
  if(state.settings.iconStyle !== 'fill' && state.settings.iconStyle !== 'line') state.settings.iconStyle = 'line';
  state.settings.shortcutIconSize = normalizeShortcutIconSize(state.settings.shortcutIconSize) || 'm';
  if(!state.settings.shortcutSizes || typeof state.settings.shortcutSizes!=='object' || Array.isArray(state.settings.shortcutSizes)) state.settings.shortcutSizes = {};
  document.documentElement.removeAttribute('data-sc-size');
  state.customCats = loadJson(KEYS.categories, []);
  if(!Array.isArray(state.customCats)) state.customCats = [];
  state.builtinLooks = loadJson(KEYS.looks, {});
  if(!state.builtinLooks || typeof state.builtinLooks !== 'object' || Array.isArray(state.builtinLooks)) state.builtinLooks = {};
  // bi: rows accidentally stored as custom cats
  state.customCats = state.customCats.filter(function(c){
    if(!c || !c.id || String(c.id).indexOf('bi:')!==0) return true;
    applyBuiltinLookFromRow(c);
    return false;
  });
  state.pending = loadJson(KEYS.pending, {});
  state.pendingDel = loadJson(KEYS.pendingDel, {});
  ensureCurrentVehicle();
  migrateMergedCategories();
  migrateShakenFields();
}
function ensureCurrentVehicle(){
  if(!state.vehicles.length){
    state.settings.currentVehicleId = '';
    return;
  }
  if(!state.vehicles.some(function(v){ return v.id === state.settings.currentVehicleId; })){
    state.settings.currentVehicleId = state.vehicles[0].id;
  }
}
function migrateShakenFields(){
  if(C.migrateShakenDue(state.vehicles, new Date())) persistVehicles();
}
function migrateMergedCategories(){
  let recChanged = false;
  (state.records||[]).forEach(function(r){
    const beforeCat = r.category, beforeSub = r.subcategory;
    C.migrateRecordCategory(r);
    if(r.category!==beforeCat || r.subcategory!==beforeSub){
      recChanged = true;
      r.updatedAt = new Date().toISOString();
      if(typeof markPending==='function') markPending(r.id, r.updatedAt);
    }
  });
  if(recChanged) persistRecords();
  const hid = C.migrateHiddenCategories(state.settings.hiddenCategories||[]);
  const hidChanged = hid.length!==(state.settings.hiddenCategories||[]).length || hid.some(function(id,i){ return id!==state.settings.hiddenCategories[i]; });
  if(hidChanged){
    state.settings.hiddenCategories = hid;
    persistSettings();
  }
  let lookChanged = false;
  function adoptLook(from, to){
    if(!from || !to || from===to) return;
    const src = state.builtinLooks && state.builtinLooks[from];
    if(!src) return;
    if(!state.builtinLooks[to]){
      state.builtinLooks[to] = Object.assign({}, src);
      lookChanged = true;
    }
  }
  adoptLook('高速代', '交通費');
  adoptLook('装備品', 'カスタム費用');
  if(lookChanged) persistLooks();
  const fil = state.histFilter;
  if(fil && fil!=='all'){
    const mapped = C.categoryLabel(C.canonicalizeCategory(fil)) || fil;
    if(mapped!==fil) state.histFilter = mapped;
  }
}
function persistRecords(){ saveJson(KEYS.records, state.records); }
function persistVehicles(){ saveJson(KEYS.vehicles, state.vehicles); }
function persistIntervals(){ saveJson(KEYS.intervals, state.intervals); }

function normalizeShortcutIconSize(v){
  v = String(v==null?'':v).toLowerCase();
  if(v==='s' || v==='small' || v==='小') return 's';
  if(v==='l' || v==='large' || v==='大') return 'l';
  if(v==='m' || v==='medium' || v==='中' || v==='') return 'm';
  return 'm';
}
function defaultShortcutIconSize(){
  return normalizeShortcutIconSize(state.settings && state.settings.shortcutIconSize) || 'm';
}
function shortcutSizeMap(){
  const m = state.settings && state.settings.shortcutSizes;
  return (m && typeof m==='object' && !Array.isArray(m)) ? m : {};
}
function shortcutSizeOf(sc){
  sc = sc || {};
  if(sc.size) return normalizeShortcutIconSize(sc.size);
  const id = sc.id || '';
  const map = shortcutSizeMap();
  if(id && map[id]) return normalizeShortcutIconSize(map[id]);
  if(sc.customId){
    const cat = customCatById(sc.customId);
    if(cat && cat.size) return normalizeShortcutIconSize(cat.size);
  } else {
    const look = builtinLook(sc.id) || (sc.category ? builtinLook(sc.category) : null);
    if(look && look.size) return normalizeShortcutIconSize(look.size);
  }
  return defaultShortcutIconSize();
}
function setShortcutSize(id, size, persist){
  size = normalizeShortcutIconSize(size) || 'm';
  if(!state.settings.shortcutSizes || typeof state.settings.shortcutSizes!=='object' || Array.isArray(state.settings.shortcutSizes)){
    state.settings.shortcutSizes = {};
  }
  if(id) state.settings.shortcutSizes[id] = size;
  if(persist!==false) persistSettings();
  return size;
}
/* Back-compat: used to set the global size; now sets the inherited default for items without a size. */
function applyShortcutIconSize(size, persist){
  size = normalizeShortcutIconSize(size) || 'm';
  if(state && state.settings){
    state.settings.shortcutIconSize = size;
    if(persist) persistSettings();
  }
  document.documentElement.removeAttribute('data-sc-size');
  return size;
}
function shortcutIconSize(){ return defaultShortcutIconSize(); }
function persistSettings(){ saveJson(KEYS.settings, state.settings); }
function persistCategories(){ saveJson(KEYS.categories, state.customCats); }
function persistLooks(){ saveJson(KEYS.looks, state.builtinLooks); }

/* ----- home banners (IndexedDB, per vehicle) ----- */
const BANNER_DB_NAME = 'carlog_banners';
const BANNER_STORE = 'banners';
const BANNER_MAX_WIDTH = 1200;
const BANNER_MAX_BYTES = 250000;
let bannerDb = null;
const bannerCache = Object.create(null);

function bannerSupportWebp(){
  try{
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  }catch(e){ return false; }
}
function revokeBannerUrl(rec){
  if(rec && rec.url && String(rec.url).indexOf('blob:')===0){
    try{ URL.revokeObjectURL(rec.url); }catch(e){}
  }
}
function openBannerDb(){
  return new Promise(function(resolve, reject){
    if(bannerDb){ resolve(bannerDb); return; }
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(BANNER_DB_NAME, 1);
    req.onupgradeneeded = function(){
      const db = req.result;
      if(!db.objectStoreNames.contains(BANNER_STORE)) db.createObjectStore(BANNER_STORE, { keyPath:'vehicleId' });
    };
    req.onsuccess = function(){ bannerDb = req.result; resolve(bannerDb); };
    req.onerror = function(){ reject(req.error || new Error('banner db')); };
  });
}
function bannerStore(mode){
  return openBannerDb().then(function(db){
    const tx = db.transaction(BANNER_STORE, mode || 'readonly');
    return tx.objectStore(BANNER_STORE);
  });
}
function idbReq(req){
  return new Promise(function(resolve, reject){
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function cacheBannerRec(rec){
  if(!rec || !rec.vehicleId) return null;
  const prev = bannerCache[rec.vehicleId];
  if(prev && prev.url && prev.url !== rec.url) revokeBannerUrl(prev);
  const url = rec.url || (rec.blob ? URL.createObjectURL(rec.blob) : '');
  const out = {
    vehicleId: rec.vehicleId,
    blob: rec.blob,
    mime: rec.mime || (rec.blob && rec.blob.type) || 'image/jpeg',
    focalX: clampBannerFocal(rec.focalX, 50),
    focalY: clampBannerFocal(rec.focalY, 50),
    zoom: clampBannerZoom(rec.zoom),
    url: url,
    updatedAt: rec.updatedAt || new Date().toISOString()
  };
  bannerCache[rec.vehicleId] = out;
  return out;
}
function clampBannerFocal(v, fallback){
  const n = Number(v);
  if(!isFinite(n)) return fallback == null ? 50 : fallback;
  return Math.max(0, Math.min(100, n));
}
function clampBannerZoom(v){
  const n = Number(v);
  if(!isFinite(n)) return 1;
  return Math.max(1, Math.min(2.2, n));
}
function getBanner(vehicleId){
  return bannerCache[vehicleId] || null;
}
function hasBanner(vehicleId){
  const rec = bannerCache[vehicleId];
  return !!(rec && rec.url);
}
function putBanner(vehicleId, rec){
  if(!vehicleId || !rec || !rec.blob) return Promise.reject(new Error('banner required'));
  const stored = cacheBannerRec({
    vehicleId: vehicleId,
    blob: rec.blob,
    mime: rec.mime || rec.blob.type || 'image/jpeg',
    focalX: rec.focalX,
    focalY: rec.focalY,
    zoom: rec.zoom,
    updatedAt: new Date().toISOString()
  });
  return bannerStore('readwrite').then(function(st){
    return idbReq(st.put({
      vehicleId: vehicleId,
      blob: stored.blob,
      mime: stored.mime,
      focalX: stored.focalX,
      focalY: stored.focalY,
      zoom: stored.zoom,
      updatedAt: stored.updatedAt
    }));
  }).then(function(){ return stored; });
}
function removeBanner(vehicleId){
  const prev = bannerCache[vehicleId];
  if(prev){ revokeBannerUrl(prev); delete bannerCache[vehicleId]; }
  return bannerStore('readwrite').then(function(st){
    return idbReq(st.delete(vehicleId));
  }).catch(function(){ return null; });
}
function clearAllBanners(){
  Object.keys(bannerCache).forEach(function(id){ revokeBannerUrl(bannerCache[id]); delete bannerCache[id]; });
  return bannerStore('readwrite').then(function(st){
    return idbReq(st.clear());
  }).catch(function(){ return null; });
}
function loadAllBanners(){
  return bannerStore('readonly').then(function(st){
    return idbReq(st.getAll());
  }).then(function(rows){

function blobToImage(source){

    let w = img.naturalWidth || img.width || 0;

function generateAbstractBannerBlob(){
  const w = 1200, h = 400;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#12151c');
  g.addColorStop(0.45, '#1a2430');
  g.addColorStop(1, '#0c1014');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  function blob(x, y, r, color){
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  blob(260, 80, 260, 'rgba(46,140,200,0.45)');
  blob(980, 300, 280, 'rgba(40,180,150,0.32)');
  blob(700, 60, 200, 'rgba(220,90,70,0.22)');
  blob(120, 320, 180, 'rgba(180,200,80,0.16)');
  ctx.globalAlpha = 0.18;
  for(let i=0;i<7;i++){
    ctx.strokeStyle = i%2 ? 'rgba(180,220,230,0.7)' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2 + (i%3);
    ctx.beginPath();
    ctx.moveTo(-40 + i*80, h);
    ctx.quadraticCurveTo(300 + i*90, 40 + i*18, w+40, 80 + i*40);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const noise = ctx.getImageData(0, 0, w, h);
  const d = noise.data;
  for(let i=0;i<d.length;i+=16){
    const n = (Math.random()*30)|0;
    d[i] = Math.max(0, Math.min(255, d[i]+n-12));
    d[i+1] = Math.max(0, Math.min(255, d[i+1]+n-12));
    d[i+2] = Math.max(0, Math.min(255, d[i+2]+n-12));
  }
  ctx.putImageData(noise, 0, 0);
  return canvasToBlob(canvas, bannerSupportWebp() ? 'image/webp' : 'image/jpeg', 0.82);
}

function bindBannerEditor(vehicleId, mount){
  const wrap = mount || document.getElementById('vBannerEdit');
  if(!wrap) return;
  const file = document.getElementById('vBannerFile');
  const frame = document.getElementById('vBannerFrame');
  const img = document.getElementById('vBannerImg');
  const zoomEl = document.getElementById('vBannerZoom');
  const fyEl = document.getElementById('vBannerFocal');
  const pick = document.getElementById('vBannerPick');
  const rm = document.getElementById('vBannerRemove');
  const existing = getBanner(vehicleId);
  const draft = {
    blob: existing && existing.blob,
    url: existing && existing.url,
    mime: existing && existing.mime,
    focalX: existing ? existing.focalX : 50,
    focalY: existing ? existing.focalY : 50,
    zoom: existing ? existing.zoom : 1,
    removed: false,
    dirty: false
  };
  function applyVars(el){
    if(!el) return;
    el.style.setProperty('--banner-x', clampBannerFocal(draft.focalX,50)+'%');
    el.style.setProperty('--banner-y', clampBannerFocal(draft.focalY,50)+'%');
    el.style.setProperty('--banner-z', String(clampBannerZoom(draft.zoom)));
  }
  function paint(){
    const has = !!(draft.blob && !draft.removed && draft.url);
    wrap.classList.toggle('is-empty', !has);
    if(pick) pick.textContent = has ? '画像を選び直す' : 'バナーを追加';
    if(has){
      applyVars(wrap); applyVars(frame);
      if(img) img.src = draft.url;
    }
    if(zoomEl) zoomEl.value = String(draft.zoom);
    if(fyEl) fyEl.value = String(Math.round(draft.focalY));
  }
  paint();
  wrap._bannerDraft = draft;
  if(pick && file){
    pick.onclick = function(){ file.click(); };
    file.onchange = function(){
      const f = file.files && file.files[0];
      file.value = '';
      if(!f) return;
      compressBannerImage(f).then(function(out){
        if(draft.url && draft.url.indexOf('blob:')===0 && (!existing || draft.url !== existing.url)){
          try{ URL.revokeObjectURL(draft.url); }catch(e){}
        }
        draft.blob = out.blob;
        draft.mime = out.mime;
        draft.url = URL.createObjectURL(out.blob);
        draft.removed = false;
        draft.dirty = true;
        if(draft.zoom < 1) draft.zoom = 1;
        paint();
      }).catch(function(){ toast('画像を読み込めませんでした'); });
    };
  }
  if(rm) rm.onclick = function(){
    draft.removed = true;
    draft.dirty = true;
    paint();
  };
  if(zoomEl) zoomEl.oninput = function(){ draft.zoom = clampBannerZoom(zoomEl.value); draft.dirty = true; paint(); };
  if(fyEl) fyEl.oninput = function(){ draft.focalY = clampBannerFocal(fyEl.value, 50); draft.dirty = true; paint(); };
  if(frame){
    let dragging = false, lx = 0, ly = 0;
    function onDown(e){
      if(wrap.classList.contains('is-empty')) return;
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      lx = p.clientX; ly = p.clientY;
      if(e.pointerId != null && frame.setPointerCapture) try{ frame.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const r = frame.getBoundingClientRect();
      const dx = p.clientX - lx, dy = p.clientY - ly;
      lx = p.clientX; ly = p.clientY;
      const span = Math.max(1, (draft.zoom - 1) * 80 + 40);
      draft.focalX = clampBannerFocal(draft.focalX - (dx / Math.max(1,r.width)) * span, 50);
      draft.focalY = clampBannerFocal(draft.focalY - (dy / Math.max(1,r.height)) * span, 50);
      draft.dirty = true;
      if(fyEl) fyEl.value = String(Math.round(draft.focalY));
      paint();
      e.preventDefault();
    }
    function onUp(){ dragging = false; }
    frame.addEventListener('pointerdown', onDown);
    frame.addEventListener('pointermove', onMove);
    frame.addEventListener('pointerup', onUp);
    frame.addEventListener('pointercancel', onUp);
  }
  return draft;
}
function commitBannerDraft(vehicleId, draft){
  if(!vehicleId || !draft || !draft.dirty) return Promise.resolve(null);
  if(draft.removed || !draft.blob) return removeBanner(vehicleId);
  return putBanner(vehicleId, draft);
}

  recs.sort(function(a,b){

function syncStatusHtml(){
  const n = pendingCount();
  const url = (state.settings.gasUrl || '').trim();
  if(!url) return '<span class="sync-dot off"></span>未接続';
  if(lastSyncError) return '<span class="sync-dot err"></span>同期に失敗しました　未送信 '+n+'件';
  if(n) return '<span class="sync-dot pending"></span>接続済み　未送信 '+n+'件';
  return '<span class="sync-dot on"></span>接続済み　未送信 0件';
}

function updateSetTabSyncMark(){
  const btn = document.querySelector('nav.nav button[data-page="set"]');
  if(!btn) return;
  const pill = btn.querySelector('.tab-pill') || btn;
  let dot = pill.querySelector('.nav-sync-dot');
  const url = (state.settings.gasUrl || '').trim();
  const show = !!url && (lastSyncError || pendingCount()>0);
  if(!show){ if(dot) dot.remove(); btn.removeAttribute('data-sync-mark'); return; }
  if(!dot){
    dot = document.createElement('span');
    dot.className = 'nav-sync-dot';
    pill.appendChild(dot);
  }
  const err = !!lastSyncError;
  dot.classList.toggle('is-pending', !err);

  btn.setAttribute('data-sync-mark', err ? 'error' : 'pending');
}

function isGasExecUrl(url){
  return /\/exec(\/?$|\?)/.test(String(url||'').trim());
}
function isGasDevUrl(url){
  return /\/dev(\/?$|\?)/.test(String(url||'').trim());
}
let codeGsText = null;
let codeGsPromise = null;
function gsLineCount(text){
  if(!text) return 0;
  return String(text).split(/\r?\n/).length;
}
function fillCodeGsView(){
  const ta = document.getElementById('gsCodeText');
  if(ta && codeGsText != null) ta.value = codeGsText;
  const st = document.getElementById('gsCodeStatus');
  if(st){
    if(codeGsText != null) st.textContent = gsLineCount(codeGsText)+'行';
  }
}
function loadCodeGs(force){
  if(codeGsText != null && !force){
    fillCodeGsView();
    return Promise.resolve(codeGsText);
  }
  if(codeGsPromise && !force) return codeGsPromise;
  codeGsPromise = fetch('./Code.gs').then(function(res){
    if(!res || !res.ok) throw new Error(res ? ('http '+res.status) : 'network');
    return res.text();
  }).then(function(t){
    codeGsText = t;
    fillCodeGsView();
    return t;
  }).catch(function(err){
    codeGsPromise = null;
    const st = document.getElementById('gsCodeStatus');
    if(st) st.textContent = '読み込めませんでした';
    throw err;
  });
  return codeGsPromise;
}
function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.setAttribute('aria-hidden','true');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;padding:0;border:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return !!ok;
}
async function copyCodeGs(opts){
  opts = opts || {};
  try{
    const text = await loadCodeGs();
    if(text == null || text===''){ toast('Code.gs を読み込めませんでした'); return false; }
    let ok = false;
    if(!opts.forceFallback && navigator.clipboard && typeof navigator.clipboard.writeText==='function'){
      try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){ ok = false; }
    }
    if(!ok) ok = copyTextFallback(text);
    if(ok){
      toast('コピーしました（'+gsLineCount(text)+'行）');
      return true;
    }
    toast('コピーできませんでした。下の「コードを表示」から選択してください');
    return false;
  }catch(err){
    toast('Code.gs を読み込めませんでした');
    return false;
  }
}
function bindCodeGsUi(){
  const btn = document.getElementById('btnCopyGs');
  if(btn) btn.onclick = function(){ copyCodeGs(); };
  loadCodeGs();
}

async function testGasConnection(){
  const inp = document.getElementById('gasUrl');
  const url = ((inp && inp.value) || state.settings.gasUrl || '').trim();
  if(!url){ toast('URLを貼ってください'); return false; }
  if(isGasDevUrl(url)){
    toast('テスト用の /dev ではなく、末尾が /exec の URL を貼ってください');
    return false;
  }
  if(!isGasExecUrl(url) && url.indexOf('script.google.com')>=0){
    toast('末尾が /exec のウェブアプリ URL を貼ってください');
    return false;
  }
  state.settings.gasUrl = url;
  persistSettings();
  updateSyncBtn();
  try{
    const getUrl = url + (url.indexOf('?')>=0?'&':'?') + 'action=getAll';
    const res = await gasFetch(getUrl, null, 15000);
    let data = null;
    try{ data = await res.json(); }catch(e){ data = null; }
    if(res.ok && data && data.status==='ok'){
      lastSyncError = false;
      toast('接続できました');
      const st = document.getElementById('syncStatus');
      if(st) st.innerHTML = '<span class="sync-dot on"></span>接続できました　未送信 '+(pendingCount())+'件';
      updateSetTabSyncMark();
      return true;
    }
    lastSyncError = true;
    toast('接続に失敗しました（URLや承認を確認）');
    updateSyncStatus();
    return false;
  }catch(err){
    lastSyncError = true;
    toast('接続に失敗しました（URLや承認を確認）');
    updateSyncStatus();
    return false;
  }
}

function fillVehicleSelect(){
  const sel = document.getElementById('vehicleSelect');
  const wrap = document.getElementById('vehicleTitleWrap');
  const title = document.getElementById('vehicleTitle');
  if(!sel) return;
  if(!state.vehicles.length){
    sel.innerHTML = '';
    sel.hidden = true;
    sel.setAttribute('aria-hidden','true');
    if(title) title.textContent = '';
    if(wrap){ wrap.hidden = true; wrap.classList.remove('is-overflow'); }
    return;
  }
  sel.hidden = false;
  sel.removeAttribute('aria-hidden');
  if(wrap) wrap.hidden = false;
  const cur = state.settings.currentVehicleId;
  sel.innerHTML = state.vehicles.map(function(v){
    return '<option value="'+escapeHtml(v.id)+'"'+(v.id===cur?' selected':'')+'>'+escapeHtml(v.name)+'</option>';
  }).join('');
  if(title) title.textContent = selectedVehicleLabel(sel);
  scheduleVehicleSelectOverflow();
}

  if(title.textContent !== label) title.textContent = label;

function taxBundle(veh, asOf){
  if(!veh) return { jz: { amount:null, label:'', heavy:false, table:'' }, wt: { amount:null, tierLabel:'' }, jb: { amount:null, months:24, table:'', note:'' }, nextShaken:'' };
  asOf = asOf || new Date();
  const next = C.effectiveShakenDue(veh, asOf) || C.nextShakenDate(veh, asOf) || C.estimateNextShaken(veh.registeredYm, asOf);
  const jz = C.jidoshaZei({
    displacementCc: veh.displacementCc,
    registeredYm: veh.registeredYm,
    fuelType: veh.fuelType,
    isKei: veh.isKei,
    asOf: asOf
  });
  const wt = C.weightTax({
    weightKg: veh.weightKg,
    registeredYm: veh.registeredYm,

function isCustomInterval(it){
  if(!it) return false;
  if(it.custom) return true;
  return String(it.id||'').indexOf('cust')===0;
}
function isCustomIntervalId(id){ return String(id||'').indexOf('cust')===0; }
function intervalsFor(veh){
  if(!veh) return [];
  const vid = veh.id;
  const all = (state.intervals||[]).filter(function(it){ return it && !it.deleted; });
  const ownById = {};
  all.filter(function(it){ return it.vehicleId === vid; }).forEach(function(it){ ownById[it.id]=it; });
  const globals = all.filter(function(it){ return !it.vehicleId; });
  const seen = {};
  const list = [];
  all.filter(function(it){ return it.vehicleId === vid && isCustomInterval(it); }).forEach(function(it){
    if(!seen[it.id]){ list.push(it); seen[it.id]=true; }
  });
  globals.forEach(function(it){
    const use = ownById[it.id] || it;
    if(!seen[use.id]){ list.push(use); seen[use.id]=true; }
  });
  all.filter(function(it){ return it.vehicleId === vid && !isCustomInterval(it); }).forEach(function(it){
    if(!seen[it.id]){ list.push(it); seen[it.id]=true; }
  });
  return list.concat(customAlertItems());
}
function ensureVehicleInterval(id, veh){
  veh = veh || currentVehicle();
  if(!veh) return null;
  let it = state.intervals.find(function(x){ return x.id===id && x.vehicleId===veh.id && !x.deleted; });
  if(it) return it;
  const glob = state.intervals.find(function(x){ return x.id===id && !x.vehicleId && !x.deleted; });
  if(glob){
    it = Object.assign({}, glob, { vehicleId: veh.id, updatedAt: new Date().toISOString() });
    state.intervals.push(it);
    return it;
  }
  return null;
}
function upsertMaintenanceItem(fields){
  const veh = currentVehicle();
  if(!veh){ toast('まずは車を登録しましょう'); return null; }
  fields = fields || {};
  const now = new Date().toISOString();
  let it = fields.id ? state.intervals.find(function(x){ return x.id===fields.id && !x.deleted; }) : null;
  if(!it){
    const name = (fields.label||'').trim();
    it = {
      id: fields.id || newId('cust'),
      vehicleId: veh.id,
      label: name,
      category: fields.category || 'メンテナンス',
      subcategory: fields.subcategory || name,
      km: fields.km!=null && fields.km!=='' ? Number(fields.km) : null,
      months: fields.months!=null && fields.months!=='' ? Number(fields.months) : null,
      custom: true,
      deleted: false,
      lastReplacedDate: fields.lastReplacedDate || '',
      lastReplacedOdo: (fields.lastReplacedOdo==null || fields.lastReplacedOdo==='' || !isFinite(Number(fields.lastReplacedOdo))) ? null : Number(fields.lastReplacedOdo),
      updatedAt: now
    };
    if(it.km!=null && !isFinite(it.km)) it.km = null;
    if(it.months!=null && !isFinite(it.months)) it.months = null;
    state.intervals.push(it);
  } else {
    if(fields.label) it.label = String(fields.label).trim();
    if(fields.subcategory || fields.label) it.subcategory = fields.subcategory || fields.label;
    if(fields.category) it.category = fields.category;
    if('km' in fields) it.km = fields.km!=null && fields.km!=='' && isFinite(Number(fields.km)) ? Number(fields.km) : null;
    if('months' in fields) it.months = fields.months!=null && fields.months!=='' && isFinite(Number(fields.months)) ? Number(fields.months) : null;
    if('lastReplacedDate' in fields) it.lastReplacedDate = fields.lastReplacedDate || '';
    if('lastReplacedOdo' in fields){
      const n = fields.lastReplacedOdo==null || fields.lastReplacedOdo==='' ? null : Number(fields.lastReplacedOdo);
      it.lastReplacedOdo = isFinite(n) ? n : null;
    }
    if(fields.custom) it.custom = true;
    it.deleted = false;
    it.updatedAt = now;
    if(!it.vehicleId) it.vehicleId = veh.id;
  }
  if('lastReplacedDate' in fields && it) it.lastReplacedDate = fields.lastReplacedDate || '';
  if('lastReplacedOdo' in fields && it){
    const n2 = fields.lastReplacedOdo==null || fields.lastReplacedOdo==='' ? null : Number(fields.lastReplacedOdo);
    it.lastReplacedOdo = isFinite(n2) ? n2 : null;
  }
  persistIntervals();
  return it;
}
function deleteMaintenanceItem(id){
  const it = state.intervals.find(function(x){ return x.id===id && !x.deleted; });
  if(!it || !isCustomInterval(it)){ toast('組み込みの項目は削除できません'); return false; }
  it.deleted = true;
  it.updatedAt = new Date().toISOString();
  persistIntervals();
  return true;
}
function itemMatchesRecord(it, rec){
  if(!it || !rec) return false;
  return !!(C.lastRecordForItem([rec], rec.vehicle, it) || C.lastRecordForItem([rec], rec.vehicleId, it));
}
function applyLastReplacement(it, date, odo, when){
  const veh = currentVehicle();
  if(!it || !veh) return;
  const own = isCustomInterval(it) && it.vehicleId===veh.id
    ? it
    : (ensureVehicleInterval(it.id, veh) || it);
  if(!own) return;
  if(date) own.lastReplacedDate = date;
  if(odo!=null && odo!=='' && isFinite(Number(odo))) own.lastReplacedOdo = Number(odo);
  own.updatedAt = when || new Date().toISOString();
  persistIntervals();
  return own;
}
function touchLastReplacementFromRecord(rec){
  if(!rec || rec.deleted) return;
  const veh = (state.vehicles||[]).find(function(v){ return v.id===rec.vehicleId; })
    || (state.vehicles||[]).find(function(v){ return v.name===rec.vehicle; })
    || currentVehicle();
  if(!veh) return;
  let changed = false;
  intervalsFor(veh).forEach(function(it){
    if(!isReplaceableInterval(it) || !itemMatchesRecord(it, rec)) return;
    const own = isCustomInterval(it) && it.vehicleId===veh.id ? it : (ensureVehicleInterval(it.id, veh) || it);
    if(!own) return;
    const incoming = { date: rec.date||null, odometer: rec.odometer };
    const current = { date: own.lastReplacedDate||null, odometer: own.lastReplacedOdo };
    if(!C.hasBaselineValue(current) || C.isNewerBaseline(incoming, current) ||
       (String(incoming.date||'')===String(current.date||'') && Number(incoming.odometer||0)===Number(current.odometer||0))){
      if(rec.date) own.lastReplacedDate = rec.date;
      if(rec.odometer!=null && rec.odometer!=='' && isFinite(Number(rec.odometer))) own.lastReplacedOdo = Number(rec.odometer);
      own.updatedAt = rec.updatedAt || new Date().toISOString();
      changed = true;
    }
  });
  if(changed) persistIntervals();
}

function alertsFor(veh){
  if(!veh) return [];
  const list = C.computeAlerts(intervalsFor(veh), recordsOf(veh), vehicleName(veh), currentOdo(veh), new Date());
  const sh = C.shakenAlert(veh, new Date());
  if(sh){
    list.unshift({
      item: { id:'shaken', label:'車検' },
      status: sh.status,
      message: sh.message,
      dueDate: sh.dueDate,
      remainDays: sh.remainDays,
      last: null,
      kind: 'shaken'
    });
  }
  return list;
}
function isActiveAlert(a){
  return !!a && (a.status==='overdue' || a.status==='action' || a.status==='caution' || a.status==='soon' || a.status==='info');
}

/* ---------- summaries ---------- */
function inPeriod(dateStr, from, to){
  if(!dateStr) return false;
  return dateStr >= from && dateStr <= to;
}
function monthRange(d){
  d = d || new Date();
  const from = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return { from: from, to: C.ymd(last) };
}
function yearRange(d){
  d = d || new Date();
  return { from: d.getFullYear()+'-01-01', to: d.getFullYear()+'-12-31' };
}
function yearToDateRange(d){
  d = d || new Date();
  return { from: d.getFullYear()+'-01-01', to: C.ymd(d) };
}
function sumAmount(list, from, to){
  let s = 0;
  list.forEach(function(r){
    if(inPeriod(r.date, from, to)) s += Number(r.amount) || 0;
  });
  return s;
}
function byCategory(list, from, to){
  const map = {};
  list.forEach(function(r){
    if(!inPeriod(r.date, from, to)) return;
    const k = recordCategoryName(r);
    map[k] = (map[k] || 0) + (Number(r.amount) || 0);
  });
  return Object.keys(map).map(function(k){ return { name:k, amount:map[k] }; })
    .sort(function(a,b){ return b.amount - a.amount; });
}

/* ---------- render ---------- */
function fmtKmL(n){
  if(n==null || n==='' || !isFinite(Number(n))) return '—';
  return Number(n).toFixed(1)+' km/L';
}
function sortedRecords(veh){
  return recordsOf(veh).slice().sort(function(a,b){
    if(a.date!==b.date) return String(b.date).localeCompare(String(a.date));
    return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''));
  });
}
function monthShort(ym){
  const m = String(ym||'').match(/^(\d{4})-(\d{2})/);
  if(!m) return ym || '';
  return Number(m[2])+'月';
}

function fitShortcutLabels(root){
  root = root || document.getElementById('scGrid');

    t.classList.remove('sc-icon-only');

function scheduleFitShortcutLabels(){
  if(scheduleFitShortcutLabels._raf) cancelAnimationFrame(scheduleFitShortcutLabels._raf);
  scheduleFitShortcutLabels._raf = requestAnimationFrame(function(){
    scheduleFitShortcutLabels._raf = 0;
    requestAnimationFrame(function(){ fitShortcutLabels(); });
  });

function observeShortcutGrid(){
  const grid = document.getElementById('scGrid');
  if(!grid) return;
  if(typeof ResizeObserver === 'function'){
    if(!observeShortcutGrid._ro){
      observeShortcutGrid._ro = new ResizeObserver(function(){ scheduleFitShortcutLabels(); });
    }
    observeShortcutGrid._ro.disconnect();
    observeShortcutGrid._ro.observe(grid);
  }
  fitShortcutLabels(grid);
  scheduleFitShortcutLabels();
}

function lastNextHtml(last, dueDate, dueKm){

function remainLines(a){
  if(!a) return [];
  const lines = [];
  if(a.remainDays!=null && a.remainDays!==''){
    const st = a.dayStatus || (a.kind==='shaken' ? (a.status||'ok') : (Number(a.remainDays)<=0 ? 'overdue' : 'ok'));
    lines.push({ kind:'days', text: C.formatRemainDays(a.remainDays), status: st });
  }
  if(a.remainKm!=null && a.remainKm!==''){
    const st = a.kmStatus || (Number(a.remainKm)<=0 ? 'overdue' : 'ok');
    lines.push({ kind:'km', text: C.formatRemainKm(a.remainKm), status: st });

  const lines = remainLines(a);

  return '<div class="alert-card-remain">'+lines.map(function(ln){

  }).join('')+'</div>';
}
function remainHighlight(a){
  return remainLines(a).map(function(ln){ return ln.text; }).join('\n');

function alertUsedPct(a){
  const item = (a && a.item) || {};
  if(item.id==='shaken'){
    if(a.remainDays==null) return 0;
    if(a.remainDays<=0) return 100;
    const cycle = 24*30.4375;
    return Math.max(0, Math.min(100, (1 - a.remainDays/cycle)*100));
  }
  if(!C.hasBaselineValue(a && a.last)) return 0;
  const pcts = [];
  if(a.remainKm!=null && Number(item.km)>0){
    pcts.push(((Number(item.km) - a.remainKm) / Number(item.km)) * 100);
  }
  if(a.remainDays!=null && a.last && a.last.date && a.dueDate){
    const start = C.toDate(a.last.date), end = C.toDate(a.dueDate), now = new Date();
    if(start && end && end>start) pcts.push(((now-start)/(end-start))*100);
  } else if(a.remainDays!=null && Number(item.months)>0){
    const total = Number(item.months)*30.4375;
    if(total>0) pcts.push(((total - a.remainDays)/total)*100);
  }
  if(!pcts.length) return 0;
  return Math.max.apply(null, pcts);
}

  const shakenReserved = isShaken && (a.status==='reserved' || a.reserved || C.isShakenReserved(currentVehicle()));
  if(shakenOpen){
    actions.push('<button type="button" class="alert-action'+(shakenReserved?' is-reserved':'')+'" data-shaken-reserve="1" aria-pressed="'+(shakenReserved?'true':'false')+'">'+(shakenReserved?'予約済':'予約完了')+'</button>');

    '<div class="alert-card-head"><span class="name">'+escapeHtml(item.label||'')+'</span>'+badge+editBtn+'</div>'+

}

function onInputEnterKey(e){
  const isEnter = e.key==='Enter' || e.key==='Return' || e.keyCode===13 || e.which===13;
  if(!isEnter) return;
  const order = inputEnterOrder();
  let id = e.currentTarget && e.currentTarget.id;
  // 単価 is optional; send it on to 走行距離
  if(id==='fUnit' && order.indexOf('fOdo')>=0) id = 'fLiters';
  const i = order.indexOf(id);
  if(i<0) return;
  e.preventDefault();
  e.stopPropagation();
  if(i>=order.length-1){
    if(e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
    return;
  }
  const next = document.getElementById(order[i+1]);
  if(next) next.focus();
}
function bindInputEnterOrder(){
  const ids = ['fAmt','fLiters','fUnit','fOdo','fWt','fJb','fSt','fSv'];
  ids.forEach(function(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.removeEventListener('keydown', onInputEnterKey);
    el.addEventListener('keydown', onInputEnterKey);
  });
  const order = inputEnterOrder();
  order.forEach(function(id, i){
    const el = document.getElementById(id);
    if(el) el.setAttribute('enterkeyhint', i===order.length-1 ? 'done' : 'next');
  });
  const unit = document.getElementById('fUnit');
  if(unit) unit.setAttribute('enterkeyhint', 'next');
}

let fuelTyped = [];
const FUEL_IDS = { amount:'fAmt', liters:'fLiters', unitPrice:'fUnit' };

function readFuelValues(){
  const values = {}, hasValue = {};
  Object.keys(FUEL_IDS).forEach(function(k){
    const el = document.getElementById(FUEL_IDS[k]);
    const n = el && el.value !== '' ? Number(el.value) : NaN;
    values[k] = isFinite(n) && n > 0 ? n : null;
    hasValue[k] = values[k] != null;
  });
  return { values: values, hasValue: hasValue };
}
function markFuelAuto(derived){
  Object.keys(FUEL_IDS).forEach(function(k){
    const el = document.getElementById(FUEL_IDS[k]);
    const tag = document.getElementById('tag-'+k);
    const isAuto = !!(derived && k === derived);
    if(el) el.classList.toggle('auto-val', isAuto);
    if(tag) tag.hidden = !isAuto;
  });
}
function formatDerivedFuel(key, n){
  if(key === 'amount') return String(Math.round(n));
  if(key === 'unitPrice') return n.toFixed(1);
  return String(+(Math.round(n * 100) / 100).toFixed(2));
}
function onFuelFieldInput(field){
  if(!document.getElementById('fLiters')){ markFuelAuto(null); return; }
  const cur = readFuelValues();
  const plan = C.fuelSourcePlan(fuelTyped, field, cur.hasValue);
  fuelTyped = plan.typedOrder;
  if(!plan.derived || plan.sources.length !== 2){ markFuelAuto(null); return; }
  // Never rewrite the field the user is editing (clear, 0, or mid-retype).
  if(plan.derived === field){ markFuelAuto(null); return; }
  const out = C.deriveFuel(cur.values, plan.sources);
  if(!out.ok){ markFuelAuto(null); return; }
  const el = document.getElementById(FUEL_IDS[out.derived]);
  if(!el) return;
  el.value = formatDerivedFuel(out.derived, out[out.derived]);
  markFuelAuto(out.derived);
}
function bindFuelCalc(){
  fuelTyped = [];
  markFuelAuto(null);
  const map = { fAmt:'amount', fLiters:'liters', fUnit:'unitPrice' };
  Object.keys(map).forEach(function(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.oninput = function(){ onFuelFieldInput(map[id]); };
  });
}
function unbindFuelCalc(){
  Object.keys(FUEL_IDS).forEach(function(k){
    const el = document.getElementById(FUEL_IDS[k]);
    if(!el) return;
    el.oninput = null;
    el.classList.remove('auto-val');
  });
  fuelTyped = [];
  markFuelAuto(null);
}

const FUEL_GRADES = ['レギュラー','ハイオク','軽油'];
function normalizeFuelGrade(v){
  const s = String(v==null?'':v).trim();
  if(FUEL_GRADES.indexOf(s)>=0) return s;
  const map = { regular:'レギュラー', premium:'ハイオク', highoctane:'ハイオク', 'ハイオクガソリン':'ハイオク', diesel:'軽油', light:'軽油' };
  return map[s] || '';
}
function lastFuelGradeFor(veh){
  veh = veh || currentVehicle();
  if(!veh) return '';
  if(veh.lastFuelGrade!=null && veh.lastFuelGrade!=='') return normalizeFuelGrade(veh.lastFuelGrade);
  const recs = recordsOf(veh).filter(function(r){ return r && !r.deleted && r.category==='燃費' && normalizeFuelGrade(r.fuelGrade); })
    .sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')) || String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')); });
  return recs.length ? normalizeFuelGrade(recs[0].fuelGrade) : '';
}
function fuelGradeMeta(r){
  return r && r.category==='燃費' ? normalizeFuelGrade(r.fuelGrade) : '';
}

function saveForm(){
  const veh = currentVehicle();
  if(!veh){ toast('まずは車を登録しましょう'); openVehicleEditor(null); return; }
  const cat = document.getElementById('fCat').value;
  const rec0 = state.editId ? state.records.find(function(r){ return r.id===state.editId; }) : null;
  const rec = {
    id: state.editId || newId('k'),
    vehicle: veh.name,
    vehicleId: veh.id,
    date: document.getElementById('fDate').value || todayYmd(),
    category: cat,
    categoryId: (document.getElementById('fCatId') && document.getElementById('fCatId').value) || '',
    maintenanceItemId: (document.getElementById('fMaintId') && document.getElementById('fMaintId').value) || (state.editId && rec0 && rec0.maintenanceItemId) || '',
    subcategory: document.getElementById('fSub').value || '',
    amount: readNum('fAmt'),
    odometer: readNum('fOdo'),
    memo: document.getElementById('fMemo').value || '',
    liters: null, unitPrice: null, isFullTank: false, fuelGrade: '',
    weightTax: null, liability: null, stampFee: null, serviceFee: null,
    deviceId: getDeviceId(),
    updatedAt: new Date().toISOString()
  };
  rec.fuelGrade = '';
  if(cat==='燃費'){
    rec.liters = readNum('fLiters');
    rec.unitPrice = readNum('fUnit');
    rec.isFullTank = !!(document.getElementById('fFull') && document.getElementById('fFull').checked);
    rec.fuelGrade = normalizeFuelGrade(document.getElementById('fGrade') && document.getElementById('fGrade').value);
    if((rec.amount==null || rec.amount===0) && rec.liters && rec.unitPrice) rec.amount = Math.round(rec.liters*rec.unitPrice);
    veh.lastFuelGrade = rec.fuelGrade;
    persistVehicles();
  }
  if(cat==='車検'){
    rec.weightTax = readNum('fWt');
    rec.liability = readNum('fJb');
    rec.stampFee = readNum('fSt');
    rec.serviceFee = readNum('fSv');
    const sum = (rec.weightTax||0)+(rec.liability||0)+(rec.stampFee||0)+(rec.serviceFee||0);
    if((rec.amount==null || rec.amount===0) && sum>0) rec.amount = sum;
  }
  if(rec.odometer!=null){
    if(veh.currentOdometer==null || rec.odometer > Number(veh.currentOdometer)){
      veh.currentOdometer = rec.odometer;
      veh.updatedAt = rec.updatedAt;
      persistVehicles();
    }
  }
  const idx = state.records.findIndex(function(r){ return r.id===rec.id; });
  if(idx>=0) state.records[idx] = rec; else state.records.push(rec);
  persistRecords();
  markPending(rec.id, rec.updatedAt);
  touchLastReplacementFromRecord(rec);
  state.editId = null;
  state.inputPreset = null;
  toast('保存しました');
  updateSyncBtn();
  go('hist');
}

}

function parseSubs(text){
  return String(text||'').split(/[,、\n]/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function upsertCustomCategory(fields, opts){
  opts = opts || {};
  if(!fields || !String(fields.name||'').trim()) return null;
  const id = fields.id || newId('c');
  const cat = {
    id: id,
    name: String(fields.name).trim(),
    icon: fields.icon || 'star',
    color: safeColor(fields.color),
    style: safeStyle(fields.style),
    opacity: 'opacity' in fields ? clampOpacity(fields.opacity, null) : (fields.style!=null ? parseLookField(fields.style).opacity : undefined),
    subs: Array.isArray(fields.subs) ? fields.subs.filter(Boolean) : parseSubs(fields.subs),
    alertKm: (fields.alertKm==null || fields.alertKm==='') ? null : Number(fields.alertKm),
    alertMonths: (fields.alertMonths==null || fields.alertMonths==='') ? null : Number(fields.alertMonths),
    size: 'size' in fields ? (normalizeShortcutIconSize(fields.size)||'') : undefined,
    deleted: false,
    updatedAt: new Date().toISOString()
  };
  if(cat.alertKm!=null && !isFinite(cat.alertKm)) cat.alertKm = null;
  if(cat.alertMonths!=null && !isFinite(cat.alertMonths)) cat.alertMonths = null;
  const i = (state.customCats||[]).findIndex(function(c){ return c.id===id; });
  if(!('opacity' in fields)) delete cat.opacity;
  if(!('size' in fields)) delete cat.size;
  if(i>=0) state.customCats[i] = Object.assign({}, state.customCats[i], cat, { deleted:false });
  else {
    if(!state.customCats) state.customCats = [];
    state.customCats.push(cat);
  }
  persistCategories();
  if(opts.addShortcut){
    let ids = (state.settings.shortcuts && state.settings.shortcuts.slice()) || SHORTCUT_CATALOG.map(function(x){ return x.id; });
    const sid = 'cc:'+id;
    if(ids.indexOf(sid)<0) ids.push(sid);
    persistShortcuts(ids);
  }
  return customCatById(id);
}
function deleteCustomCategory(id, opts){
  opts = opts || {};
  const cat = customCatById(id);
  if(!cat) return false;
  const used = state.records.filter(function(r){ return !r.deleted && (r.categoryId===id || (!r.categoryId && r.category===cat.name)); });
  if(!opts.silent){
    if(used.length){
      if(!confirm('この費目の記録が'+used.length+'件あります。費目の定義は削除しますが、記録はそのまま残ります。')) return false;
    } else {
      if(!confirm('この費目を削除しますか？')) return false;
    }
  }
  cat.deleted = true;
  cat.updatedAt = new Date().toISOString();
  persistCategories();
  if(state.settings.shortcuts && state.settings.shortcuts.length){
    persistShortcuts(state.settings.shortcuts.filter(function(x){ return x!==('cc:'+id); }));
  }
  return true;
}

function shortcutSettingsHtml(){
  const enabled = (state.settings.shortcuts && state.settings.shortcuts.slice()) || SHORTCUT_CATALOG.map(function(s){ return s.id; });
  const enabledSet = {};
  enabled.forEach(function(id){ enabledSet[id]=true; });
  const ordered = [];
  enabled.forEach(function(id){ const s=shortcutById(id); if(s) ordered.push(s); });
  allShortcutDefs().forEach(function(s){ if(!enabledSet[s.id]) ordered.push(s); });
  return ordered.map(function(s, i){
    const on = !!enabledSet[s.id];
    const look = resolvedLook(s);

function collectShortcutIdsFromUi(){
  const rows = document.querySelectorAll('#shortcutSet .sc-edit');
  const ids = [];

    const on = row.querySelector('.sc-on');
    if(on && on.checked) ids.push(row.getAttribute('data-sid'));
  });
  return ids;
}
function bindShortcutSettings(){
  const box = document.getElementById('shortcutSet');
  if(!box) return;
  function commitAndRedraw(){
    persistShortcuts(collectShortcutIdsFromUi());
    renderSet();
  }
  box.onchange = function(e){
    if(e.target && e.target.classList.contains('sc-on')) commitAndRedraw();
  };
  box.onclick = function(e){
    const lookBtn = e.target.closest('.sc-look');
    if(lookBtn){
      const row = lookBtn.closest('.sc-edit');
      const sid = row && row.getAttribute('data-sid');
      const sc = shortcutById(sid);
      if(!sc) return;
      if(sc.customId) openCategoryEditor(sc.customId);
      else if(sc.kind==='replace') openCategoryEditor('bi:'+sc.id, { builtin:true, shortcut:sc });
      else openCategoryEditor('bi:'+sc.category, { builtin:true, shortcut:sc });
      return;
    }
    const up = e.target.closest('.sc-up');
    const down = e.target.closest('.sc-down');
    if(!up && !down) return;
    const row = e.target.closest('.sc-edit');
    if(!row) return;
    if(up && row.previousElementSibling && row.previousElementSibling.classList.contains('sc-edit')){
      row.parentNode.insertBefore(row, row.previousElementSibling);
    }
    if(down && row.nextElementSibling && row.nextElementSibling.classList.contains('sc-edit')){
      row.parentNode.insertBefore(row.nextElementSibling, row);
    }
    commitAndRedraw();
  };
}

function sanitizeFilenamePart(s){
  s = String(s == null ? '' : s).trim();
  s = s.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, '_');
  s = s.replace(/_+/g, '_').replace(/^_|_$/g, '');
  return s || '車';
}
